    reviewer: null
    reviewer_method: >-
      AUTOMATED_EVIDENCE, not a human review. Seven Catch2 cases under [ast-018]
      cover the fourteen named sentinels, the three crewed view distances, the
      ordinary visual range, and the Unknown fallback for reserved-but-unnamed
      sentinels. One case pins the case that motivated the tolerance: the ODOL 73
      fixture stores the 1e13 geometry sentinel as 9999999827968.0f, which an
      equality check would miss. The full engine suite runs 2405 cases with the
      same 6 pre-existing environment failures as before the change (dev-mode
      gate, and localisation data absent from packages/Remaster).

      The basis is typed rather than free text: GeometryBasis carries winding,
      normal orientation, tangent handedness, source origin and the
      centre-of-mass relationship, each with its own confidence
      (Unknown/Assumed/Established/Measured). Unknown is the default, so a
      consumer that needs a tangent frame learns this build cannot supply one
      instead of reading a plausible default. The legacy sourceWinding string is
      derived from the record via DescribeWinding, so the label and the typed
      form cannot drift; a test pins all three existing string values.

      Winding is measured rather than assumed for the ODOL 73 path: the file
      supplies both index order and per-vertex normals, so the cross product of
      each face's first two edges is compared against its own stored normal. All
      16 faces oppose, none agree, none are degenerate. A companion case
      establishes the fixture is a double-sided sheet (24 of 48 vertex normals
      point away from the origin), which is what makes the unanimity meaningful
      rather than a property of outward faces only.

      The named-selection weight fix is pinned from the fixtures rather than by
      construction: real MLOD selections are loaded and every member's source
      byte is required to be non-zero and parallel to the vertex index list,
      with a guard that the test examined something. A second case pins the
      deliberate emptiness of vertexWeights, so the non-decode reads as a
      decision and fails the day someone decodes it for real.

      The flag-bit split is surveyed against the shipped corpus rather than left
      as an unused capability: all twelve P3D fixtures load and none carries a
      vertex or face bit this build cannot name. The survey asserts it read every
      file it listed, so a silent load failure cannot report a clean corpus by
      finding nothing.

      One case pins the parity claim for the draw-path change directly: every
      sentinel the shape path's old ResolGeometryOnly table listed still
      classifies geometry-only, the visual range still does not, and the single
      deliberate difference (the gunner fire-geometry sentinel) is named.

      Owner report, 2026-08-08: NPC faces appear translucent when riding as a
      jeep passenger. Investigated and NOT attributed to this work. The slot
      assignment is the only mechanism here that could cause it -- the code after
      it does _lods[_geometry]->OrSpecial(IsAlpha | IsAlphaFog | IsColored), so a
      visual LOD in a geometry slot would render translucent -- and a test now
      runs the old macro chain and the new switch side by side over every
      sentinel (1e15 x 1..20, plus 1e13 and its float-rounded form) and the whole
      ordinary and crewed-view range, requiring agreement and requiring that no
      visual resolution is ever assigned a slot. Separately, the soldier's head
      in the training capture is 99.73% pixel-identical before and after the
      change, with a maximum channel difference of 1. Translucent faces were
      therefore a pre-existing symptom with a cause elsewhere, since found and
      fixed: Backend::IsAlpha routed to AlphaBlend any face whose texture
      classified Opaque (OFP head textures are DXT1 with no alpha channel at
      all), so a solid head soft-blended against the framebuffer. Fixed in
      EngineWgpu; owner confirmed resolved 2026-08-08.

      Owner smoke test, 2026-08-08: drove a jeep in the installed game against
      the deployed build, no issues. That exercises the driver view and, since
      the vehicle was moving over terrain, the roadway and land-contact special
      LODs -- the parts of the rewritten index assignment most likely to show a
      wrong slot. Gunner, commander and cargo seats were NOT tested, and no
      building interior was entered.

      Rendered: the original training mission was captured through the deployed
      WGPU build and read. Terrain, structures, the character, the weapon
      viewmodel, grass and shadows all draw; no geometry-only LOD leaks into the
      frame, and the run logged no unknown-spec-LOD lines.

      NOT checked: the capture is a single frame of one mission and was not
      diffed against a matched baseline -- the older reference capture differs by
      session nondeterminism (grass instancing, AI position), so a pixel diff
      against it measures nothing. No model exercising the gunner fire-geometry
      sentinel was found, so that fix is reasoned and unit-pinned, not observed.
    supersedes: []
