        PROCESS: this ticket is not in the overlay's authorised_tickets list. It
        was picked up because its scheduling_state still read BLOCKED on AST-007
        long after AST-007 was INTEGRATED, which was read as "unblocked" -- but
        unblocked is not the same as authorised. The work and its evidence stand;
