      - capability: SOURCE_GEOMETRY_BASIS
        status: PARTIAL
        denominator: >-
          winding measured on the ODOL 73 path (16 of 16 faces, unanimous),
          established from the engine's own loader on SP3X, assumed on P3DM;
          tangent handedness and the centre-of-mass relationship are recorded as
          Unknown on every path
      - capability: MLOD_PROXIES
        status: UNVERIFIED
        denominator: >-
          proxies now reach the IR from 3 fixtures with identity, selection and
          an orthonormal frame invariant under all 6 vertex permutations; 0
          rendered, because retail CWA content is ODOL
      - capability: SECTION_FACE_RANGE
        status: PARTIAL
        denominator: >-
          the ODOL 73 path publishes firstFace/faceCount in source face order,
          checked against the LOD's declared face-data size; the ODOL v7 path
          reports faceRangeKnown false rather than an unconverted number
    known_failures:
      - >-
        PROCESS: this ticket is not in the overlay's authorised_tickets list. It
        was picked up because its scheduling_state still read BLOCKED on AST-007
        long after AST-007 was INTEGRATED, which was read as "unblocked" -- but
        unblocked is not the same as authorised. The work and its evidence stand;
        the authorisation does not, and the integration owner should either add
        it to authorised_tickets or decide otherwise.
      - >-
        Three slices are done: typed LOD purposes, the known/unknown flag-bit
        split, preservation of the MLOD named-selection weight byte, a measured
        winding for the ODOL 73 path, a typed source-geometry basis with a
        confidence per axis, MLOD proxy extraction, and section boundaries
        published as a face range on the ODOL 73 path.
      - >-
        The ODOL 73 winding is measured only relative to the model's own stored
        normals: all 16 faces of the reference fixture wind clockwise about them,
        unanimously across both facings of a double-sided sheet. It is not a
        claim about which way faces point on screen, and it rests on the packed
        normal's scale factor being negative -- taken from the BIS reference and
        not independently confirmed. Flip that sign and the conclusion flips.
        Still no render.
      - >-
        The MLOD selection weight byte is preserved but NOT decoded.
        NamedSelection::vertexWeights -- the linear 0-255 scale ShapeAdapter
        consumes -- is deliberately left empty on the MLOD path, so every MLOD
        selection vertex still behaves as fully weighted exactly as before. The
        byte's actual scale is not established: the BIS reference carries it
        undecoded too, so there was no second implementation to check against.
        Decoding it on a guess would silently reweight every skinned MLOD model.
      - >-
        MLOD proxy transforms are built by following the engine's own proxy scan
        (LODShape, ShapeLOD.cpp) step for step, and are pinned for orthonormality
        and independence from selection vertex order. They have NOT been compared
        against a reference transform from real content, and no MLOD model with
        proxies has been rendered -- retail CWA content is ODOL, so the training
        capture does not exercise this path at all. Before this change MLOD
        models reached the IR with no proxies whatsoever, so the change cannot
        regress attachment placement, only start doing it.
        Section::startTriangle/triangleCount still hold the source's own offsets
        -- byte offsets on the ODOL v7 path, face-data offsets on the ODOL 73
        path, a triangle index on neither -- because ShapeAdapter's FindSections
        needs them in source form. The same boundary is now also published as a
        face range (firstFace/faceCount in source face order) with an explicit
        faceRangeKnown flag, but only the ODOL 73 path sets it. The v7 byte-offset
        conversion has not been established, so v7 sections report the range as
        unknown rather than as empty.
      - >-
        VertexFlags::UserMask (0xFF0000) overlaps LightMask (0xF0000), so the
        per-vertex lighting bits are also inside the user range. That comes from
        data3d.h. It is recorded and pinned by test, not resolved -- deciding
        which reading is right needs content evidence this build does not have.
      - >-
        The unnamed-bit survey covers the twelve P3D files in tests/fixtures
        only, and all twelve are clean. That is a small, repo-local corpus of
        mostly generated fixtures -- it is not the owner's 6,405-file reference
        corpus, and it says nothing about what retail content carries. No loader
        logs unnamed bits at runtime either.
      - >-
        The three copies of the sentinel table in the shape path (LevelName, the
        special-LOD index assignment, and ResolGeometryOnly) now delegate to the
        IR table, but Shape::IsSpecLevel and the VIEW_COMMANDER/VIEW_PILOT
        comparisons in TransportCore and Simul still take raw floats. The macros
        in SpecLods.hpp remain the source of those constants.
      - >-
        The crewed-view slots (_geometryViewGunner, _geometryViewCommander,
        _geometryViewCargo) are unverified against real content. The owner's
        smoke test covered the driver seat only, and the training-mission capture
        contains no crewed vehicle. A wrong slot there would show as a bad or
        empty interior view for those seats specifically.
      - >-
        One deliberate behaviour change: the old ResolGeometryOnly listed the
        fire-geometry sentinel but not its gunner variant (1e15 * 16), so that
        LOD was loaded with normals as if it were drawable. It is geometry-only
        now. No model in the captured training mission exercises it -- the run
        logged no unknown-spec-LOD lines at all -- so the fix is reasoned and
        unit-pinned, not observed.
      - >-
        Sentinels at 1e15 * 9, 12 and 14 are commented out in the engine's own
        SpecLods table. They classify as Unknown, which keeps them undrawable,
        but this build cannot say what they are.
    fallback: >-
      A resolution at or above 1e5 that matches no known sentinel classifies as
      Unknown rather than Visual, so an unrecognised special LOD stays undrawable
      instead of being treated as geometry at an absurd viewing distance.
    reviewer: null
    reviewer_method: >-
      AUTOMATED_EVIDENCE, not a human review. Seven Catch2 cases under [ast-018]
      cover the fourteen named sentinels, the three crewed view distances, the
      ordinary visual range, and the Unknown fallback for reserved-but-unnamed
      sentinels. One case pins the case that motivated the tolerance: the ODOL 73
      fixture stores the 1e13 geometry sentinel as 9999999827968.0f, which an
      equality check would miss. The full engine suite runs 2405 cases with the
      same 6 pre-existing environment failures as before the change (dev-mode
      gate, and localisation data absent from packages/Remaster).

      The basis is typed rather than free text: GeometryBasis carries winding,
      normal orientation, tangent handedness, source origin and the
      centre-of-mass relationship, each with its own confidence
      (Unknown/Assumed/Established/Measured). Unknown is the default, so a
      consumer that needs a tangent frame learns this build cannot supply one
      instead of reading a plausible default. The legacy sourceWinding string is
      derived from the record via DescribeWinding, so the label and the typed
      form cannot drift; a test pins all three existing string values.

      Winding is measured rather than assumed for the ODOL 73 path: the file
      supplies both index order and per-vertex normals, so the cross product of
      each face's first two edges is compared against its own stored normal. All
      16 faces oppose, none agree, none are degenerate. A companion case
      establishes the fixture is a double-sided sheet (24 of 48 vertex normals
      point away from the origin), which is what makes the unanimity meaningful
      rather than a property of outward faces only.

      The named-selection weight fix is pinned from the fixtures rather than by
      construction: real MLOD selections are loaded and every member's source
      byte is required to be non-zero and parallel to the vertex index list,
      with a guard that the test examined something. A second case pins the
      deliberate emptiness of vertexWeights, so the non-decode reads as a
      decision and fails the day someone decodes it for real.

      The flag-bit split is surveyed against the shipped corpus rather than left
      as an unused capability: all twelve P3D fixtures load and none carries a
      vertex or face bit this build cannot name. The survey asserts it read every
      file it listed, so a silent load failure cannot report a clean corpus by
      finding nothing.

      One case pins the parity claim for the draw-path change directly: every
      sentinel the shape path's old ResolGeometryOnly table listed still
      classifies geometry-only, the visual range still does not, and the single
      deliberate difference (the gunner fire-geometry sentinel) is named.

      Owner report, 2026-08-08: NPC faces appear translucent when riding as a
      jeep passenger. Investigated and NOT attributed to this work. The slot
      assignment is the only mechanism here that could cause it -- the code after
      it does _lods[_geometry]->OrSpecial(IsAlpha | IsAlphaFog | IsColored), so a
      visual LOD in a geometry slot would render translucent -- and a test now
      runs the old macro chain and the new switch side by side over every
      sentinel (1e15 x 1..20, plus 1e13 and its float-rounded form) and the whole
      ordinary and crewed-view range, requiring agreement and requiring that no
      visual resolution is ever assigned a slot. Separately, the soldier's head
      in the training capture is 99.73% pixel-identical before and after the
      change, with a maximum channel difference of 1. Translucent faces were
      therefore a pre-existing symptom with a cause elsewhere, since found and
      fixed: Backend::IsAlpha routed to AlphaBlend any face whose texture
      classified Opaque (OFP head textures are DXT1 with no alpha channel at
      all), so a solid head soft-blended against the framebuffer. Fixed in
      EngineWgpu; owner confirmed resolved 2026-08-08.

      Owner smoke test, 2026-08-08: drove a jeep in the installed game against
      the deployed build, no issues. That exercises the driver view and, since
      the vehicle was moving over terrain, the roadway and land-contact special
      LODs -- the parts of the rewritten index assignment most likely to show a
      wrong slot. Gunner, commander and cargo seats were NOT tested, and no
      building interior was entered.

      Rendered: the original training mission was captured through the deployed
      WGPU build and read. Terrain, structures, the character, the weapon
      viewmodel, grass and shadows all draw; no geometry-only LOD leaks into the
      frame, and the run logged no unknown-spec-LOD lines.

      NOT checked: the capture is a single frame of one mission and was not
      diffed against a matched baseline -- the older reference capture differs by
      session nondeterminism (grass instancing, AI position), so a pixel diff
      against it measures nothing. No model exercising the gunner fire-geometry
      sentinel was found, so that fix is reasoned and unit-pinned, not observed.
    supersedes: []
