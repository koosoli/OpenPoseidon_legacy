      6,405 files across three corpora with zero parse failures, every P3D LOD
      walked to its #EndOfFile# tagg and every PBO to its entry table, and a
      desynchronised walk throws rather than guessing. The generated fixtures round
      -trip through this walker and through the independent C++ reader, so two
      implementations agree on the layout. All seven dependencies of the vegetation
      fixture were resolved to named PBOs.

