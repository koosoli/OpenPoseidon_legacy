    evidence_hash: 7ee1d35597b9bf8d1b0420a033e512380bd1d1e6b8a6d753424f8f124dc79692
    decision_record: docs/roadmap/decisions/MAT-030-treeadv-shader-family-20260809.md
    capability_claims:
      - capability: SUPERMATERIAL
        status: PARTIAL
        denominator: >-
          Super schema over 2,853 materials; of the 1,222 in 22 other families,
          those in the 17 still without a schema bind nothing
      - capability: SHADER_FAMILY_SCHEMA
        status: VALIDATED
        denominator: >-
          8 of 23 observed families have a schema: Super, Normal, NormalMap,
          TreeAdv, TreeAdvTrunk, TreeAdvTrans, Skin, Multi (layer 0 + mask only)
      - capability: TREEADV_SHADER_FAMILY
        status: VALIDATED
        denominator: >-
          stage table measured over all 547 TreeAdv-family materials in the four
          shipped Arma 3 vegetation PBOs (plants_f 100, vegetation_f_exp 204,
          vegetation_f_enoch 225, vegetation_f_argo 18); Stage1 normal 547/547,
          Stage2 MCA 547/547; resolved through the production WGPU draw path on
          2 models from 2 PBOs, a3\plants_f\tree\t_pinusp3s_f.p3d and
          a3\vegetation_f_enoch\tree\t_betula_pendula_3s.p3d, both drawing correctly
      - capability: MCA_CHANNEL_SEMANTICS
        status: VALIDATED
        denominator: >-
          n=181 _mca textures in the four shipped Arma 3 vegetation PBOs: RGB varies
          in 179/181 and is grey in 0/181; alpha is absent in the 128 DXT1 files
          (constant 255 decoded) and present in all 53 DXT5 files, varying in 47.
          Layout named, not consumed -- no renderer path samples the slot
      - capability: RETAINED_CUTOUT_ALPHA_PARITY
        status: VALIDATED
        denominator: >-
          The installed Stratis WGPU scene exercises GPU-driven retained vegetation.
          Its binary DXT1/PAC foliage alpha now takes the same AlphaStats::Cutout
          alpha_ref >= 0.5 path as the direct WGPU draw path; the prior retained
          path drew opaque dark-green leaf cards.
    known_failures:
      - >-
        SUPERMATERIAL: PARTIAL. Six families now have a schema. Materials in the
        remaining 17 observed families (NormalMapMacroASSpecularDIMap 195,
        NormalMapSpecularDIMap 191, Detail 90, Skin 77, ...) bind nothing and
        report every stage as unmapped, which is deliberate -- guessing an
        unregistered family's stages is what the roadmap forbids.
      - >-
        No value is reinterpreted. SMDI lands in SpecularDetail and stays SMDI;
        converting it to roughness is MAT-020's decision and needs its own
        evidence. Parallax/NOPX has no slot because Super does not use one.
      - >-
        MCA is named but not consumed. Stage2 binds to its own MacroAmbient slot
        and its channels are measured, but no renderer path samples it, so no macro
        tint or occlusion term reaches a pixel. The alpha term is declared as
        ambientShadow and deliberately not as alpha: read as transparency it would
        punch holes through bark wherever the occlusion is dark.
      - >-
        TreeAdv Stage3..Stage7 stay unmapped: exactly 1 of 547 corpus materials
        declares them, and one witness does not describe a family. TreeAdv's
        Stage0 is recorded as unused by the family (absent in 369/369) rather than
        mapped, so a TreeAdv material that did declare one reports it unmapped.
      - >-
        OPEN QUESTION, not caused here: the Enoch birch
        a3\vegetation_f_enoch\tree\t_betula_pendula_3s.p3d resolves both TreeAdv
        families across all 13 LODs and draws correctly at 4 m -- green foliage and
        white bark, which is the species' real bark colour -- but at 16 m its canopy
        thins to a near-skeleton. Identical with the normal map disabled, so not this
        mapping. Either correct LOD behaviour or alpha coverage lost to mip-averaging
        a 1-bit cutout whose Stage0 is 87% fully transparent; unresolved, and a
        plausible lead for the distance-dependent canopy artefacts reported earlier.
        GL33 is no control for it: from the same camera it draws the tree as one
        opaque dark mass with no cutout applied at all.
      - >-
        The canopy is not validated. Two-sided foliage lighting, the
        TreeAdvModNormals vertex-normal path, and alpha/cutout behaviour are
        untouched by this mapping, and the dark-patch reports on canopy tops
        remain unexplained by it.
    fallback: >-
      An unknown shader family leaves every slot empty rather than binding by
      guesswork, and the AST-014 source IR still carries everything the material
      declared, so nothing is lost by the schema declining to translate.
    reviewer: null
    reviewer_method: >-
      AUTOMATED_EVIDENCE, not a human review. The stage->slot table was measured
      across all 2,853 Super materials in the corpora rather than assumed. The
      corpus carries two independent witnesses: a procedural stage names its own
      role in the texture string (`...,DT)`), and a file texture carries a suffix.
      They agree, giving Stage1 NormalMap ~99%, Stage2 Detail ~96%, Stage3 Macro
      ~93%, Stage4 AmbientShadow ~90%, Stage5 SpecularDetail ~99%, Stage6 Fresnel
      ~99%, Stage7 Environment (2,529 of 2,844 are ca\data\env_land_co.tga).

      Re-checked against the corpus after implementation: of 12,110 bindings that
      have a filename to compare, the suffix corroborates the slot in 9,055.
      Every disagreement is explained rather than waved past. 2,821 are Stage7,
      whose environment maps are named `_co` -- the systematic case that proves the
      point of the design, since a suffix-driven classifier calls all 2,821 a base
      colour. 225 more are `_ca` colour maps reused in Detail/Macro slots, which is
      legitimate authoring. Excluding the Stage7 systematic, disagreement is 234 of
      9,289 (2.5%). 9 Catch2 assertions... 7 cases, 37 assertions under [mat-030];
      full suite green apart from the 6 failures pre-existing at HEAD.

      NOT checked for Super: nothing was rendered and no Super material was drawn,
      so no claim is made that a translated Super material looks correct -- only
      that stages land in the slots the corpus says they occupy. The suffix
      agreement rate measures self-consistency between two descriptions of the same
      file, not correctness against an authored reference.

      TreeAdv/TreeAdvTrunk/TreeAdvTrans (67b4797) were measured the same way and
      over their whole population rather than a sample: all 547 TreeAdv-family
      materials in the four shipped Arma 3 vegetation PBOs. Stage1 is the normal
      map in 547/547 (459 _nohq/_no files, 64 procedural nohq/no, 5 outliers whose
      suffix disagrees and is reported); Stage2 is MCA in 547/547 (297 procedural
      mca, 193 _mca files, 47 _mc, 8 procedural mc, 1 procedural dt, and every
      disagreement reported rather than rerouted). Stage0 is absent in 369/369
      TreeAdv and present in 4/172 TreeAdvTrunk, which is why only the trunk family
      maps it. 8 Catch2 cases under [mat-030][treeadv]; [mat-030] now 15 cases /
      91 assertions, all green.

      Unlike the Super slice, this one was rendered. The shipped Arma 3 pine
      (a3\plants_f\tree\t_pinusp3s_f.p3d, ODOL 73, 13 LODs, 5,931 faces at visual
      LOD 0) was placed through --test-model into a live mission and drawn by the
      production WGPU path with WGR_GPU_DRIVEN=0 and no debug material selector.
      Both its sections resolve schema=true across all 13 LODs, the trunk's Stage1
      resolves the real bark_pinussylvestris_l3_nohq.paa (procedural=false,
      exists=true) and Stage2 the mca at uv=tex1, and the foliage section's two
      procedural stages are correctly not sampled. Toggling
      WGR_MATERIAL_DISABLE_NORMAL moves 35.2% of the trunk's pixels with a peak
      per-pixel delta of 207 against a peak of 3 over a sky control, so the bark
      normal reaches the shader rather than merely resolving.

      MCA's packing was then measured the same way the NOHQ/SMDI/AS maps were, over
      all 181 _mca textures in those PBOs. RGB varies in 179/181 and is grey in
      0/181, so it is a colour triple. Alpha splits exactly along the compression
      format: the 128 DXT1 files carry no alpha and decode to a constant 255, and
      all 53 DXT5 files carry a real one (47 varying over 0..255, 6 constant at
      174). That is BI's documented "occlusion is optional" behaviour appearing in
      the data, and it makes declaring the channel safe, since the majority decode
      to an occlusion term of none.

      NOT checked for TreeAdv: no renderer path samples MacroAmbient, so a named
      channel is not a consumed one; the canopy's lighting was not validated and its 6-unit peak
      delta only shows a flat procedural normal behaving as one; and no Arma 1/2
      vegetation family was in this corpus.
    supersedes: []
    evidence:
      - engine/Poseidon/Asset/Formats/Material/ShaderSchema.hpp
      - engine/Poseidon/Asset/Formats/Material/RvMaterialSource.hpp
      - engine/Poseidon/Asset/Formats/Material/MaterialChannels.hpp
