    decision_record: docs/roadmap/decisions/WLD-013-bank-mount-prefix-20260810.md
    capability_claims:
      - capability: BANK_MOUNTS_UNDER_ITS_DECLARED_PREFIX
        status: VALIDATED
        denominator: >-
          Surveyed over 716 local archives before the rule was changed. CWA retail:
          215 archives, 4 carry a header-extension block, 3 declare a prefix, 0
          declare one that differs from the filename. CWA Demo: 14 archives, 1 with
          a header extension, 1 declares a prefix, 0 differ. Arma 3: 487 archives,
          487 carry a header extension, 487 declare a prefix, 483 differ. So
          preferring the declaration is a measured no-op on all 229 local OFP/CWA
          archives and corrects 483 of 487 Arma 3 archives. anims_f_data.pbo settles
          it on principle: it declares the multi-segment root a3\anims_f\data, which
          no filename-derived rule produces under any separator convention. Does not
          cover: community or mission PBOs of any generation, Arma 1 and Arma 2/OA
          installs (not surveyed here), or any archive outside the three local
          installs.
      - capability: A3_ARCHIVES_ADDRESSABLE_IN_A_RUNNING_GAME
        status: UNVERIFIED
        denominator: >-
          Zero Arma 3 addons were mounted in a running game at this commit. The whole
          of the runtime evidence is the unmodified OFP arm: PoseidonCoreTests 792
          passed / 4 skipped / 6,085 assertions, run_preview0_wgpu_check.ps1 -Backend
          wgpu boots and mounts its banks, and the mission capture smoke renders
          identically to the pre-change capture. WLD-015 addendum 2 later measured
          that this rule never fired outside its unit test, because QFBank::open()
          reads no header and GetProperty("prefix") was therefore always empty at
          mount time; the runtime half of this ticket is carried by WLD-015, not
          here.
    known_failures:
      - >-
        BankList::Unload still derives its search key from the filename and so cannot
        find a bank mounted under a declared prefix. Left as is and commented, because
        nothing calls it.
      - >-
        The AutoBank de-duplication check in GameState::LoadBanks still tests the
        filename-derived key, before the archive is opened, so for an archive that
        declares a different root it now tests a key other than the one the bank
        mounts under. Untested for A3 content.
      - >-
        No A3 world loads, no A3 object is instantiated and no A3 content renders as
        a result of this change. Addressability only.
    fallback: >-
      A declaration containing ".." or ":" or exceeding 240 characters is rejected and
      the previous caller-derived mount name is used. An archive with no declaration
      takes the old path unchanged, which is every local OFP/CWA archive that matters
      and 0 measured behaviour changes there.
    reviewer: null
    reviewer_method: >-
      Machine-checked: three Catch2 [IO][Banks] cases over the free function
      ResolveBankMountName -- declared-wins, derived fallback, and refusal of a
      declaration that could escape the namespace -- inside a PoseidonCoreTests run of
      792 passed / 4 skipped / 6,085 assertions; plus the 716-archive census across
      three local installs as the safety denominator, and the OFP preview-0 WGPU boot
      and mission capture smoke as the no-regression arm, with the capture opened and
      compared rather than merely reported. Not checked: no Arma 3 archive was mounted
      in a running game, so nothing here verifies the rule fires in production -- WLD-015
      later measured that it did not; BankList::Unload and the AutoBank de-duplication
      key were not exercised; and the test file lives under tests/, which the evidence
      hash ignores.
