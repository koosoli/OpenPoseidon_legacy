    decision_record: docs/roadmap/decisions/PERF-002-the-arma-3-frame-is-the-water-reflection-20260813.md
    capability_claims:
      - capability: PLANAR_REFLECTION_IS_THE_DOMINANT_A3_FRAME_COST
        status: VALIDATED
        denominator: >-
          6 arms x 3 interleaved rounds at 1920x1080, Stratis at
          --test-world-freefly 2446.86 4413.66 67.97 115.5 -8.2,
          --screenshot-delay 300, nothing else running. Medians -- base 34.36 ms
          (30.40-48.00); WGR_ABLATE=planar 26.42 ms (22.52-35.87), -7.94 ms and
          23%; ao 31.37, -2.99; clouds 32.31, -2.05; grass 39.53, +5.17 (ranges
          overlap, reads as noise); WGR_MSAA=1 67.41, +33.05. Corroborated
          independently by named GPU regions from a base run -- Planar terrain
          3.137 + clouds 1.135 + objects 0.884 = 5.16 ms of named work against a
          7.94 ms ablation, the difference being the resolve and mip chain. This
          is one machine, one world, one camera, one resolution, one build. The
          ranking is what is claimed; the absolute 34.36 ms is not portable, and
          no other camera, world, GPU or resolution was measured -- in
          particular, this camera shows the sea as a distant strip, so the result
          says the cost does NOT scale with water coverage rather than
          characterising a water-heavy view.
      - capability: INTERLEAVED_AB_IS_THE_ONLY_TRUSTWORTHY_FORM
        status: VALIDATED
        denominator: >-
          3 identical captures -- same binary, same scene, same settle -- returned
          18.99 / 20.91 / 55.59 ms, a 2.9x spread, purely because other work was
          compiling on the machine. The renderer was not varying. Every absolute
          frame time from a degraded machine is therefore consistently wrong, and
          only interleaved A/B/C comparisons (A1 B1 C1 A2 B2 C2, never AAA BBB)
          survive it, because GPU clock ramp and thermal drift move monotonically
          with wall clock and blocked runs charge all of that drift to whichever
          arm ran second. Anyone quoting a number from this ticket must quote the
          delta, not the absolute.
      - capability: WGR_ENV_GATES_ARE_INERT
        status: VALIDATED
        denominator: >-
          4 gate families measured inert -- WGR_GRASS, WGR_GRASS_DENSITY,
          WGR_GRASS_DISTANCE, WGR_SKY_VIS*. The C++ side rebuilds and pushes the
          settings structs every frame, so an env var read once at construction
          decides frame 0 and is then overwritten; sky_vis.rs says so in a
          comment. WGR_ABLATE exists because of this and applies at the push
          site, where nothing downstream can undo it. Not an audit of every WGR_*
          variable -- only these four were tested, and any other construction-time
          gate should be assumed inert until measured.
      - capability: MSAA_1_SAMPLE_PATH_COST
        status: CAPTURED_NOT_INTERPRETED
        denominator: >-
          WGR_MSAA=1 measured 67.41 ms median (min 59.55) against a 34.36 ms
          base, +33.05 ms, consistently across all 3 rounds. One sample cannot
          really cost 33 ms more than four; something in the 1-sample path is
          pathological -- a missing fast path, a resolve degenerating into a full
          copy, or a pipeline rebuilt per frame. The number is captured and the
          mechanism is unknown. Not to be acted on, and not to be quoted as an
          MSAA policy result.
      - capability: GRASS_RENDER_COST
        status: UNVERIFIED
        denominator: >-
          0 measured costs for grass exist. WGR_ABLATE=grass came out 5.17 ms
          SLOWER than base with almost fully overlapping ranges (28.72-59.37 vs
          30.40-48.00), which reads as noise -- but that leaves two live
          possibilities that this ticket cannot separate: grass is genuinely free
          at this camera, or the ablation is not removing the work, which would
          be a defect in the gate itself.
      - capability: PLANAR_COVERAGE_GATE
        status: VALIDATED
        denominator: >-
          PERF-004 implemented all 3 recommended changes: an exact water
          occlusion query with faded coverage policy, dedicated one-sample
          reflected pipelines, and adaptive below-half-resolution reflection
          with reduced-view LOD and bounded freshness. Named planar subregions
          are exposed through the ABI and overlay. On the same DayZ diagnostic
          scene the earlier policy run recorded 26.92-29.21 ms planar and the
          final one-sample run recorded 5.356 ms (sky 0.876, terrain 1.147,
          objects 0.784, clouds 1.773, mips 0.776), about 80% below the 26.92 ms
          sample. Same machine and scene; not a portable absolute.
    known_failures:
      - >-
        HISTORICAL PERF-002 WARNING, superseded by PERF-004's named timers and
        exact coverage query. Every frame-time number produced earlier in this session is void, for two
        independent reasons -- most WGR_* gates silently revert to the pushed
        value, and the machine was not quiet (2.9x spread across identical
        captures). A gate that silently reverts is worse than no gate: it yields
        a plausible number for the wrong configuration.
      - >-
        A third trap was in the capture harness -- declared -Width/-Height
        parameters that were never appended to the command line, so every "1080p"
        capture silently ran at 800x600. That one cost a wrongly-reverted change.
      - >-
        WGR_MSAA=1 measuring 33 ms slower than 4x is unexplained. It may indicate
        something that also costs at 4x, so it is worth finding regardless of any
        MSAA policy -- but nothing should be changed on the strength of that
        number alone.
      - >-
        HISTORICAL, superseded by PERF-004. No fix had landed at this checkpoint;
        the later implementation and runtime measurements are recorded in the
        PERF-004 decision.
      - >-
        No benchmark artefact is tracked in the repository for these runs; the
        table in the decision record is the record.
    fallback: >-
      WGR_ABLATE=planar removes the pass and returns the 23% today. It removes
      planar water reflections entirely, so it is a quality trade rather than a
      fix -- but it is measured, available now, and applies at the push site
      where the frame-by-frame settings push cannot undo it.
    reviewer: null
    reviewer_method: >-
      AUTOMATED_EVIDENCE, not a human review. Machine-checked -- 6 arms x 3
      interleaved rounds captured at a fixed camera and resolution with the
      medians, minima and maxima recorded; the planar result cross-checked
      against named GPU timer regions from a base run (5.16 ms of named planar
      work against a 7.94 ms ablation); the inert gates identified from the
      per-frame settings push and confirmed against the sky_vis.rs comment; and
      the machine-noise floor established by three identical repeat captures.
      Not checked -- any second machine, GPU, world, camera or resolution; the
      absolute frame times, which a degraded machine makes consistently wrong and
      which only survive as interleaved deltas; the cause of the WGR_MSAA=1
      regression; whether the grass ablation removes any work at all; and every
      recommended remedy, none of which is implemented or measured. No automated
      test guards any of this. The test id above names a reproducible measurement run, not a CTest case: no automated test exists for this ticket, and that is the weakest part of this record.
