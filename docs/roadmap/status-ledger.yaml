    capability_claims:
      - capability: TAKISTAN_ROAD_ASSET_CENSUS
        status: VALIDATED
        denominator: >-
          13,501 road links placed over 122 segment models on Takistan, all
          parsing, and all 8 RVMATs in roads_e classified -- 6
          NormalMapSpecularMap (S1 _nohq, S2 _sm/_smdi) and 2
          NormalMapDetailSpecularMap (S1 _nohq, S2 procedural
          (argb,8,8,3)color(0.5,0.5,0.5,1,DT), S3 _sm). Not one declares a
          Stage0, which is what ShaderSchema already encodes for both families.
          One segment measured in full -- dirt7_w7_a0_802_r500.p3d, ODOL 49, 3
          LODs, LOD0 of 10 points, 8 faces, 1 texture. Covers Takistan and
          roads_e only -- no other world's road net, no Chernarus/Stratis/OFP or
          Arma 1 road models, and no claim about how any of it looks.
      - capability: ROAD_BANDING_IS_NOT_ASSET_PARSE_OR_MATERIAL
        status: VALIDATED
        denominator: >-
          Over that same census of 122 models and 8 RVMATs, with every asset
          resolving, three classes are excluded -- missing asset, parse failure,
          material-family gap. The symptom is reproduced on one capture at the
          Takistan village road (camera 2651.7 848.3 383.0 looking at 2663.4
          855.8 378.6) as alternating light and dark trapezoids, one key per
          placed segment. The classification is what is claimed; the cause is
          not isolated at this commit.
      - capability: ROAD_BANDING_ALBEDO_VS_LIGHTING
        status: SUPERSEDED
        denominator: >-
          0 of 2 -- undecided at this commit and deliberately left undecided.
          The Materials-tab Base Color Only view was captured and read as
          evidence, then withdrawn -- road sections are on-surface routed
          (render::IsOnSurfaceRouting, excluded from the retained set by
          IsGpuOwnedSection), so they draw on the CPU complement and the
          retained path's debug views never reach them. SUPERSEDED by WLD-021 at
          e54ea18, which decided it by a GL33/wgpu control on identical data and
          also killed both mechanisms proposed here as next steps -- per-segment
          UV placement and a polygon-offset difference. Carried rather than
          deleted because it is a true statement about this commit, but a reader
          who acted on the "leading candidates" line would now be wrong.
      - capability: ODOL49_UV_DEQUANTISATION_CORRECTNESS
        status: CAPTURED_NOT_APPLIED
        denominator: >-
          1 mapping defect identified and left unfixed. The reader computes
          1.52587890625e-05 * (u + 32767) * du + minU, so an int16 spans
          [-1, 65534] of 65536 rather than [0, 65535] of 65535 -- the low end
          lands below minU and the high end short of maxU. The error is ~1.5e-5
          relative, four orders of magnitude too small to produce visible
          per-segment banding. Not corrected here, on purpose -- bundling it with
          a roads fix would confound two independent changes.
    known_failures:
      - >-
        The cause of the banding is not isolated. This ticket classifies and
        reproduces it and closes off three wrong answers; it does not fix
        anything and no code changed at this commit.
      - >-
        The retained-path debug views (Materials tab, Base Color Only) do not
        reach on-surface sections at all, so any reading of roads through them
        is void. That trap cost one wrong conclusion in this session before it
        was caught.
      - >-
        The ODOL 49 UV dequantisation error is real, understood, and still in
        the reader.
    fallback: >-
      Nothing changed, so nothing can regress -- the roads render exactly as they
      did. The census and the classification stand on their own, and the ODOL 49
      UV nit is deliberately left in place so that a later roads fix cannot be
      confounded with it.
    reviewer: null
    reviewer_method: >-
      AUTOMATED_EVIDENCE, not a human review. Machine-checked -- the placement
      and model counts (13,501 links over 122 segment models) and the RVMAT
      family split (8 materials, 2 families, no Stage0 anywhere) were read out of
      the Takistan world and roads_e directly; one segment model was decoded to
      its LOD0 counts; the banding was reproduced on a capture at a recorded
      camera; the ODOL 49 dequantisation arithmetic was worked out from the
      source expression rather than observed. Not checked -- whether the banding
      is albedo or lighting (the debug view used to test that does not reach
      on-surface sections, so it answered nothing), any cause at all, any world
      other than Takistan, any road family outside roads_e, and the ODOL 49 UV
      correction, which is identified but not applied and has no before/after. The test id above names a reproducible measurement run, not a CTest case: no automated test exists for this ticket, and that is the weakest part of this record.
