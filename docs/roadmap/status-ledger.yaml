    known_failures:
      - >-
        AMENDED 2026-08-14 by CORE-NEG-003. The fallback line below was not true in
        general when it was written. `WgrAbiCheck` compared `sizeof` for four types
        -- itself, WgrSurfaceDesc, WgrLogCallbacks and WgrFrame -- out of the 45 that
        cross the boundary, so drift in any other struct passed the handshake
        silently. `WgrSkyRuntime` grew 80 -> 112 bytes in `f88f0ea` without an ABI
        bump, and an engine binary from before that commit shook hands with a
        renderer from after it and read 32 bytes past the struct: no error, no
        entry-point failure, wrong pixels. A session was spent diagnosing the
        resulting garbage as a moon rendering bug that did not exist in the source.
        The per-build `static_assert`s were correct throughout and could not help,
        because they only fire when both sides are compiled together -- which is not
        how this project ships. See
        `docs/roadmap/decisions/CORE-NEG-003-abi-guard-checked-four-structs-20260814.md`.
    fallback: >-
      C++ refuses an ABI mismatch before renderer creation -- true for the four
      types this ticket's guard named, and from CORE-NEG-003 onward for all 45, via
      a constexpr hash over the whole set rather than a hand-maintained list. A
      same-size field reorder still passes on both.
    reviewer: Oliver Kay
    reviewer_method: >-
      Owner smoke test 2026-08-03 on the deployed WGPU build: launched with --render wgpu --window --dev, loaded a mission, flew the camera, opened the dev panel, and quit cleanly. The session ran the C++ client against the Rust cdylib across the versioned ABI for its whole duration with no entry-point or layout failure, which is this ticket's runtime claim. The static guarantee rests on the compile-time size and offset asserts held on both sides of the boundary, not on this session.
    supersedes: []
