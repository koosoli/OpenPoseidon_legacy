    milestone: 2C
    milestone_role: NON_BLOCKING_VALIDATION
    depends_on: []
    blocked_by: []
    blocks: []
    implementation_commits: [12117df]
    production_call_sites: []
    test_ids: [arch-001-gengine-call-site-census]
    benchmark_artifacts: []
    evidence_hash: b0e38bd9940d9e4910dc74af748cf85cbd54c6c5163164153098551ce5efb0de
    decision_record: docs/roadmap/decisions/ARCH-001-simulation-render-separation-audit-20260812.md
    capability_claims:
      - capability: SIMULATION_DOES_NOT_READ_RENDERER_STATE
        status: VALIDATED
        denominator: >-
          Every GEngine-> call site in World/, AI/, Game/ and Network/
          classified by method -- 40 of ~394 files in those trees mention GEngine
          (~10%), yielding ~200 HUD/text/2D drawing calls (output-only), ~40
          draw-queue control calls (output-only), ~10 scene-delta pushes, 17
          GetAccomodateEye/ProceduralSkyActive calls that sit inside draw code
          (Object.cpp colour paths, SceneDraw.cpp, LandscapeRender.cpp), 4
          CanGrass calls used only for draw-pass ordering, and 15
          SamplePixel/GetFrameCounter calls confined to test-only SQF commands in
          GameStateExtTest*.cpp. 0 gameplay paths read renderer state. This is a
          static classification over four trees at one commit -- it does not cover
          Graphics/ or Core/, it is not enforced by anything, and a call added
          tomorrow would not be caught.
      - capability: HEADLESS_RUNS_WITHOUT_A_GRAPHICS_BACKEND
        status: VALIDATED
        denominator: >-
          5 binaries already run through the Poseidon::CreateEngineDummy() seam --
          the dedicated server (ServerApplication.cpp:251), PoseidonFormats
          (:107,:122), the poseidon lister (:109), pbo (:65) and PoseidonTools
          (:94). apps/cwr/Server/CMakeLists.txt links GameBase + Poseidon and
          nothing else -- no PoseidonGL33, no WGPU, no PoseidonOpenAL -- so the
          build breaks if that is violated. The property holds by link graph, not
          by a test that would say so.
      - capability: PUSH_BASED_PRESENTATION_CHANNEL
        status: VALIDATED
        denominator: >-
          3 virtuals with empty default bodies (Engine.hpp:418-420) --
          SceneObjectCreated/Removed/Moved -- pushed from 4 simulation sites
          (Landscape.cpp:2131, :2162, :2255, LandSave.cpp:517) and consumed by the
          WGPU backend at 3 sites (EngineWgpu.cpp:3381, :3450, :3487) into
          wgr_instance_add / wgr_instance_update. Because the defaults are
          no-ops, headless costs nothing. The retained path now carries
          essentially the whole world -- the legacy per-draw path is down to
          roughly 7 sections per frame.
      - capability: LARGE_SIM_RENDER_SEPARATION_REFACTOR
        status: NOT_PRODUCED
        denominator: >-
          0 of 11 stated goals are blocked by simulation/render coupling.
          Goal-by-goal -- headless server already ships; multiplayer authority,
          deterministic simulation, save/load and late join, replay/rollback,
          physics, deterministic ballistics and Zeus are all sim-side and gated on
          a fixed timestep or on serialisation, not on the render boundary;
          renderer replacement is already true behind GraphicsEngineFactory; and
          OFP/A1/A2/A3 compatibility is actively helped by leaving it alone. Only
          AI-agent testing (which wants a stable snapshot to assert on) and later
          independent render rate benefit. The refactor is therefore deliberately
          not produced, and an immutable per-frame snapshot is explicitly
          declined in favour of the existing delta channel.
      - capability: FIXED_TIMESTEP_SIMULATION
        status: NOT_PRODUCED
        denominator: >-
          0 accumulators or fixed-step loops found anywhere in engine/Poseidon/
          or apps/. World::Simulate(float deltaT, bool&) (World.cpp:124) takes a
          variable frame delta, and GameLoop.cpp:60 welds the sim and render ticks
          1:1 with window focus threaded into the simulation via
          SetSimulationFocus. This -- not render coupling -- is what blocks
          deterministic simulation, replay/rollback, MP authority and
          deterministic ballistics, and it is the one item whose cost grows with
          every new subsystem written against a variable deltaT.
      - capability: ARCHITECTURE_GUARD_TEST
        status: NOT_PRODUCED
        denominator: >-
          0 of 2 assertions written -- that the server target links no graphics or
          audio backend, and that no file under World/, AI/, Game/ or Network/
          includes a WGPU or GL33 header. The audit names this its
          highest-value item precisely because the separation currently holds by
          accident of the link graph, so nothing fails loudly when it erodes.
      - capability: RENDERER_WRITE_BACK_INTO_SIMULATION
        status: CAPTURED_NOT_APPLIED
        denominator: >-
          3 sites found and left in place -- EngineWgpu.cpp:3467, :3484 and :3505
          all call obj->SetGpuCoverage(...). It is render-only data parked on the
          simulation entity and read only by the renderer, harmless today, but it
          means an Object differs between a rendering client and a headless
          server. The single inversion of the dependency direction found by the
          audit; not moved off Object here.
      - capability: RENDER_CODE_FILED_IN_THE_SIMULATION_TREE
        status: CAPTURED_NOT_APPLIED
        denominator: >-
          4,312 of World/'s 96,624 lines (4.5%) are pure render code --
          World/Terrain/LandscapeRender.cpp (1,990) and World/Scene/SceneDraw.cpp
          (2,322) -- plus Object::Draw (Object.hpp:422), a virtual with 38
          ::Draw( definitions across 20 files. This is the original OFP
          entities-draw-themselves design and is legacy in practice, but it is
          what keeps "the renderer reads live simulation state" true on that
          path. Measured, not changed.
    known_failures:
      - >-
        Nothing was implemented. All four recommended items -- the architecture
        guard test, closing the SetGpuCoverage write-back, the fixed-step
        accumulator and the written rule for new features -- remain unwritten at
        this commit.
      - >-
        The separation property that this audit certifies is unenforced. It holds
        by the link graph and by convention, and the audit's own top
        recommendation exists precisely because nothing would fail if it stopped
        holding.
      - >-
        The GEngine-> classification is by hand over four trees at one commit,
        driven by method name. It is a static reading, not a runtime trace, and
        Graphics/ and Core/ were out of scope.
      - >-
        There is no fixed timestep anywhere, so deterministic simulation, replay,
        rollback and MP authority are all still blocked -- by the timestep, not by
        anything this audit was asked to look at.
    fallback: >-
      No code changed, so there is nothing to roll back and no behaviour to
      regress -- OFP and A1/A2/A3 behaviour are untouched by construction. The
      working separation the audit certifies is the existing one: three backends
      behind GraphicsEngineFactory, with CreateEngineDummy as the headless path
      that five binaries already take.
    reviewer: null
    reviewer_method: >-
      AUTOMATED_EVIDENCE, not a human review, and no runtime check at all -- this
      is a static audit of the tree at 12117df. Machine-checked -- the link graph
