  - id: WLD-014
    overlay: COMPAT-C1-EXEC-001
    is_example: false
    title: Landscape assumes one grid, and every Arma 3 world has two
    class: ENGINE
    obligation: REQUIRED
    execution_mode: IMPLEMENT
    review_model: AUTOMATED_EVIDENCE
    scheduling_state: DONE
    status: VALIDATED
    outcome: ADOPTED
    owner: null
    branch: a3-world-compatibility
    baseline_commit: 8f50308
    verification_commit: dd1d077
    milestone: 2C
    milestone_role: NON_BLOCKING_VALIDATION
    depends_on: [WLD-010, WLD-012, WLD-013]
    blocked_by: []
    blocks: [WLD-015]
    implementation_commits: [dd1d077]
    production_call_sites:
      - file: engine/Poseidon/World/Terrain/LandSave.cpp
        symbol: Modern world dual grid
      - file: engine/Poseidon/World/Terrain/LandSave.cpp
        symbol: Modern object streaming
    test_ids: [oprw25-local-corpus]
    benchmark_artifacts: []
    evidence_hash: a5479b89773bcccdbd03f7c97820b35aea0a35bbf31db06a54f9f27dbeead649
    decision_record: docs/roadmap/decisions/WLD-014-landscape-assumes-one-grid-20260810.md
    capability_claims:
      - capability: TWO_GRID_MISMATCH_IS_THE_BLOCKER
        status: VALIDATED
        denominator: >-
          Landscape::Dim(x, z, rx, rz, landGrid) asserts rx == x and rz == z, so land
          and terrain grids must be the same size. Every OFP world satisfies it --
          LandSave calls Dim(256, 256, 256, 256, 50). None of the 3 Arma 3 worlds
          measured does: Stratis 256 land / 2048 terrain (8:1, 32 m vs 4 m), VR 256 /
          2048 (8:1, 32 m vs 4 m), Altis 1024 / 4096 (4:1, 30 m vs 7.5 m). Does not
          cover: Arma 2/OA worlds (none measured at this date), Arma 1 worlds, or any
          community terrain.
      - capability: SINGLE_GRID_ASSUMPTION_DEPTH_CENSUS
        status: VALIDATED
        denominator: >-
          Symbol census across engine/Poseidon: LandRange 125 uses over 21 files,
          LandGrid 121 uses, TerrainRange 6 uses. The split is nominally present
          (_terrainRange, _terrainRangeMask, _terrainRangeLog, _terrainGrid, and
          TerrainRange/TerrainInRange/TerrainGrid macros) but 6 uses against 125 says
          it was designed and never exercised, which Landscape.hpp states directly
          ("many functions assume ObjRange==LandRange, ObjGrid==LandGrid"). This is a
          textual symbol count, not a call-graph or type analysis; it does not
          establish which of the 125 sites are actually grid-ambiguous.
      - capability: MULTI_RESOLUTION_LANDSCAPE
        status: VALIDATED
        denominator: >-
          PERF-004 implemented option B in the modern WRP mount: land semantics,
          materials and object cells remain at authored land resolution while
          elevation remains at terrain resolution; both grids retain the same
          world extent. Runtime logs measure 16x fewer semantic cells on Sahrani
          and 64x on Takistan, Stratis and ChernarusPlus versus the temporary
          bridge. Final WGPU captures pass on CWA, A1, A2/OA, A3 and DayZ. This
          validates the compatibility mount and renderer paths, not every AI or
          editor use of the historical 125-site census.
      - capability: A3_OBJECT_INSTANTIATION
        status: VALIDATED
        denominator: >-
          Modern WRP model placements are retained as compact rows by land cell
          and instantiated as camera-centred static Objects without requiring
          CfgVehicles. Measured databases: A1 602,481; A2/OA 438,906; A3 163,953;
          DayZ 2,971,218. The default live budget is 20,000 with 128 creates per
          update. Final Stratis reached 19,998 live objects with zero refused;
          full DayZ traversal reached 19,982 -> 19,939 -> 19,982 with zero refused.
    known_failures:
      - >-
        HISTORICAL WLD-014 CHECKPOINT, superseded by PERF-004. Finding only -- no code changed, so there is no runtime behaviour to verify
        and no regression arm. The evidence is the grid measurements, the symbol
        census and the header's own caution comment.
      - >-
        The far-terrain HOLD needs re-checking before any of this is attempted: an
        8192 m world at 4 m cells is a different load from a 12,800 m OFP world at
        50 m. Not measured here.
      - >-
        There is no Zeus mode in this engine to open a map into; Zeus is an Arma 3
        gameplay feature and this is the 2001 Poseidon lineage. Recorded because it
        was asked.
    fallback: >-
      Modern WRP worlds use the genuine dual-grid mount. CWA/OFP remains on its
      established same-grid path. `WGR_OBJECT_STREAMING=0` restores eager modern
      object creation for diagnosis, not as the default.
    reviewer: null
    reviewer_method: >-
      Machine-checked: the land/terrain grid pair read out of 3 parsed Arma 3 worlds
      (Stratis, VR, Altis) against the OFP Dim(256, 256, 256, 256, 50) baseline, and a
      symbol census over engine/Poseidon giving LandRange 125 uses in 21 files, LandGrid
      121, TerrainRange 6. Not checked: nothing was built, run or rendered under this
      ticket -- no code changed -- the symbol count is textual rather than a call-graph
      analysis so it does not identify which sites are genuinely grid-ambiguous, and the
      recommendation between the two migration options is costed reasoning with no
      prototype behind it.
    supersedes: []
    evidence:
      - docs/roadmap/decisions/WLD-014-landscape-assumes-one-grid-20260810.md
      - docs/roadmap/decisions/PERF-004-wgpu-modern-world-residency-and-terrain-20260814.md
      - engine/Poseidon/World/Terrain/LandSave.cpp

  - id: WLD-015
    overlay: COMPAT-C1-EXEC-001
    is_example: false
    title: The first Arma 3 world running in the engine, on a temporary single-grid bridge
    class: ENGINE
    obligation: REQUIRED
    execution_mode: IMPLEMENT
    review_model: AUTOMATED_EVIDENCE
    scheduling_state: DONE
    status: VALIDATED
    outcome: ADAPTED
    owner: null
    branch: a3-world-compatibility
    baseline_commit: dd1d077
    verification_commit: a550288
    milestone: 2C
    milestone_role: NON_BLOCKING_VALIDATION
    depends_on: [WLD-010, WLD-012, WLD-013, WLD-014]
    blocked_by: []
    blocks: [WLD-018]
    implementation_commits: [a550288]
    production_call_sites:
      - file: engine/Poseidon/World/Terrain/LandSave.cpp
        symbol: Poseidon::Landscape::LoadOprwModern
      - file: engine/WgpuRenderer/TerrainWgpu.cpp
        symbol: Poseidon::TerrainWgpu::UploadGeography
    test_ids: [oprw25-local-corpus, preview0-wgpu-check, original-training-wgpu-capture]
    benchmark_artifacts: []
    evidence_hash: 01710c114dcfd57a7a7f5c433a4f1857d7491b3ed329cbdb5df788c000129bb4
    decision_record: docs/roadmap/decisions/WLD-015-first-a3-world-in-engine-20260810.md
    capability_claims:
      - capability: A3_WORLD_LOADS_AND_TERRAIN_RENDERS
        status: VALIDATED
        denominator: >-
          One world, Stratis, on one camera. From the run log: land 256, terrain 2048,
          ratio 8, cell 4 m, extent 8192 m; terrain geometry built from the world's own
          4.2 M elevation samples; the player placed at 1699, 7.3, 5053 and the frame
          rendered without error. After the three mount faults in addendum 2 were
          fixed, 478 of 479 Stratis terrain materials resolve to a ground texture (the
          miss is the empty slot at index 0) and the world draws with its real Arma 3
          ground textures -- gdt_strconcrete_co, gdt_strbeach_co, gdt_strdrygrass_co,
          gdt_strgreengrass_co, gdt_strdirt_co, gdt_strrocky_co, gdt_strthistles_co.
          Evidence is a single capture from the Air Station Mike-26 runway. Does not
          cover: any other A3 world (VR and Altis parse but were not run), any Arma
          2/OA world, and object rendering of any kind.
      - capability: A3_STATIC_OBJECT_RENDERING
        status: VALIDATED
        denominator: >-
          PERF-004 retains all 163,953 authored placements compactly and creates
          a camera-centred set. The final Stratis run mounted the A3 archives,
          reached 19,998 live objects with zero refused, bound 96 terrain layers,
          tracked 1.03 GB with retired geometry at zero, saved a non-black capture
          containing terrain, foliage and grass, and shut down cleanly with no
          WGPU validation error. One world and one camera; Altis/VR not run.
      - capability: A3_ADDON_PRODUCT_GATE_OPENED
        status: VALIDATED
        denominator: >-
          IsAddonMetadataAccepted refused any archive whose declared product is not in
          ProductList, which held only OFP: Cold War Crisis, OFP: Resistance and VBS.
          Measured over the local Arma 3 install: 485 archives declare "Arma 3" and 1
          declares "ArmA 3", so all 487 were refused at mount. StringInList compares
          case-insensitively so one entry covers both spellings, and no archive
          anywhere in the local corpora sets pboVersion, so that gate in the same
          function is inert. Necessary but not sufficient -- with the product gate open
          the count was still 0 of 479 until the three faults below were fixed.
      - capability: A3_BANK_LOOKUP_RESOLVES_NESTED_PREFIXES
        status: VALIDATED
        denominator: >-
          Three faults, each hiding the next, kept every A3 asset unreachable.
          QFBank::open() reads no header, so GetProperty("prefix") at mount time was
          always empty and WLD-013's rule never fired outside its unit test -- every
          archive mounted under its filename. AutoBank returned the first prefix match
          while callers strip exactly GetPrefix().GetLength() characters, so every
          lookup into a3\map_stratis\data\layers\ was answered by
          a3\map_stratis\data\; longest match now wins. No OFP prefix is a prefix of
          another, so this is measurable only on A3's nested namespace. Third, an addon
          whose config could not be parsed was discarded whole. The gate on all three
          is the 478-of-479 material count, not a unit test.
      - capability: A3_CONFIG_PARSING
        status: UNSUPPORTED
        denominator: >-
          Measured: this engine's raP reader cannot parse an Arma 3 config.bin at all.
          The change is to stop conflating "needs a newer engine" with "we cannot read
          this config" and keep the bank's files rather than discarding the archive; no
          A3 config content is read.
      - capability: MULTI_RESOLUTION_LANDSCAPE
        status: VALIDATED
        denominator: >-
          PERF-004 removed the temporary bridge. Stratis now mounts 256x256 land
          cells at 32 m and 2048x2048 elevation cells at 4 m, retaining the same
          8,192 m extent and reducing semantic cells 64x. Cross-generation runtime
          checks also cover Sahrani, Takistan and ChernarusPlus. AI/editor use of
          every historical land-grid call site is not claimed.
      - capability: TERRAIN_MATERIAL_FULL_COMPOSITION
        status: CAPTURED_NOT_INTERPRETED
        denominator: >-
          The RVMAT reduction is lossy by construction: one detail/ground _co layer per
          cell, with the mask and the remaining detail layers parsed and dropped. 479
          Stratis terrain materials pass through it. The authored composition is not
          attempted here -- that is WLD-018 and WLD-019.
    known_failures:
      - >-
        HISTORICAL WLD-015 CHECKPOINT, superseded by PERF-004. Mounting A3 model archives turns the entire frame black including sky and UI.
        Not diagnosed; the leading candidate is a failed texture still occupying a
        bindless slot with no valid view, which would invalidate the bind group.
      - >-
        Geography is translated field by field, not copied: Arma 3 carries a min and a
        max water depth where the engine has one, and the engine has
        forestInner/forestOuter/track/slow where Arma 3 has a single forest bit and no
        equivalent for the rest. Fields with no counterpart are left zero rather than
        guessed. Geography drives AI pathing, so a wrong bit is a wrong path -- none of
        this is tested, and none of it affects whether the world draws.
      - >-
        --test-world and --test-world-pos are dev-only flags and the only way to reach
        an A3 world: A3 worlds are named by CfgWorlds entries this build has no configs
        for, so nothing would ever route to them.
      - >-
        A pre-existing null-safety bug was exposed and fixed, not introduced by A3
        content: TerrainWgpu::UploadGeography dereferenced land.GetTexture(i) without a
        null check when building the grass-layer name list, taking the renderer down in
        DrawGround. An OFP world with an unresolvable ground texture would have hit it
        identically.
    fallback: >-
      The whole A3 path is gated on --test-world being set, so the OFP load path is
      untouched and its mission capture smoke passes with terrain, buildings, foliage,
      grass and shadows rendering identically to before.
    reviewer: null
    reviewer_method: >-
      Machine-checked: the Stratis load line (land 256 / terrain 2048 / ratio 8 / cell 4 m
      / extent 8192 m over 4.2 M elevation samples), the 478-of-479 terrain material
      resolution count with its seven named gdt_str* ground textures, the 487-archive
      product-declaration census (485 "Arma 3", 1 "ArmA 3", 0 setting pboVersion), and a
      three-configuration A/B on one binary isolating the black frame to model archives
      with HDR, the ground-layer cap and capture timing each ruled out by reproduction.
      The OFP preview-0 WGPU smoke and mission capture are the no-regression arm and the
      capture was opened and compared. Not checked: only one A3 world was run and only
      one camera on it (the Air Station Mike-26 runway), no human judged an A3 frame, the
      black-frame cause is a hypothesis from log evidence rather than a diagnosis, the
      geography field translation has no test and drives AI pathing, and no unit test
      covers any of this path.
    supersedes: []
    evidence:
      - docs/roadmap/decisions/WLD-015-first-a3-world-in-engine-20260810.md
      - docs/roadmap/decisions/PERF-004-wgpu-modern-world-residency-and-terrain-20260814.md
