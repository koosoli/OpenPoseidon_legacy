      - >-
        One shape of ODOL revision 73 reads: a static LOD with no skeleton,
        animation, proxy, sub-skeleton, named-selection, named-property, keyframe
        or skinning data, at most one UV set, and faces that are triangles or
        quads. Everything else -- and every other later revision -- still raises
        UnsupportedOdolRevision. DescribeOdolRevision(73) reports NarrowSubset
        rather than Parsed for exactly this reason.
      - >-
        Packed ST (tangent/binormal) pairs are read and length-checked but kept
        unconverted; their basis convention has not been verified against a
        render, so nothing downstream is given a tangent frame it could trust.
        The production renderer instead derives a frame from each model's UV0
        and geometry. Its ShapeAdapter regression test proves a wrong authored
        frame is ignored, and the installed-game WGPU smoke captures without
        the prior black distance patches; that is a smoke observation, not a
        claim that the packed ST convention has been decoded.
      - >-
        One real revision-73 rock is visibly rendered in the game through WGPU.
        Its direct PAA albedo dependency was mounted in the game file namespace
        and the capture visibly samples it. RVMAT interpretation, normal/specular
        maps, alpha treatment, Super mapping, winding, normal fidelity, section
        ranges and additional UV channels remain unvalidated.
      - >-
        Correction to an earlier claim in this row: revision 73 was NOT on the
        runtime path when the reader landed. ModelCache consults
        P3DFormatDetector before calling ODOLLoader, and that detector hardcoded
        {7, 8}, so every revision-73 model was rejected before reaching the
        reader -- it was reachable from its own tests and from nothing else. The
        detector now defers to DescribeOdolRevision; that gap existed from
        4f5b988 until 34e6f3f.
      - >-
        Sections are carried into the IR with face-stream offsets in
        Section::startTriangle/triangleCount, matching the existing v7 converter.
        Those are not triangle indices, and a consumer that reads them as such
        will be wrong on both paths.
    fallback: >-
      An ODOL 73 model outside the implemented shape raises UnsupportedOdolRevision
      carrying the constraint that broke, so an unimplemented shape stays
      distinguishable from a corrupt file and from an unrecognised revision.
    reviewer: null
    reviewer_method: >-
      AUTOMATED_EVIDENCE, not a human review. The corpus fixture
      (.tmp-ast012b-odol73/objects/rectangle.p3d, SHA-256
      774a780db8209c556033f16d5b267522aa789776cc80e8d10b5c6b771adde54a) is read
      end to end: both LOD bodies close exactly on their declared end offsets
      (0x207 and 0x9fd), and LOD 0's rest data consumes exactly its declared 613
      bytes. 48 positions, 48 packed normals, 48 UVs and 48 clip flags are
      decoded; the 16 quads reach Poseidon::Model::Model through
      ODOLLoader::load with their texture and RVMAT attached.

      The previous parse was wrong and passing. The stage transform is a 3x4
      matrix, not a padded 4x4; reading sixteen floats ran the reader 128 bytes
      past the end of the material and into the middle of a face record, where
      the self-synchronising face encoding produced eleven plausible quads that
      happened to end on the correct section boundary. Two checks now make that
      class of error fail instead of pass: the rest-data section must consume its
      own declared size, and the rebuilt face-stream offsets must sum to the LOD's
      declared face-data size (320) before any section bound is read as a face
      range. The layout was cross-read against the BIS.P3D reference
      implementation (ODOL/LOD.cs, UVSet.cs, Polygon.cs, Polygons.cs,
      EmbeddedMaterial.cs, BinaryReaderEx.cs), and independently decoded in
      Python from the raw bytes before any C++ was changed.

      The installed-game WGPU smoke now proves one CWA control and one real Arma
      3 static rock draw through the same harness. A second smoke mounted the
      rock's direct PAA albedo texture at its original a3\\rocks_f virtual path;
      the log reports it exists and the capture visibly samples it. NOT checked:
      RVMAT interpretation, normal/specular maps, alpha, winding, normal fidelity,
      section ranges, multi-UV rendering, a second revision-73 model, or any
      skinned/animated model. The narrow subset is the claim; nothing broader has
      been tested.
