      - capability: LOD_PURPOSE_TYPED
        status: VALIDATED
        denominator: >-
          14 named sentinels plus the 3 crewed-view distances classify by type;
          a resolution at or above 1e5 matching no sentinel classifies Unknown
          rather than Visual, so it stays undrawable
      - capability: FLAG_BITS_KNOWN_VS_UNKNOWN
        status: VALIDATED
        denominator: >-
          12 of 12 shipped P3D fixtures surveyed, 0 carrying a vertex or face bit
          this build cannot name; the survey asserts it read every file it listed
      - capability: MLOD_SELECTION_WEIGHTS
        status: CAPTURED_NOT_INTERPRETED
        denominator: >-
          the source weight byte is preserved parallel to the vertex indices and
