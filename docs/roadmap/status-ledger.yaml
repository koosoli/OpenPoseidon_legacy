      - >-
        PAA_COMPRESSED_MIP decode is implemented for the modern decoder path only
        (PAADecoder / PoseidonFormats). Pactext's own decode routines, which the
        running game uses, still read block data raw -- correct today because no
        OFP/CWA texture sets the compressed flag, but it must be wired there before
        Arma content reaches the renderer.
      - >-
        PAA_SWIZ: CAPTURED, NOT APPLIED. The four bytes are preserved verbatim but
        no channel rearrangement is performed. Observed values across 1,146 archived
        textures include 0x00-0x09, which does not fit a plain channel-plus-invert
        reading. With LZO decode working it was possible to measure one case
        directly: Minigun_NOHQ.paa (SWIZ 05040203) decodes to R empty, B constant,
        and G+A holding the normal's x,y -- 100% of texels satisfy x^2+y^2 <= 1 for
