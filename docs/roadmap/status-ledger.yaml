    execution_mode: INVESTIGATE
    review_model: AUTOMATED_EVIDENCE
    scheduling_state: DONE
    status: VALIDATED
    outcome: NOT_APPLICABLE
    owner: null
    branch: grass-lod-dissolve-photo-cards
