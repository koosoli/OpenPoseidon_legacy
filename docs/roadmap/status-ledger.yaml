  - id: WLD-021
    overlay: COMPAT-C1-EXEC-001
    is_example: false
    title: The Arma 2 road banding is a wgpu shading bug, not data
    class: RENDERER
    obligation: REQUIRED
    execution_mode: IMPLEMENT
    review_model: AUTOMATED_EVIDENCE
    scheduling_state: DONE
    status: VALIDATED
    outcome: ADAPTED
    owner: null
    branch: grass-lod-dissolve-photo-cards
    baseline_commit: a610d99
    verification_commit: e54ea18
    milestone: 2C
    milestone_role: NON_BLOCKING_VALIDATION
    depends_on: [WLD-020, WLD-016]
    blocked_by: []
    blocks: []
    implementation_commits: [e54ea18]
    production_call_sites:
      - file: engine/WgpuRenderer/EngineWgpu.hpp
        symbol: Poseidon::EngineWgpu::ZRoadEpsilon
      - file: engine/WgpuRenderer/EngineWgpu.hpp
        symbol: Poseidon::EngineWgpu::ZShadowEpsilon
      - file: engine/Poseidon/World/Scene/Object.cpp
        symbol: GGpuTerrainConform
    test_ids: [wld-021-road-banding-ablation]
    benchmark_artifacts: []
    evidence_hash: de21c8906e79e06aa321c80c14815459ac95125d08b6d908519129f49ccc4903
    decision_record: docs/roadmap/decisions/WLD-021-road-banding-is-a-wgpu-shading-bug-20260813.md
    capability_claims:
      - capability: ROAD_BANDING_IS_BACKEND_NOT_DATA
        status: VALIDATED
        denominator: >-
          1 paired capture decides it -- same world, same camera, same data,
          Takistan at --test-world-freefly 6770.69 6099.78 312.86 230.7 -6.8,
          noon. --render gl33 is clean, smooth and continuous; wgpu bands. GL33
          consumes the WRP, the placements, the segment models, the RVMATs and
          the road class logic identically, so all of those are excluded. Covers
          one camera on one world at one time of day -- it is not a general GL33
          vs wgpu divergence census.
      - capability: DARK_SEGMENTS_ARE_AMBIENT_ONLY
        status: VALIDATED
        denominator: >-
          5 fixed points along the road sampled (red channel) at 3 sun angles.
          The 4 light points track the sun -- 227/183/155, 194/175/167,
          150/162/201, 187/206/225 across 08:00/12:00/16:00, and note two of them
          move in opposite directions, which only a path shading from real
          geometry can do. The 1 dark point does not track it at all
          (88/100/101). The road is also fully drawn -- no terrain shows through
          between pieces, so it is neither a depth fight nor a hole. One dark
          sample, so "all dark segments share this mechanism" is inferred from
          the pattern being world-space fixed and per-placed-segment, not
          measured point by point.
      - capability: ROAD_BANDING_ROOT_CAUSE
        status: UNVERIFIED
        denominator: >-
          0 of 1 causes isolated -- this is an open bug at this commit. 9
          hypotheses are eliminated by measurement. Two inherited from WLD-020 --
          per-segment UV placement and a polygon-offset difference -- both dead.
          Seven measured here -- (1) the decal depth bias, WGR_DECAL_SCALE=0
          moves road pixels by at most 2/255; (2) the missing z-epsilons, a real
          defect now fixed to GL33 parity, banding unchanged; (3) mirrored
          placements, all 438,906 Takistan placement records read from the WRP
          with zero negative basis determinants anywhere in the world and up
          exactly (0,1,0) on every one of the 13,420 road placements, unit to
          1e-3, so SetUpAndAside is a provable no-op; (4) per-model normal data,
          LOD0 vertex normals decoded from roads_e.pbo for the asf10_w10_*,
          dirt7_w7_*, dirt10_w10_* and kr_t_dirt7_* families are exactly
          (0,+1,0) on every vertex, and every road placement is a pure yaw, so no
          two placements of one model can differ in N.L; (5) the
          two-lighting-path fork, a genuine latent bug now fixed, with the
          instrumented trace showing every road on one path (kind=surface-split)
          with materials assigned, banding unchanged; (6) the depth prepass,
          WGR_PREPASS=0, pattern unchanged; (7) MSAA, WGR_MSAA=0, pattern
          unchanged (dark sample 99 -> 99). What remains is named but untested --
          a folded TLMaterial whose sun/diffuse term is absent, entering at the
          surfMat ? Combine(...) : mat split in Shape.cpp:1482-1493 by way of
          ShapeSection::PrepareTL -> EngineWgpu::SetMaterial. Do not read this
          row as a fix.
      - capability: WGPU_ROAD_AND_SHADOW_Z_EPSILON_PARITY
        status: VALIDATED
        denominator: >-
          2 of 2 epsilons corrected. EngineWgpu inherited EngineDummy's zero
          ZShadowEpsilon/ZRoadEpsilon while GL33 returns 0.01/0.005, so roads
          were laid exactly coplanar with the terrain they were cut against. Now
          at GL33 parity. This is a real defect fixed on its own merits; it does
          not change the banding, which was re-measured after.
      - capability: ROAD_LIGHTING_PATH_FORK_IS_EXACT_MATCH
        status: VALIDATED
        denominator: >-
          Roads forked per model on (andHints & ClipLandMask) == ClipLandOn being
          exact, and the two branches read Shape::Norm() with opposite sign
          conventions -- the GPU path negates it (MeshBuild.cpp:44), the CPU
          per-vertex path does not (TransLight.cpp:548). Fixed by replacing the
          land nibble instead of OR-ing into it; the instrumented trace then puts
          every Takistan road on one path with materials assigned. Measured over
          Takistan's road set only, and again, the banding is unchanged by it.
      - capability: SHADOWCACHE_EVICTION_GUARD
        status: CAPTURED_NOT_APPLIED
        denominator: >-
          1 defect found and left alone. ShadowCache::Shadow declares int count =
          0 (Shadow.cpp:173) and never updates it, so the eviction guard can
          never fire. With 13,420 road links each holding a split Shape plus a
          vertex buffer this is real memory growth. Memory only -- not an
          appearance bug and not what this ticket was chasing.
      - capability: ROADNET_CONNECTION_TYPE_SELF_CHECK
        status: UNVERIFIED
        denominator: >-
          WLD-010's road-net self-check ("the network consumes exactly its
          declared size") cannot discriminate the connection-type byte, because
          the segment path is null-terminated and the walk resynchronises either
          way. The A2/A3 handling is believed correct and has never actually been
          evidenced; the real discriminator is the decoded string, and the
          distinct-segment count is the tell. Nothing was re-run to close this.
      - capability: WGPU_SHARED_ROAD_HEIGHTFIELD_CONFORM
        status: VALIDATED
        denominator: >-
