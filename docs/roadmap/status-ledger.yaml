  - id: MAT-033
    overlay: COMPAT-C1-EXEC-001
    is_example: false
    title: Binding the specular map the constant was written for
    class: RENDERER
    obligation: REQUIRED
    execution_mode: IMPLEMENT
    review_model: AUTOMATED_EVIDENCE
    scheduling_state: DONE
    status: VALIDATED
    outcome: ADAPTED
    owner: null
    branch: a3-world-compatibility
    baseline_commit: 099d4f3
    verification_commit: 73fd78f
    milestone: 2C
    milestone_role: NON_BLOCKING_VALIDATION
    depends_on: [MAT-031, MAT-032]
    blocked_by: []
    blocks: [MAT-038]
    implementation_commits: [73fd78f]
    production_call_sites: []
    test_ids: [oprw25-local-corpus]
    benchmark_artifacts: []
    evidence_hash: e011f8b63de3d104a05eed23e68eee947c5eaf391896bd8110592a61c4697e00
    decision_record: docs/roadmap/decisions/MAT-033-smdi-in-the-gpu-driven-path-20260810.md
    capability_claims:
      - capability: SMDI_SPECULAR_LEVEL_BOUND
        status: PARTIAL
        denominator: >-
          In Arma 3 a material's `specular` constant is the maximum a per-texel map
          scales toward, so applying it with no map gave every texel that maximum and
          lit whole rooftops as mirrors; the previous code scaled it to a stated 0.25
          approximation of a real map's mean. The map could not reach the shader
          because WgrModelMaterial carried exactly one texture, and a per-draw-only
          lookup reaches almost nothing -- the GPU-driven retained set owns 6,066
          Stratis sections against about 7 a frame through DrawSectionTL. The ABI now
          carries specular_texture_id (80 to 88 bytes, both size assertions updated),
          SectionMaterialGpu gains specular_slot inside existing tail padding so the
          GPU-side size is unchanged, and gpu_driven_shadow.wgsl mirrors the rename
          because it reads the same buffer.
      - capability: SMDI_GLOSS_TO_EXPONENT
        status: NOT_PRODUCED
        denominator: >-
          SMDI's G is the specular level and B is gloss, measured over 40 sampled
          textures where R and A are constant 255 while G and B vary. G scales the
          constant. B is deliberately unused: turning gloss into a Blinn-Phong
          exponent is a conversion with its own evidence requirement, the same one
          that keeps GlossToRoughnessUnvalidated out of the translation path and off
          by default. The map is bound and the channel is present for when that
          question is answered properly.
    known_failures:
      - >-
        Only the specular level is consumed. Gloss is bound and ignored, so nothing
        here improves highlight shape.
      - >-
        A material with no SpecularDetail slot keeps the constant-only behaviour it
        had before.
    fallback: >-
      An unresolved or unloadable specular map leaves the material on the constant
      path, and the shader tests for the slot rather than assuming one is present.
    reviewer: null
    reviewer_method: >-
      Structural checks that the compiler and the buffer layout enforce: both
      WgrModelMaterial size assertions were updated with the 80 to 88 byte growth and
      are what catch a mismatch, and gpu_driven_shadow.wgsl was renamed in step
      because a field mismatch would make every field after it read the wrong bytes.
      The channel semantics come from MAT-020's measurement of 40 SMDI textures
      rather than from this ticket. Not checked: no unit test covers the resolve
      path, no human judged the rooftops the 0.25 approximation was standing in for,
      and no before/after pixel measurement is recorded here.
    supersedes: []
    evidence:
      - docs/roadmap/decisions/MAT-033-smdi-in-the-gpu-driven-path-20260810.md

