    production_call_sites: []
    test_ids: [preview0-capability-matrix-check]
    benchmark_artifacts: []
    evidence_hash: null
    decision_record: null
    known_failures:
      - >-
        INTEGRATED means the release TOOLING is on the branch and exercised, not
        that a package has been published. Landed 2026-08-05: the capability
        matrix generated from both ledgers with a CI drift check, the release
        notes, the release runbook, and a packaging script proven end to end
        against a real build. Nothing has been released.
      - >-
        Package chain verified 2026-08-05 at commit cecf5db: all six refusal
        paths exercised, a package assembled, and its two identity documents --
        the fingerprint and the build manifest -- confirmed to name the same
        commit, with every shipped file re-hashed against the fingerprint.
      - >-
        Outstanding REL-000 acceptance items, none of which the tooling can
        supply on its own: a demonstration video showing the released build; a
        reference capture and timing bundle produced FROM the packaged commit
        rather than carried from an earlier one; GL33/WGPU comparison evidence
        regenerated against that same commit; and the release decision itself.
      - >-
        The packaged commit must still be pinned deliberately, and the packaging
        script enforces it -- but the reason first recorded here was wrong. This
        entry claimed packaging HEAD would ship a ~10 s load stall from the
        LIT-020 bake. Measured 2026-08-05 in the original training mission at the
        Tier 1 configuration: 8 models, ~0.29 s, and 0.570 ms per frame. The
        ~10 s figure extrapolated over the whole model library; the bake runs per
        REGISTERED model. Corrected downward, and it no longer blocks a release.
      - >-
        What the same measurement DID find is larger and was not on anyone's
        list: GTAO costs 31.9% of the GPU frame at the Tier 1 resolution
        (ao_total 7.723 ms of 24.178 ms), against the 8% recorded from an 800x600
        window. Within the 33.33 ms budget, so not release-blocking, but it is
        the dominant cost in the frame and the release notes say so.
      - >-
        Review model is unchanged: Oliver Kay is the only human on the project,
        so this ticket cannot obtain an independent reviewer either. Whatever
        reviewer_method it eventually records must say what was actually
        exercised on the packaged artifact.
    fallback: >-
      No public package ships until this ticket closes; the technical candidate
      and its evidence bundle remain available internally in the meantime.
