  - id: MAT-036
    overlay: COMPAT-C1-EXEC-001
    is_example: false
    title: Arma 2/OA foliage renders as opaque shards, and four causes it is not
    class: RENDERER
    obligation: REQUIRED
    execution_mode: IMPLEMENT
    review_model: AUTOMATED_EVIDENCE
    scheduling_state: DONE
    status: VALIDATED
    outcome: ADAPTED
    owner: null
    branch: grass-lod-dissolve-photo-cards
    baseline_commit: bfb23e6
    verification_commit: 91f461b
    milestone: 2C
    milestone_role: NON_BLOCKING_VALIDATION
    depends_on: [MAT-020, MAT-030]
    blocked_by: []
    blocks: []
    implementation_commits: [91f461b]
    production_call_sites: []
    test_ids: [mat-036-oa-foliage-alpha-histogram]
    benchmark_artifacts: []
    evidence_hash: 41998cbfefad76a1a150dea5b7683e74e86c760c165940fb0f555ea6371812a5
    decision_record: docs/roadmap/decisions/MAT-036-oa-vegetation-renders-as-shards-20260812.md
    capability_claims:
      - capability: OA_FOLIAGE_SHARD_ROOT_CAUSE
        status: NOT_PRODUCED
        denominator: >-
          The symptom is isolated and reproducible but the cause is not established,
          and no production change was made. Denominator is two models through one
          identical `--test-model` harness: official OA
          `ca\plants_e\tree\t_amygdalusc2s_ep1.p3d` renders as opaque dark mottled
          shards with jagged cut edges, and Arma 3's
          `a3\plants_f\tree\t_ficusb2s_f.p3d` renders correctly. Both are ODOL, both
          report the same structure (`TreeAdv` crown sections plus a `TreeAdvTrunk`,
          `schema=true`, Stage1 NormalMap + Stage2 MacroAmbient, no Stage0), and the
          OA leaf atlas decodes to a normal 4x3 grid of green branch cards on grey.
          So it is neither a harness artefact nor bad source art -- but n=2 models.
      - capability: ALPHA_ROUTE_OVERRIDE_FIRES_FOR_OA
        status: VALIDATED
        denominator: >-
          One texture pair, the only measured difference between the two assets:
          A3 ficus `_ca.paa` (DXT5, 86.5% clear, 12.5% opaque, 1.0% partial)
          classifies CUTOUT; OA almond `_can.paa` (DXT5, 88.0% clear, 0.0% opaque,
          12.0% partial) classifies BLEND under `ClassifyAlpha`'s 2%-partial
          threshold. The existing shader-family override nonetheless handles it:
          `GpuSectionMaterialUsesLeafCards` resolves the OA material to `TreeAdv` and
          returns true (traced live), `HasAlphaHoles()` is true, the texture is not
          bark-named, so `materialCutout` is true and the section gets
          `alphaRef = 0.5`. The override fires; alpha routing is not the gap.
      - capability: A2_SECTION_TEXTURE_AND_FACE_BINDING
        status: VALIDATED
        denominator: >-
          One model, self-checking. LOD0 sections 0 and 1 (the crown) carry
          `textureIndex=0` -- the leaf atlas -- and section 2 (the trunk)
          `textureIndex=1`. LOD0 has 9,416 faces and `faceDataSize` is 75,328 =
          9,416 x 8, matching the A2 record size of 2 header bytes + 3 x 2 index
          bytes, with the section ranges partitioning it exactly ([0, 40832) = 5,104
          faces, [40832, 56144) = 1,914, [56144, 75328) = 2,398). `convertOdolStatic`
          throws if rebuilt offsets disagree with the declared size and does not
          throw here. That accounts for 7,018 of 9,416 LOD0 faces being crown
          geometry correctly bound to the leaf atlas, while the render shows mostly
          bark-like shards.
      - capability: TREEADV_STATE_VECTOR_FOLD_IS_THE_CAUSE
        status: UNSUPPORTED
        denominator: >-
          OA authors genuinely non-neutral values where A3 does not (OA crown ambient
          [0.05 0.57 0.30], diffuse [0.50 0.40 0.45], emissive [2.60 2.30 2.00],
          power 300; A3 crown diffuse [0.50 0.50 0.50], emissive [1.00 1.00 1.00],
          power 28), and MAT-020 established these are family parameters rather than
          lighting. Suppressing the `surfMat->Combine` fold for TreeAdv-family
          sections in `ClassifyGpuSection` changed the render not at all, consistent
          with MAT-020's finding that the HDR path ignores per-material terms. The
          change was reverted; it fixes nothing.
      - capability: UV_SOURCING_HYPOTHESIS
        status: UNTESTED
        denominator: >-
          The leading remaining hypothesis, with no measurement behind it yet. A2
          rest-data carries `uv0` plus `uvSetCount - 1` extra sets and the TreeAdv
          MacroAmbient stage is authored `uvSource tex1`; if the crown sections
          sample the wrong set, or the A2 16-bit UV dequantisation lands in the wrong
          part of the atlas, each card would show an arbitrary region of a 2048^2
          atlas whose background is flat grey and whose twigs are dark grey-brown --
          which is what the render looks like and is consistent with every
          measurement above. The decisive experiment (dump the decoded UV range per
          section for both models against the atlas layout) was not run.
    known_failures:
      - >-
        OA foliage still renders as opaque shards. Nothing was fixed.
      - >-
        The A2 UV dequantisation uses `(u + 32767) / 65536` where the conventional BI
        form is `(u + 32767) / 65534`. The difference is ~3e-5 and cannot explain the
        symptom, but it is wrong and remains uncorrected.
    fallback: >-
      Not applicable -- no production change. Both attempted fixes were reverted after
      measuring that they changed nothing, so no A3, OFP or OA behaviour differs from
      the previous commit.
    reviewer: null
    reviewer_method: >-
      Per-asset measurement through the production render path: alpha histograms of
      the two `_ca`/`_can` atlases with their `ClassifyAlpha` verdicts, a live trace
      showing the TreeAdv leaf-card override firing and applying `alphaRef = 0.5`, and
      an arithmetic check of the A2 face stream (75,328 = 9,416 x 8, section ranges
      partitioning it exactly) that `convertOdolStatic` enforces at load. Not checked:
      the cause is not established and no fix exists; the denominator is two models
      and one texture pair, not a corpus; the UV-sourcing hypothesis has no
      measurement at all; and no automated test was added because nothing changed. The test id above names a reproducible measurement run, not a CTest case: no automated test exists for this ticket, and that is the weakest part of this record.
    supersedes: []
    evidence:
      - docs/roadmap/decisions/MAT-036-oa-vegetation-renders-as-shards-20260812.md
      - docs/roadmap/decisions/RND-alpha-routing-misclassifies-a3-foliage-20260809.md

  - id: MAT-039
    overlay: COMPAT-C1-EXEC-001
    is_example: false
    title: The Multi family is a four-layer masked blend, and we bind one layer of it
    class: RENDERER
    obligation: REQUIRED
    execution_mode: IMPLEMENT
    review_model: AUTOMATED_EVIDENCE
    scheduling_state: DONE
    status: VALIDATED
    outcome: ADAPTED
    owner: null
    branch: grass-lod-dissolve-photo-cards
    baseline_commit: 82aa1b6
    verification_commit: aade226
    milestone: 2C
    milestone_role: NON_BLOCKING_VALIDATION
    depends_on: [MAT-030, MAT-034, MAT-038]
    blocked_by: []
    blocks: [MAT-040]
    implementation_commits: [aade226]
    production_call_sites: []
    test_ids: [mat-039-multi-stage-table-trace]
    benchmark_artifacts: []
    evidence_hash: eff9f83dd924d710503eb83771b53df09ad9be141c43330942c68c16d2207bd4
    decision_record: docs/roadmap/decisions/MAT-039-multi-family-is-a-four-layer-blend-20260812.md
    capability_claims:
      - capability: MULTI_FLAT_SURFACE_CAUSE
        status: VALIDATED
        denominator: >-
          After MAT-038 gave the retained path normal maps and the tangent frame was
          made scale-invariant, Takistan's brick houses still looked flat while the
          stone walls beside them looked correct. Every material on those houses does
          bind a normal map -- traced -- so it is not a missing binding. Read from the
          source, `ca\structures_e\housek\data\house_k_5_multi.rvmat` (`PixelShaderID
          Multi`) declares 15 stages: four colour layers at stages 0-3 each with its
          own TexGen (0,1,2,3), the blend mask at 4, procedural DTSMDI at 5-8, macro
          at 9, ambient/detail shadow at 10, and four normals at 11-14 (stage 13
          procedural flat). The fine brick relief lives entirely in layer 1, at layer
          1's UV scale, and the renderer draws layer 0 -- the rock -- with layer 0's
          normal at layer 0's UV scale. The building is not missing its normals; it is
          missing three of its four surfaces. Denominator: one RVMAT read in full, one
          free-fly viewpoint (5760.49, 5536.90, 312.54) az 67.2 el -1.8 on Takistan
          with `house_k_5_ep1` ~9 m away and `house_k_8_ep1` ~21 m ahead. No pixel
          measurement, and the family-wide count of 1,628 Multi materials comes from
          MAT-030/MAT-034, not from this ticket.
      - capability: MULTI_FOUR_LAYER_COMPOSITION
        status: NOT_PRODUCED
        denominator: >-
          Not implemented. `ShaderSchema::kMulti` already records the gap honestly --
          Stage0 is `BaseColour` commented "layer 0 colour, standing in for the base",
          stages 1-3 are `MaterialSlot::Count` (no slot at all), Stage4 is `Mask`,
          "preserved unused". Implementing it needs, per section, 4 albedos + 4
          normals + 1 mask + 4 UV transforms against the retained material's current
          three texture slots (albedo, specular, normal): `WgrModelMaterial` grows to
          carry layer arrays and their TexGens or gains an indirection into a
          per-material layer table, `kMulti` gains slots for stages 1-3 and 12-14, and
          `gpu_driven.wgsl` composes four layers by mask and blends four tangent-space
          normals rather than sampling one. The mask sampling and four-way blend are
          the same shape as the terrain's LCA composition in `terrain.wgsl` and are
          worth reusing rather than writing twice.
      - capability: MULTI_IS_A_SHARED_RV_SEMANTIC
        status: VALIDATED
        denominator: >-
          `Multi` is not an A2/OA construct. It is used by Arma 3 as well; Takistan
          just happens to put it on the buildings you stand next to, which is why the
          defect surfaced there first. Established by source reading of the shader
          family, not by a per-generation material count -- no denominator of A3
          versus A2 Multi usage was taken in this ticket.
      - capability: PARALLAX_ON_MULTI
        status: NOT_PRODUCED
        denominator: >-
          Deliberately not attempted, and recorded so it is not attempted in the wrong
          order. Parallax occlusion mapping would be built on the same per-layer
          height/normal data this record is about, and applying it to a `Multi`
          surface still drawing one of its four layers would add apparent depth to
          the wrong texture. Composition first; POM is then a shading change on top of
          a correct surface and can be judged on its own merits.
    known_failures:
      - >-
        Three of Multi's four surface layers are not drawn at all, so their normals,
        specular and UV scales never reach the shader. Brick relief on Takistan's
        `housek` family is invisible for that reason and not for a binding one.
      - >-
        The Stage4 mask is carried through the schema and sampled by nothing.
      - >-
        Nothing was implemented in this ticket, so the symptom is unchanged.
    fallback: >-
      The current behaviour is itself the fallback: Stage0 stands in for the whole
      surface, so a Multi material draws layer 0's colour with layer 0's normal at
      layer 0's TexGen rather than failing. It is wrong but it is coherent -- one real
      layer at its own scale, not a mixture of mismatched layers.
    reviewer: null
    reviewer_method: >-
      Source reading against a live trace: the full 15-stage table of
      `house_k_5_multi.rvmat` enumerated stage by stage with its per-layer TexGens,
      and a trace confirming every material on the reported houses does bind a normal
      map, which is what rules out the missing-binding explanation. Not checked: no
      pixel measurement, no A/B capture, no unit test, and no implementation -- the
      claim is a cause, not a fix. The denominator is one RVMAT and one viewpoint; the
      family-wide 1,628-material figure is inherited from MAT-030/MAT-034 and was not
      re-measured, and no count of how many Multi materials actually use more than one
      layer was taken. The test id above names a reproducible measurement run, not a CTest case: no automated test exists for this ticket, and that is the weakest part of this record.
    supersedes: []
    evidence:
      - docs/roadmap/decisions/MAT-039-multi-family-is-a-four-layer-blend-20260812.md
      - engine/Poseidon/Asset/Formats/Material/ShaderSchema.hpp

  - id: MAT-040
    overlay: COMPAT-C1-EXEC-001
    is_example: false
    title: Parallax has authored height on terrain, on both generations, and nowhere else
    class: RENDERER
    obligation: REQUIRED
    execution_mode: IMPLEMENT
    review_model: AUTOMATED_EVIDENCE
    scheduling_state: DONE
    status: VALIDATED
    outcome: ADAPTED
    owner: null
    branch: grass-lod-dissolve-photo-cards
    baseline_commit: 86b83e5
    verification_commit: 03a61f2
    milestone: 2C
    milestone_role: NON_BLOCKING_VALIDATION
    depends_on: [MAT-038, MAT-039, WLD-017]
    blocked_by: []
    blocks: []
    implementation_commits: [03a61f2]
    production_call_sites: []
    test_ids: [mat-040-parallax-corpus-histogram]
    benchmark_artifacts: []
    evidence_hash: 35572eaf117381d16405691f463a87fd3a0acac76cc6657a89dd97e6fe3f0c09
    decision_record: docs/roadmap/decisions/MAT-040-parallax-is-terrain-only-on-both-generations-20260812.md
    capability_claims:
      - capability: PARALLAX_HEIGHT_IS_TERRAIN_ONLY
        status: VALIDATED
        denominator: >-
          Parallax needs a height field. RV normal maps are DXT5nm (Y in green, X in
          alpha), leaving red free, and `_nopx` is the suffix that uses it. R channel
          measured at 256x256 resample over 6 textures: OA object maps `wall_01_nohq`,
          `wall_brick01_nohq` and `stonewall_01_nohq` hold R flat at 0 -> 0, while
          terrain surface maps vary it -- OA `tk_hlina_nopx` 106 -> 187, A3
          `gdt_beach_nopx` 94 -> 163, A3 `gdt_concrete_nopx` 96 -> 124. The split is
          structural, not incidental: counting normal-map suffixes across
          `structures_f`, `rocks_f`, `plants_f`, `data_f` and `map_data` (3,874
          entries) gives `_nohq` 263, `_nopx` 31, `_no` 1, with all 31 `_nopx` in
          `map_data.pbo` and not one in any object addon. So Arma 3 supports parallax
          on terrain and not on objects, identically to Arma 2, and one terrain
          implementation serves both generations. Denominator: 6 sampled textures and
          a 3,874-entry suffix count over five named A3 addons -- no equivalent
          corpus-wide suffix count was taken on the A2/OA side, only the three OA
          textures above.
      - capability: PARALLAX_ON_OBJECTS
        status: UNSUPPORTED
        denominator: >-
          There is no authored object height on either generation (R flat at zero in
          every object normal map measured, and zero `_nopx` outside `map_data.pbo`
          across 3,874 entries). Synthesising height from the normal map is refused
          on purpose: it swims under camera motion and softens exactly the detail it
          claims to add. This record exists partly so it is not attempted.
      - capability: TERRAIN_PARALLAX_IMPLEMENTATION
        status: NOT_PRODUCED
        denominator: >-
          Measured and scoped, not started. The terrain fragment shader has no
          per-surface normal or height sampling at all -- its normal is a central
          difference of the heightmap (`sample_normal`), which is geometry, not
          surface detail -- and although the authored per-surface maps reach the GPU,
          nothing samples them. They can only be sampled inside `sample_authored_cell`,
          because a surface's height and normal are meaningless without the mask that
          says which surface a texel is, and that function is gated:
          `a3_surface_blend` defaults to 0, is clamped to 0.35, and fades out entirely
          between 25 and 120 metres. The order is therefore forced -- sample the bound
          per-surface normals inside the authored composition, resolve the authored
          composition's own status, then parallax on top -- because displacing a
          surface that is still mostly the satellite image is not a test of anything.
      - capability: BI_SECOND_WITNESS_ON_PARALLAX
        status: VALIDATED
        denominator: >-
          Bohemia's own Arma 2 renderer write-up (supplied by the owner) describes
          parallax occlusion mapping as a double ray casting computed on the GPU and
          applied to terrain surfaces, adapted from ATI sample code. The corpus
          measurement reached the same conclusion independently, so there are two
          witnesses, one measured and one authored. Note the vendor's is a ray cast,
          not the single-step offset implemented in the preceding commit; that gap is
          a deliberate cost choice inside an already four-way-blended function, not an
          oversight.
      - capability: LCA_MASK_IS_NOT_A_WEIGHT_FIELD
        status: VALIDATED
        denominator: >-
          Histogram of two shipped masks, one per generation. A3 `m_003_000_lca`
          1024x1024: R distinct=2 (0 in 664,699 texels; 255 in 383,877), G distinct=2,
          B distinct=3, A distinct=2 with a minimum of 128 and never 0; R+G+B+A ~= 255
          in 28.6% of texels. OA `m_011_010_lca` 512x512: R/G/B distinct=4 each, A
          constant 255 everywhere; sum ~= 255 in 0.7% of texels. Two values per
          channel, 0 and 255, with a few hundred transition texels at the seams -- a
          blend weight cannot look like this. These channels are flags and the mask is
          an indexed surface selector, not fractional coverage; A3's two-state alpha
          is the shape of an extra selector bit, matching BI's description of encoding
          four channels into six surfaces per segment. The sums show the channels are
          not mutually exclusive, so the current shader reads several simultaneous
          weights, renormalises and averages the surfaces together -- which is the
          measured symptom. Denominator: exactly two mask tiles, one per generation.
      - capability: LCA_SIX_SURFACE_DECODE
        status: CAPTURED_NOT_INTERPRETED
        denominator: >-
          What the histograms do not establish is the decode: which bit pattern
          selects which of the six surfaces, and whether any blending between them is
          intended at all (the hard binary edges suggest little or none, with the
          satellite carrying the low-frequency variation). The stated next step is to
          correlate the pattern against the layer names the tile's own filename lists
          -- `p_003-000_l02_l04_n_n_n` names its layers in order. Not done.
      - capability: SATELLITE_FRAME_HYPOTHESIS
        status: UNSUPPORTED
        denominator: >-
          Eliminated by direct test: forcing the satellite through the legacy cell
          frame tiles it into a repeating grid across the terrain, so its own worldPos
          TexGen is correct and is not the fault. One ablation on the production path.
    known_failures:
      - >-
        The authored terrain composition looks worse than the legacy path -- washed-out
        ground with structured banding along the mask's hard binary edges rather than
        noise -- because it decodes an indexed selector as fractional weights. The
        blend weights, the mask-weight fix and the per-layer TexGens are all downstream
        of that.
      - >-
        The authored composition has never been judged since WLD-017 changed what it
        composites: `a3_surface_blend` still defaults to 0, is clamped to 0.35, and
        fades out between 25 and 120 m, which are an experiment's guard rails.
      - >-
        The parallax step implemented in the preceding commit is a single-step offset,
        not BI's double ray cast. Known and deliberate, but not parity.
      - >-
        Terrain parallax proper is not implemented: nothing samples the per-surface
        normal or height maps that are already bound.
    fallback: >-
      The terrain shader continues to derive its normal from a central difference of
      the heightmap, and the authored per-surface composition stays behind
      `a3_surface_blend` (default 0, capped 0.35, faded out past 25-120 m), so a world
      with no usable authored surfaces renders through the legacy satellite path
      rather than through a half-decoded mask.
    reviewer: null
    reviewer_method: >-
      Corpus measurement and texture histograms: R-channel min/max at 256x256 resample
      across 6 named normal maps spanning both generations, a 3,874-entry suffix count
      over five A3 addons placing all 31 `_nopx` in `map_data.pbo`, four-channel
      histograms of one shipped LCA mask per generation, and one production ablation
      eliminating the satellite-frame hypothesis. BI's published account is a second,
      independent witness on the terrain-only conclusion. Not checked: nothing is
      implemented, so no capability was exercised in a frame; the OA side of the suffix
      count is three sampled textures rather than a census; the mask evidence is two
      tiles; the six-surface decode is unresolved, so the mask claim says only what the
      channels are not; and the amendments recording the BI account and the histograms
      were appended to the record after this ticket's verification commit. The test id above names a reproducible measurement run, not a CTest case: no automated test exists for this ticket, and that is the weakest part of this record.
    supersedes: []
    evidence:
      - docs/roadmap/decisions/MAT-040-parallax-is-terrain-only-on-both-generations-20260812.md
      - engine/Poseidon/Asset/Formats/Material/ShaderSchema.hpp

  - id: MAT-041
    overlay: COMPAT-C1-EXEC-001
    is_example: false
    title: Emitter radiance is a target peak, not a multiplier
    class: RENDERER
    obligation: REQUIRED
    execution_mode: IMPLEMENT
    review_model: AUTOMATED_EVIDENCE
    scheduling_state: DONE
    status: VALIDATED
    outcome: ADAPTED
    owner: null
    branch: grass-lod-dissolve-photo-cards
    baseline_commit: c1241de
    verification_commit: 0b9cfbd
    milestone: 2C
    milestone_role: NON_BLOCKING_VALIDATION
    depends_on: []
    blocked_by: []
    blocks: []
    implementation_commits: [0b9cfbd]
    production_call_sites:
      - file: engine/WgpuRenderer/EngineWgpu.cpp
        symbol: StaticEmitterRadianceScale
    test_ids: [preview0-wgpu-check]
    benchmark_artifacts: []
    evidence_hash: 27e37ffd73eead3bd750a7c14757075ceadb67ae231303ff0c246da0ce540feb
    decision_record: docs/roadmap/decisions/MAT-041-emitter-radiance-is-a-target-not-a-multiplier-20260812.md
    capability_claims:
      - capability: EMITTER_RADIANCE_TARGET_PEAK
        status: VALIDATED
        denominator: >-
          `StaticEmitterRadianceScale` matched material path patterns and multiplied
          the authored emissive by 0.015 or 0.08, but Arma 2 and 3 author the emissive
          lane on a legacy 1e2..1e6 scale. Measured across all 66 light materials in
          A3's `data_f`: `lamp_searchlight` 600000/600000/600000 (what A3 floodlights
          emit through), `car_beacon_red_emit` 730000/150000/140000, `env_flash`
          200000/200000/600000, `building_warninglight_red` 180000/2000/1000,
          `air_positionlight_red` 150000/500/50, `lamp_fluorescent`
          28500/27400/30000, `lamp_street_white` 300/265/260. 600000 x 0.08 = 48000,
          which the HDR path sRGB-decodes into an overflow of the `Rgba16Float` scene
          target long before bloom's 1.0 threshold sees it; landing at the knee would
          need ~1.7e-6, four orders of magnitude below either constant. No hand-picked
          absolute multiplier can work because the constant is absolute and the input
          is not. The family constant is now a target peak with the scale derived per
          material, matching what the retained path already does in `gpu_driven.wgsl`
          (`emissive * min(1.0, 0.50 / peak)`). Denominator: 66 A3 `data_f` light
          materials; no A2/OA light-material count was taken.
      - capability: PATTERN_LIST_KEYED_ON_EMITTING_MATERIAL
        status: VALIDATED
        denominator: >-
          The old pattern list keyed on the wrong materials: every `\lamps\` and
          `lamphalogen` RVMAT measures emissive 0, so the tighter 0.015 arm was a
          measured no-op, while the one material that actually emits sits in the
          looser 0.08 arm via `\lights\`. `lamp_searchlight` is now in the 0.015 arm,
          so the floodlight lens is keyed on the material that emits rather than the
          housing that does not. Measured over the same 66-material set.
      - capability: OFP_EMISSIVE_UNAFFECTED
        status: VALIDATED
        denominator: >-
          Materials already at or below their target are untouched, which is every
          stock CWA material: all of `CfgMaterials`' emissive values measure
          {0,0,0,0}, so OFP is provably unaffected. Whole-config denominator on the
          CWA side; the claim covers only the emissive lane.
      - capability: UNMATCHED_EMITTERS_BOUNDED
        status: VALIDATED
        denominator: >-
          The change also bounds the many emitters that match no pattern at all,
          giving them target 1.0 (the bloom knee) instead of letting them overflow.
          No count of how many materials fall into the unmatched case is recorded, so
          the size of this population is unmeasured -- only its new upper bound.
      - capability: A3_FLOODLIGHT_ORB_ROOT_CAUSE
        status: NOT_PRODUCED
        denominator: >-
          Not fixed and not identified. With the radiance fix in, the Stratis airbase
          floodlight framed at 35 m is still a screen-filling white disc. Two
          hypotheses were killed by direct ablation on the production path: zeroing
          all direct-path mesh emissive produces a pixel-identical frame, so the orb
          is not the emitter mesh and `StaticEmitterRadianceScale` was never going to
          fix it whatever its constants; and stubbing `SceneDraw.cpp`'s `DrawFlare`
          (drawn for any light with non-zero `FlareIntensity`, multiplied by
          `GetAccomodateEye()` and composited additively with `NoZBuf`) is also
          pixel-identical. `AddA3StaticMarkerLights` in `Landscape.cpp` creates
          `StaticMarkerLight` at brightness 0.25 with `FlareIntensity` explicitly
          overridden to 0, so those are not it either. Remaining candidates, in order:
          a light-volume cone mesh from the lamp model drawn additively; the local
          point/spot contribution in `lights_contrib` at very close range; or
          auto-exposure and bloom on an ordinary bright surface, which is not a lamp
          bug at all.
      - capability: ORB_REPRODUCTION_IS_VALID
        status: UNSUPPORTED
        denominator: >-
          The reproduction itself is in doubt, which matters more than either
          ablation. Four captures at one framing -- camera (1707, 5044, 14) looking at
          object 76383 at (1677.4, 11.5, 5024.7): in daylight (hour 12) the orb is
          still there at the same size and place, so it is not night lighting, not eye
          accommodation and not bloom-on-an-emitter; from ~140 m the airbase renders
          cleanly with `lamphalogen_f` visible as an ordinary thin pole. A lamp lens
          is a few tens of centimetres and cannot fill the frame at 36 m, and the far
          capture shows large pale concrete structures (a fuel tank, hangar aprons)
          around that spot -- a bright surface a few metres from the camera blowing out
          under auto-exposure explains a day-and-night, distance-dependent white disc
          exactly. Chasing it further without a known-good reproduction is guesswork,
          and two sound ablations have already been spent on it.
    known_failures:
      - >-
        The owner's reported orb is unfixed. This ticket fixes the emissive scale and
        states plainly that the scale was not the cause.
      - >-
        The framing used to chase the orb is very probably not reproducing the owner's
        bug. What is needed next is the owner's own viewpoint -- a screenshot or the
        free-fly coordinates from the Dev Tools Game tab -- after which the same
        ablation method settles it in one build.
      - >-
        The 66-material measurement covers Arma 3's `data_f` only. A2/OA light
        materials sit on the same legacy scale by inspection but were not counted.
    fallback: >-
      A material already at or below its family target is left alone, so nothing that
      was previously in range is changed, and any emitter matching no pattern falls to
      target 1.0 -- the bloom knee -- rather than overflowing the `Rgba16Float` scene
      target. Stock CWA emissive is {0,0,0,0} throughout, so the OFP path never reaches
      the scaling at all.
    reviewer: null
    reviewer_method: >-
      Config measurement plus pixel-identity ablations on the production path: all 66
      A3 `data_f` light materials read for their authored emissive (showing the
      1e2..1e6 range and that every `\lamps\`/`lamphalogen` material measures 0), all
      CWA `CfgMaterials` emissive values read as {0,0,0,0}, the OFP preview-0 WGPU gate
      passing, and two captures at Stratis night -- wide airbase framing showing
      plausible light pools, runway lights as small points and no discs. The two orb
      hypotheses were each disproved by stubbing the mechanism and re-capturing to a
      pixel-identical frame. Not checked: no human judged the corrected emitter
      brightness against reference footage, no unit test covers the target-peak
      derivation, the unmatched-emitter population is unmeasured, the A2/OA light
      corpus was never counted, and the orb is neither explained nor reliably
      reproduced -- the 35 m framing is stated in the record as probably not the
      owner's.
    supersedes: []
