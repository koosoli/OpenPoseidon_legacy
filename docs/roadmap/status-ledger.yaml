    decision_record: docs/roadmap/decisions/CORE-NEG-003-abi-guard-checked-four-structs-20260814.md
    capability_claims:
      - capability: ABI_LAYOUT_DRIFT_REFUSED
        status: UNVERIFIED
        denominator: >-
          A constexpr FNV-1a over `sizeof` of all 45 structs that cross the C ABI,
          carried in `WgrAbiCheck::layout_hash`, with `WGR_ABI_VERSION` 4 -> 5 and
          `wgr_abi_validate` refusing on mismatch. The gap it closes is measured:
          the previous guard compared four types, and `WgrSkyRuntime` growing 80 ->
          112 bytes in `f88f0ea` passed it silently, so a 12 Aug engine binary read
          32 bytes past the struct handed to it by a 13 Aug renderer. Two Rust tests
          cover it, one simulating that exact drift. UNVERIFIED rather than
          VALIDATED because no mismatched pair has been run against the new guard
          outside the test harness, and the work is not yet committed.
      - capability: ABI_SAME_SIZE_FIELD_REORDER
        status: UNSUPPORTED
        denominator: >-
          The hash is over sizes, not offsets or names, so swapping two same-size
          members inside one struct still passes. For the sky UBO that gap is
          covered by `sky/mod.rs`'s field-order test; elsewhere it is uncovered. A
          full offset-and-name hash is the honest next step and was not taken.
    known_failures:
      - >-
        Not committed at the time of writing, so this record has no verification
        commit and no evidence hash. Whoever commits it must supply both and rerun
        `scripts/compute_evidence_hash.py --all --write`.
      - >-
        Semantic drift is not covered: a field that keeps its size and changes
        meaning passes every check here.
      - >-
        `wgr_abi_layout_hash()` is exported from Rust but deliberately not declared
        in the header. Declaring it would make an older DLL fail at Windows module
        load, before the handshake could produce its diagnostic.
    fallback: >-
      On mismatch the renderer is refused before creation and both layout hashes are
      logged with the renderer build id and "deploy both, not one", rather than the
      previous behaviour of proceeding and drawing garbage.
    reviewer: null
    reviewer_method: >-
      Two Rust unit tests (`matching_abi_declaration_is_accepted`,
      `drifted_shared_struct_layout_is_refused`) plus the arithmetic that identified the
      original fault: the reported moon `radius`, `lit` and `discScale` were exactly
      `-dir.x`, `dir.y`, `dir.z`, which is the adjacent stack slot and not any plausible
      rendering error. Reproduced deliberately against the stale installed binary before
      the fix. Not checked: no mismatched binary pair has been run against the new guard
      outside the harness, no offset-level or field-name drift is detected, and the change
      is uncommitted so nothing has exercised it in a deployed build.
