        status: VALIDATED
        denominator: >-
          FIXED in aa4c4c75 (2026-08-25); the paragraph below is the pre-fix
          measurement, kept because it is the denominator the fix is judged
          against. Post-fix witnesses, all via `model selections`, which now
          prints the flag word: A1 T-72 rev 40 sections 0-2 `0x1000c000`
          HIDDEN-PROXY; A2 T-72 rev 48 sections 1-3 `0x10002000`; rev-49
          `house_k_1_ep1.p3d` LOD 0 `0x10002000` against the `0x0` recorded
          below. The 6,030-section Takistan sweep has NOT been re-run post-fix;
          the three fixtures above are single models, and the corpus number
          remains the pre-fix one until someone re-runs `census.py`.
          Pre-fix measurement follows.
          `Odol49.hpp:205` and `Odol40.hpp:332` read the section's CommonFaceFlags
          word as `(void)reader.read<uint32_t>()`. That word sits between
          `textureIndex` and `materialIndex` and carries `0x10000000`, IsHiddenProxy.
          `Odol73.hpp:875` already keeps it, which is why Arma 3 hides proxies and
          Arma 2, OA, DayZ and Arma 1 do not. Measured on Takistan over 513 distinct
          models and 438,749 placements: 40 models carry proxy records over 2,251
          placements, 348 proxy marker sections exist across all LODs and 348 of 348
          are flagged hidden in the file bytes, with the flag word `0x10002000` in 41
          of 41 LOD-0 cases and no variance -- while the engine reader delivers a
          non-zero hint on 0 of 6,030 sections in the entire world. 6,313 marker
          triangles total, 1,898 of them on drawable LODs.
      - capability: HIDDEN_PROXY_DOWNSTREAM_PATH
        status: VALIDATED
        denominator: >-
          Everything after the reader is already correct and needs no change.
          `ODOLLoader.hpp:365` masks the word into `Section::hints`,
          `ShapeAdapter.cpp:561` copies it into `ShapeSection::properties`, and five
          skips test `Special() & (IsHidden|IsHiddenProxy)`: `EngineWgpu.cpp:3407` and
          `:3554` on the retained path, `ShapeDraw.cpp:220` on the CPU path, plus the
          shadow paths. All five currently see 0 on Arma 2/1 content. Proven by the
          revision-73 control: `offroad_01_unarmed_f.p3d` reports 28 of 267 sections
          carrying `0x10000000` through the same engine code.
      - capability: PROXY_MARKER_SHOULD_BE_HIDDEN
        status: VALIDATED
        denominator: >-
          Hiding is the correct behaviour, not a guess. `ShapeAdapter.cpp:760-798`
          builds a ProxyObject per proxy record and `Object::DrawProxies`
          (`Object.cpp:871`) draws the resolved model at the marker's transform, so
          the marker is replaced as well as hidden. The OFP path states the contract
          outright at `ShapeLOD.cpp:865` -- `OrSpecial(IsHiddenProxy|NoTexMerger)`,
          `SetTexture(nullptr)`, and a "Proxy face should be hidden" log when the flag
          is absent.
    known_failures:
