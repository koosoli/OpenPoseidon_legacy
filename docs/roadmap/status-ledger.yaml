      denominator: PAA_TAGG_CAPTURE VALIDATED (AVGC/MAXC/FLAG/SWIZ/OFFS plus
      unknown-tag capture); PAA_MIP_SIZE_FLAG VALIDATED; PAA_COMPRESSED_MIP
