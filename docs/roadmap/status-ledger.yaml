      container, and is never silently read with the revision-73 layout.
    reviewer: null
    reviewer_method: >-
      AUTOMATED_EVIDENCE, not a human review. Machine-checked -- both Binarize
      outputs hashed and sized (61,130 and 61,128 bytes with their SHA-256s
      recorded alongside the 302,209-byte source), the byte-difference count
      between them computed (54,999 positions), and the refusal pinned by unit
