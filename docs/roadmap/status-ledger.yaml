        status: VALIDATED
        denominator: >-
          AVGC/MAXC/FLAG/SWIZ/OFFS over 3,283 archived textures
      - capability: PAA_COMPRESSED_MIP
        status: PARTIAL
        denominator: >-
          124/124 sample textures decode offline; Pactext decode still raw-only
      - capability: PAA_SWIZ
        status: CAPTURED_NOT_APPLIED
        denominator: >-
          1,146 observed values; encoding unresolved, never guessed
      - capability: PAA_FLAG
        status: CAPTURED_NOT_INTERPRETED
        denominator: >-
          values 1 and 2 carried verbatim
    known_failures:
      - >-
        PAA_COMPRESSED_MIP decode is implemented for the modern decoder path only
        (PAADecoder / PoseidonFormats). Pactext's own decode routines, which the
        running game uses, still read block data raw -- correct today because no
        OFP/CWA texture sets the compressed flag, but it must be wired there before
        Arma content reaches the renderer.
      - >-
        PAA_SWIZ: CAPTURED, NOT APPLIED. The four bytes are preserved verbatim but
        no channel rearrangement is performed. Observed values across 1,146 archived
        textures include 0x00-0x09, which does not fit a plain channel-plus-invert
        reading. With LZO decode working it was possible to measure one case
        directly: Minigun_NOHQ.paa (SWIZ 05040203) decodes to R empty, B constant,
        and G+A holding the normal's x,y -- 100% of texels satisfy x^2+y^2 <= 1 for
        G+A and no other pair, i.e. the DXT5nm layout. That fixes what ONE swizzle
        means, not the byte encoding; generalising from a single sample is what the
        plan forbids, so the mapping stays unapplied and this measurement is handed
        to MAT-020/MAT-030.
      - >-
        PAA_FLAG: CAPTURED, NOT INTERPRETED. Values 1 (1,243 files) and 2 (102) are
        carried verbatim; alpha classification still comes from the existing decoded
        -alpha scan rather than from the tag.
    fallback: >-
      An unsupported compressed mip now refuses with an accurate diagnostic instead
      of being misreported as an extreme texture size, and existing uncompressed
      PAA decoding is unchanged -- the owner smoke test after this change still
      loads a mission with correct textures.
    reviewer: null
    reviewer_method: >-
      AUTOMATED_EVIDENCE, not a human review. Capability claims, each naming its
      denominator: PAA_TAGG_CAPTURE VALIDATED (AVGC/MAXC/FLAG/SWIZ/OFFS plus
      unknown-tag capture); PAA_MIP_SIZE_FLAG VALIDATED; PAA_COMPRESSED_MIP
      UNSUPPORTED; PAA_SWIZ CAPTURED_NOT_APPLIED; PAA_FLAG CAPTURED_NOT_INTERPRETED.

      Machine-checked: 4 Catch2 cases under [ast-013] (33 assertions) over authored
      fixtures covering full tags, an unknown tag that must not desynchronise the
      mip chain, a file with no tags, and the compressed-mip flag; full suite green
      apart from the 6 failures pre-existing at HEAD. Against the real corpus: tag
      histograms were measured over 3,283 textures read out of 40 Arma 3 PBOs, and
      for the 124 loose sample textures the C++ reader agreed with an independent
      Python parse on the dimensions of all 26 decodable files with 0 mismatches,
      while correctly flagging the other 98 as compressed.

      LZO1X was written from the published format, not adapted from liblzo, so no
      upstream licence attaches (CORE-007). Which compression PAA uses was
      determined rather than assumed: the engine's existing LZSS decoder produced
      nothing usable on these payloads (0 of 40 sampled mips), while LZO1X reads all
      98 compressed mips in the sample corpus to exactly the byte count their DXT
      dimensions require, and 124/124 sample textures then decode through the
      shipped DLL with correct dimensions and non-empty pixels -- up from 26/124.
      7 further Catch2 cases under [lzo] cover overlapping matches, a
      back-reference before the output start, a too-small destination, truncated
      input and the end-of-stream opcode.

      NOT checked: no channel data was validated against a reference image -- this
      ticket does not claim any decoded texture is correct, only that the container
      is read correctly. SWIZ and FLAG are captured, not acted on, so nothing here
      establishes what they mean. The compressed 98 were never decoded at all.
