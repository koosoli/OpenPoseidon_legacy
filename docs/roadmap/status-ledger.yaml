    known_failures:
      - >-
        A P3DM LOD is refused rather than skipped. It cannot be skipped: P3DM face
        records are variable-length, so the block end is only knowable by parsing
        it, which is AST-011B. Every Arma-generation model therefore still fails to
        load -- as it did before, but now with an accurate diagnostic instead of
        "Invalid SP3X signature: got 'P3DM'".
    fallback: >-
      UnsupportedLodFormat derives from std::runtime_error, so the existing
      catch-all sites in ModelCache and ShapeAdapter behave exactly as before; only
      callers that want to distinguish unsupported-but-valid from malformed need to
      know the new type.
    reviewer: null
    reviewer_method: >-
      AUTOMATED_EVIDENCE, not a human review. Machine-checked: 6 new Catch2 cases
      (24 assertions) under tag [ast-011a], plus the 19 pre-existing [mlod] cases
      still green, so the SP3X path is unchanged. Verified end to end through the
      shipped PoseidonFormats DLL rather than only in-process: a P3DM and an
      unknown-signature fixture are refused with accurate diagnostics while two
      SP3X models still load with the expected LOD counts.

      NOT checked: no P3DM model was rendered or even parsed -- this ticket only
      routes and refuses, so nothing about P3DM geometry, UVs or materials is
      claimed. The mixed-signature fixture steps over its P3DM LOD using a length
      the generator knows, not one the reader derived; deriving it is AST-011B. Six
      unrelated suite failures were confirmed pre-existing at HEAD (five need absent
      packages\Remaster game data, one is a stale --dev CLI assertion from commit
      2487647) and are untouched by this change.
