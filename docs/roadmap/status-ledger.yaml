      histograms were measured over 3,283 textures read out of 40 Arma 3 PBOs, and
      for the 124 loose sample textures the C++ reader agreed with an independent
      Python parse on the dimensions of all 26 decodable files with 0 mismatches,
      while correctly flagging the other 98 as compressed.

      LZO1X was written from the published format, not adapted from liblzo, so no
      upstream licence attaches (CORE-007). Which compression PAA uses was
      determined rather than assumed: the engine's existing LZSS decoder produced
      nothing usable on these payloads (0 of 40 sampled mips), while LZO1X reads all
      98 compressed mips in the sample corpus to exactly the byte count their DXT
