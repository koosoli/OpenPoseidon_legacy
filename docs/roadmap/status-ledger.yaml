    production_call_sites:
      - file: engine/Poseidon/Asset/Formats/Material/ShaderSchema.hpp
        symbol: kMulti
    test_ids: [mat-034-multi-per-surface-stages]
    benchmark_artifacts: []
    evidence_hash: 6bc5f320893557e457503007233101d16df0ebc4f7c4a9eb9dd04f456c5bf7dc
    decision_record: docs/roadmap/decisions/MAT-034-multi-beyond-its-layers-20260810.md
    capability_claims:
      - capability: MULTI_PER_SURFACE_STAGES_BOUND
        status: VALIDATED
        denominator: >-
          MAT-030 measured `Multi` as far as Stage8 and stopped three stages short.
          Re-measured over all 1,628 Multi materials in the Arma 3 corpus: Stage9
          macro present in 1,626 (`_mc` 1168, procedural mc 443), Stage10 ambient
          shadow in 1,628 (`_ads` 808, `_as` 388, `_adshq` 274), Stage11 normal map
          in 1,628 (`_nohq` 1486, procedural nohq 141). Stages 9-11 are per-surface,
          not layered, so they raise no blending question -- and this build was
          binding none of them, leaving the second largest object family in Arma 3
          without a normal map. Denominator is the Arma 3 corpus only; no A2/OA
          Multi count was taken, and nothing here covers the four layered stages.
      - capability: DTSMDI_READS_AS_SMDI
        status: VALIDATED
        denominator: >-
          72 `_dtsmdi` textures decoded: A constant 255 in 72/72, R centred on 128 in
          64/72 (mean of means 135, a detail multiplier around 0.5), G varying in
          72/72 and flooring at 0 in 70/72 (mean 27), B varying in 58/72 (mean 140).
          That is SMDI's channel assignment exactly -- G specular level, B gloss --
          with detail in R, which on a plain SMDI is dead (constant 255, measured
          n=40 under MAT-020). So no split and no new channel map were needed. Only
          Stage5 binds, paired with Stage0, because layer 0's colour already stands
          in for the whole surface; layers 1-3's detail+specular stay unbound.
      - capability: MULTI_SPECULAR_MAP_BOUND
        status: VALIDATED
        denominator: >-
          Whole-world object census on Stratis, 436 materials reporting a
          `SpecularDetail` outcome: specular map bound 206 -> 320, `Multi` bound
          0 of 114 -> 114 of 114, and materials carrying a bright constant (>=0.5)
          with still no map 90 -> none. Albedo coverage is unchanged (293 with no
          RVMAT albedo, 291 falling back to a working face texture, 2 unresolvable).
          One world. The 116 materials still reporting no specular map are `TreeAdv`
          45, `Normal` 42, `TreeAdvTrunk` 25, `TreeAdvTrans` 4, none of them bright.
      - capability: MULTI_FOUR_LAYER_BLEND
        status: NOT_PRODUCED
        denominator: >-
          The masked four-layer blend itself is deliberately not attempted here.
          Stages 1-3 and 6-8 remain unmapped across all 1,628 Multi materials -- the
          second, third and fourth colour layer have no representation in the slot
          set -- and the Stage4 mask is preserved but sampled by nothing. That is the
          real Multi feature and it needs the layered-material design decision
          MAT-030 asked for; this ticket only stops the family being wrong about
          everything that is not layered.
      - capability: ADS_B_CHANNEL_SEMANTICS
        status: CAPTURED_NOT_INTERPRETED
        denominator: >-
          `_ads` is not `_as`. Measured over 47 textures: R constant 255 in 46, A in
          47/47, but B varies in 47/47 as well as G, and B's mean tracks G's within 2
          in only 27 of 47 -- so B is a second quantity, not a copy of G. The
          `AmbientShadow` channel map declares B unused, which is measured true for
          `_as` and measured false for `_ads`. Nothing samples the slot yet, so
          nothing is wrong in effect; the discrepancy is recorded rather than left
          for whoever first samples it.
    known_failures:
      - >-
        The four-layer blend is not implemented. Three of Multi's four colour layers,
        and three of its four per-layer detail+specular stages, have no slot at all;
        the Stage4 mask is carried and read by nothing.
      - >-
        `_ads` violates the `AmbientShadow` channel map's `unused` declaration on B
        (varies in 47/47). The map was not corrected -- only the measurement recorded.
      - >-
        `_ads` had been an unrecognised suffix, and it is the majority spelling
        (808 of 1,628 Stage10 bindings against 388 `_as`), so the second witness had
        been silent on the commonest form of the commonest layered material.
    fallback: >-
      A material with no `SpecularDetail` slot keeps the constant-only behaviour it
      had before. The `WGR_MATERIAL_SPEC_UNMAPPED` approximation stays in the code
      although its population on Stratis is now empty, because another world may
      still present the case; it is simply no longer doing any work here.
    reviewer: null
    reviewer_method: >-
      Corpus counts and channel decodes: 1,628 Multi materials re-measured through
      Stage11, 72 `_dtsmdi` and 47 `_ads` textures decoded channel by channel, and a
      whole-world Stratis object census across 436 materials showing specular
      bindings 206 -> 320 and the bright-constant-unmapped population falling to
      zero. A unit test pins that Multi's normal, macro and ambient shadow are
      per-surface rather than per-layer. Not checked: no human judged a frame, no
      pixel diff is recorded, the 1,628-material figure is Arma 3 only with no A2/OA
      equivalent taken, and nothing verifies the four-layer blend because it is not
      implemented -- the census counts bindings, not what they look like.
    supersedes: []
    evidence:
      - docs/roadmap/decisions/MAT-034-multi-beyond-its-layers-20260810.md
      - engine/Poseidon/Asset/Formats/Material/ShaderSchema.hpp
      - engine/Poseidon/Asset/Formats/Material/MaterialChannels.hpp

  - id: MAT-035
    overlay: COMPAT-C1-EXEC-001
    is_example: false
    title: Arma 3's shadow LODs classified as ordinary visual LODs
    class: ENGINE
    obligation: REQUIRED
    execution_mode: IMPLEMENT
    review_model: AUTOMATED_EVIDENCE
    scheduling_state: DONE
    status: VALIDATED
    outcome: ADAPTED
    owner: null
    branch: grass-lod-dissolve-photo-cards
    baseline_commit: 472ffc3
    verification_commit: c51ea85
    milestone: 2C
    milestone_role: NON_BLOCKING_VALIDATION
    depends_on: [MAT-032, MAT-033]
    blocked_by: []
    blocks: []
    implementation_commits: [c51ea85]
    production_call_sites:
      - file: engine/Poseidon/World/Model/LodPurpose.hpp
        symbol: IsDrawableLod
      - file: engine/Poseidon/Graphics/Rendering/Shape/Shape.hpp
        symbol: IsNormalLevel
    test_ids: [mat-035-shadow-lods-not-viewing-distances, mat-035-unknown-sentinel-not-drawable]
    benchmark_artifacts: []
    evidence_hash: b279d710862d00cfb0863ae5b5bbcf25ee94a1462a85561c96e513d5d10ce50b
    decision_record: docs/roadmap/decisions/MAT-035-shadow-lods-were-drawable-20260811.md
    capability_claims:
      - capability: SHADOW_LODS_NOT_DRAWABLE
        status: VALIDATED
        denominator: >-
          `ClassifyLodResolution` caught special LODs at `resolution >= 1e5`, but
          Arma 3 authors shadow geometry at 10000/10010 (shadow volume) and
          11000/11010 (shadow buffer), below the cut-off, so they classified as
          `Visual` with a 10 km viewing distance. `IsNormalLevel` could not catch
          them either: it compares against the indices `ScanShapes` assigns, one per
          purpose, and nothing has ever held a shadow index while a model carries two
          shadow volumes. Measured over sampled models: 36 of 45 Arma 3 structures
          carry a 10000 LOD and 36 of 45 an 11000 LOD; 0 of 120 CWA/OFP models carry
          either, so correcting it cannot regress stock content. These are samples,
          not whole-corpus counts.
      - capability: UNKNOWN_LOD_NOT_DRAWABLE
        status: VALIDATED
        denominator: >-
          A3 models carry a 4e13 LOD the table does not name. It classified as
          `Unknown`, which was neither drawable nor geometry-only, so a consumer
          asking "is this geometry?" drew it. `IsDrawableLod` now states positively
          which purposes may be drawn, excluding `Unknown` by construction rather
          than by omission. Measured effect on Stratis: `penetration\*` materials
          reaching the colour pass 4 -> 0, materials with no albedo 293 -> 291. Those
          two were the last unresolvable materials left by MAT-032. One world.
      - capability: SHADOW_LOD_FIX_HAS_VISIBLE_EFFECT
        status: UNSUPPORTED
        denominator: >-
          Same camera and dev mission before and after differ by 19 pixels above a
          threshold of 20, scattered as antialiasing noise; the frames are otherwise
          identical. Three claims were made and withdrawn: it does not explain the
          owner's white orb (never reproduced across three camera positions at noon
          and at dawn), it does not explain the flat green boxes on the distant
          hillside (unchanged), and the proposed mechanism is unsupported -- the LOD
          chooser walks resolutions ascending and stops at the first level too coarse
          for the required detail, so it does not in practice reach a
          10000-resolution level. The defect is that these levels were registered as
          drawable at all, and wasteful of the retained set, not that they were being
          drawn at this camera.
      - capability: DEV_MISSION_PIXEL_AB_HARNESS
        status: VALIDATED
        denominator: >-
          Corrects MAT-033's note that captures are not frame-deterministic. That
          holds for the training mission, which has live AI, an animated player and
          moving cloud: two runs differ by mean 67/255. The `dev-missions/devtest*.abel`
          missions have one stationary soldier and no scripts, and two runs of one
          differ by mean 0.054/255. A/B by pixel diff is therefore available provided
          the dev mission is used. Denominator: two runs of one mission of each kind.
      - capability: WHITE_ORB_AND_GREEN_CARD_CAUSES
        status: PARTIAL
        denominator: >-
          A follow-up on the same day found both reported symptoms had independent
          causes, neither related to LOD classification: WGPU's experimental
          procedural lens-flare pass drew a sun-strength screen-space flare whenever
          its ray saw open sky (now off by default, `SkySettings::lensFlare = 0`,
          with the legacy sun decal also suppressed on WGPU so two solar flares do
          not stack), and `ClassifyGpuSection` did not apply the CPU path's binary
          DXT1/PAC alpha cutout rule, so imported foliage marked opaque in the P3D
          drew its texture's dark background as full cards (now the same
          `AlphaStats::Cutout` -> `alpha_ref >= 0.5` rule as `DrawSectionTL`).
          Verified by one installed-game capture: `--render=wgpu`, `WGR_GPU_DRIVEN=1`,
          `@a3stratis`, `devtest.abel`, world position 2062 5572, frame 400, showing
          neither the flare blob nor opaque green cards, plus
          `run_preview0_wgpu_check.ps1`. PARTIAL because those two changes landed in
          commits after this ticket's verification commit and are not covered by its
          evidence set, and because one capture at one position is the whole test.
    known_failures:
      - >-
        The shadow-LOD correction explains none of the reported symptoms. Its entire
        measured visual effect is 19 antialiasing pixels.
      - >-
        The RND-alpha-routing hypothesis ("the shadow is not missing, it is being
        drawn in the wrong place as visible geometry") is only half-answered: shadow
        LODs really were reaching the drawable set, but whether that produced its
        night-glow symptom is untested and open.
      - >-
        The lens-flare pass is disabled rather than fixed. It stays off until its
        sun-direction and occlusion contract is validated.
    fallback: >-
      `IsDrawableLod` states drawability positively, so an unrecognised or future LOD
      purpose falls out of the draw path rather than into it -- the failure direction
      is a missing draw, not a shadow volume rendered as visible geometry. Stock
      CWA/OFP content carries none of these levels (0 of 120 sampled), so its path is
      untouched.
    reviewer: null
    reviewer_method: >-
      Per-world material counts through the production path plus a deterministic
      pixel A/B: `penetration\*` materials reaching the colour pass fall 4 -> 0 and
      no-albedo materials 293 -> 291 on Stratis; the same camera before and after
      differs by 19 pixels above threshold 20 in a dev mission whose own run-to-run
      noise is mean 0.054/255. LOD-purpose classification and the unnamed 4e13
      sentinel are pinned by two unit tests. Not checked: the model counts (36/45 A3,
      0/120 CWA) are samples rather than a corpus census; no human judged a frame;
      the owner's white orb was never reproduced under this change; and the two
      follow-up fixes described in the record are not in this ticket's verification
      commit, so its evidence set does not cover them.
    supersedes: []
