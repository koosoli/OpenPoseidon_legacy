          reaches the IR. Left reading UNSUPPORTED, this row makes the animation work
          look like a parser project when it is a plumbing one, which is the estimate
          error it was about to cause.
      - capability: LATER_ODOL_REVISIONS_48_49_50_52
        status: SUPERSEDED
        denominator: >-
          0 bodies parsed across the 4 remaining corpus revisions, measured at this
          ticket's own verification commit and true there. SUPERSEDED by WLD-016 at
          `c536015`, whose ODOL_A2_STATIC_LOD_PARSE row is the live claim: 534 of 534
