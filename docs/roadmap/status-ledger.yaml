    evidence_hash: 1b098a47d63c608775da8ba18b65b19ac53cb4d79c11d032963d8e3f721e689d
    decision_record: null
    known_failures:
      - >-
        FOUND AFTER INTEGRATION (2026-08-03, fixed in 36a9d29). The documented
        build command did not produce a current binary. `cmake --build <dir>
        --target PoseidonGame` -- the deploy step in CLAUDE.md -- skipped the
        wgpu cdylib staging target, because it was an ALL custom target that
        nothing depended on, and `--target X` builds only X and its
        dependencies. dist/ therefore kept the DLL from the last bare
        `cmake --build`: one day stale for PoseidonGame, twelve days for
        PoseidonGameDemo, with every build reporting success. This is a
        reproducible-build defect and belongs against this ticket rather than
        only in the commit log: a build that silently ships a stale renderer is
        not reproducible, whatever the ledger said. It went unnoticed because a
        stale cdylib does not crash -- the FFI exports still resolve and
        appended WgrWaterParams lanes are ignored by the older DLL -- so it
        presents as new settings having no effect. Deployments must be verified
        by CONTENT; file timestamp and hashing the source against the
        destination were both green throughout.
      - >-
        Hosted Linux Trident run 30743729550 initially lacked libwgpu_renderer.so;
        after packaging was fixed it still timed out waiting for HARNESS_PORT in
        the explicit WGPU shadow-map scenario. The headless retry pins WGPU to
        its GL backend under Xvfb; hosted CI acceptance remains outstanding.
      - >-
        Hosted Linux Trident run 91499679288 (GL33, Xvfb) failed the automatic
        I-20 GL-error post-check on flows/demo/credits (2 errors) and
        flows/demo/mission_load (3 errors). The counts equal each test's number
        of triScreenshot calls exactly, which places the errors in
        EngineGL33::CaptureScreenshotIfPending's readback beyond reasonable
        doubt. dacdf77 addresses it by binding the default read framebuffer and
        blitting to a single-sample target before glReadPixels.
        CORRECTION (2026-08-02): dacdf77's stated cause -- a default framebuffer
        that SDL/Xvfb exposes as multisampled -- was recorded here as fact and
        should not have been. EngineGL33 never requests multisampling on its GL
        context: it sets only CONTEXT_*, DOUBLEBUFFER, DEPTH_SIZE and
        STENCIL_SIZE, with no SDL_GL_MULTISAMPLEBUFFERS anywhere in the tree. A
        likelier cause is that the pre-fix code called glReadPixels against
        whatever framebuffer post-FX had left bound, since it never bound
        framebuffer 0 first. dacdf77 fixes that case too -- it binds the default
        read framebuffer explicitly -- so the fix is plausibly right for a
        reason other than the one given. The per-capture correlation is
        evidence; the specific GL cause is a hypothesis, and only a hosted log
        can settle it.
      - >-
        The same run was SIGTERMed at exactly 15m by the step bound added in
        816ec28, with scenarios still queued. 81 sequential scenarios each pay
        a fresh game startup under Xvfb, so the suite exceeds 15 minutes even
        when every test passes: the bound was killing healthy runs rather than
        catching hangs. Raised to 35m (job 45m) so it remains a hang guard.
        The suite's true runtime is unmeasured -- tri's progress bar is
        suppressed on a non-TTY, so CI logs carry no per-test timings. If the
        raised bound still binds, use tri's -j parallelism (documented locally
        as -j6) rather than raising it again.
      - >-
        DISPROVED (2026-08-03). The connect_timeout theory was wrong. Raising
        rendering/shadow_map_scene_dump's HARNESS_PORT budget to 300s made the
        hosted run ~469s slower (1719.4s vs 1250.2s) and it still failed all
        three attempts. WGPU is therefore not starting slowly under Xvfb -- it is
        not starting at all, and the extra budget bought only dead waiting.
        The pipeline-count measurement behind that theory stands (38 pipelines
        from 43 WGSL sources, no cache, ~3s more than GL33 on a discrete GPU);
        it simply was not the cause. The per-test connect_timeout knob is kept
        because it is correct in principle, but this scenario no longer sets it.
        The scenario is tagged ci-host-blocked so the hosted suite reads
        honest-green and a NEW regression stays visible, rather than sitting
        permanently red where nobody reads it. The test is good -- it passes
        locally in ~6s. What is broken is WGPU under Xvfb, which is this
        ticket's own subject. Remove the tag when that works; nothing else
        needs to change.
        Still unknown: whether WGPU crashes, hangs before announcing, or fails
        adapter selection on the GL backend. The numbered per-instance logs
        added in ac6c939 should show it on the next failing run.
      - >-
        WGPU startup cost measured (2026-08-02). Renderer init builds 38
        pipelines from 43 WGSL sources with no pipeline cache before the harness
        can be served. On an RTX 3070 that is ~3s more than GL33 for the same
        mission (7.4s vs 4.5s total startup), and it is shader-compile bound --
        the part that scales worst on the hosted runner's software rasteriser.
        rendering/shadow_map_scene_dump, the only WGPU-pinned scenario, times
        out hosted at its 90s HARNESS_PORT budget.
        Trident gains a per-test connect_timeout so startup can have its own
        budget without also lengthening command and event waits, which with
        retries would spend minutes waiting on an already-broken run. The
        scenario is set to 300s. Verified the knob is wired by setting it to 1s
        and reproducing the hosted failure signature exactly, then restoring it.
        This buys time for a slow start; it does not prove WGPU starts reliably
        under Xvfb. If the scenario still fails hosted, the numbered per-instance
        logs will now show whether it was slow or crashed.
      - >-
        RESOLVED (2026-08-02, run 30760957610). The first hosted Trident run to
        complete: 81 tests, 78 passed, 3 failed, 1554.6s under -j4, inside the
        35m bound. flows/demo/credits and flows/demo/mission_load -- the two
        I-20 GL-error failures that blocked Preview 0 -- both PASS. dacdf77's
        capture rework is therefore confirmed by hosted CI, which was the only
        environment that could confirm it. Note the cause recorded for it was
        still wrong (see the correction below); the fix works regardless.
        Three failures remain, none of them the capture gate:
        rendering/shadow_map_scene_dump still times out waiting for HARNESS_PORT
        in the explicit-WGPU scenario, which is the pre-existing failure already
        recorded above and is unrelated to -j4.
        flows/campaign/campaign_flow and
        flows/demo/full_game_demo_campaign_placeholder both fail at the same
        step: after the campaign screen opens (display 43 asserted OK, and the
        placeholder test's "Demo Campaign" text assert also passes), clicking
        Back leaves the game short of the main menu, so
        `triSimUntil { triDisplay == 0 }` never satisfies. Both failed their
        retries, so this is not load flakiness -- unlike
        ui/editor/editor_altenter_keeps_rendering and
        ui/options/audio/new_audio_music_suppress, which failed once and
        recovered, the signature of contention under -j4.
        campaign_flow passes locally on retail data under GL33 (3.9s), so the
        failure is specific to the hosted environment or to packages/Demo, which
        this workstation does not have. Reproducing it needs the Demo assets.
        Whether these three are regressions or long-standing is unknown: no
        prior run ever finished, so there is no baseline to compare against.
      - >-
        DIAGNOSED (2026-08-02) using the Demo install Oliver already had at
        "D:\SteamLibrary\steamapps\common\Arma Cold War Assault Demo" -- no
        asset download was needed. Both campaign tests PASS locally on Demo data
        serially (6.0s) and still pass at -j4 on a 16-core workstation, so
        neither the data nor parallelism as such is the cause.
        Oversubscribing locally (-j12) reproduces the CI failure classes
        exactly: HARNESS_PORT spawn timeouts, UI assertions firing before the
        display settles (mods tests reading an empty or wrong active set), and
        I-20 GL errors under many concurrent contexts. It is contention, not
        state corruption -- triGetModsActiveSet reads in-process UI state, not a
        shared file, so nothing leaks between instances. An earlier note in this
        session claiming the mods fixtures made parallelism safe was reasoning
        about the wrong kind of state.
        Parallelism also scales poorly here: serial exceeded 2100s and -j4
        finished in 1554s, about 1.35x for 4x the concurrency, because the cost
        is game startup against a shared Xvfb display and disk rather than CPU.
        CI therefore drops to -j2, which keeps most of the wall-clock win with
        far less contention. This is a judgement call on imperfect data: -j2's
        wall time is unmeasured, and if it approaches the 35m bound the honest
        next step is to make the load-sensitive tests' timing budgets robust
        rather than to raise the bound again.
      - >-
        The raised bound did still bind. Run 30758908654 (the first hosted run
        after Actions resumed) was SIGTERMed at 2081s -- exactly the new 35m
        bound -- with scenarios still queued. Every other job in that run
        passed: Linux RelWithDebInfo, Windows RelWithDebInfo, SteamRT4 Release,
        and Rust/Trident. Only the Linux Trident step failed, and it failed by
        timeout rather than by any test result, so the GL33 capture fix in
        dacdf77 remains unconfirmed either way.
        Per the plan recorded above, the suite now runs with -j4 rather than
        taking a third bound increase. Trident's scheduler supports this
        directly: `exclusive`-tagged tests reserve the whole pool and run
        alone, multi-instance tests reserve one slot per game process, and the
        behaviour is covered by its own unit tests.
    fallback: Explicit GL33 selection is retained; explicit WGPU cannot silently select it.
