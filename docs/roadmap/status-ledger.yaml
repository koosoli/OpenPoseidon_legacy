      - engine/Poseidon/World/Terrain/Landscape.hpp
      - engine/Poseidon/Foundation/Platform/AppConfig.hpp
      - engine/WgpuRenderer/TerrainWgpu.cpp

  - id: WLD-018
    overlay: COMPAT-C1-EXEC-001
    is_example: false
    title: The terrain satellite stage was dropped on both generations
    class: ENGINE
    obligation: REQUIRED
    execution_mode: IMPLEMENT
    review_model: AUTOMATED_EVIDENCE
    scheduling_state: DONE
    status: VALIDATED
    outcome: ADAPTED
    owner: null
    branch: grass-lod-dissolve-photo-cards
    baseline_commit: 79b455f
    verification_commit: 01dfa6d
    milestone: 2C
    milestone_role: NON_BLOCKING_VALIDATION
    depends_on: [WLD-015, WLD-016, WLD-017]
    blocked_by: []
    blocks: [WLD-019]
    implementation_commits: [01dfa6d]
    production_call_sites:
      - file: engine/Poseidon/World/Terrain/LandSave.cpp
        symbol: Poseidon::Landscape::LoadOprwModern
    test_ids: [oprw24-local-corpus, oprw25-local-corpus, preview0-wgpu-check,
               original-training-wgpu-capture]
    benchmark_artifacts: []
    evidence_hash: e54e5e576c270c55c076513564361686790536ff800de27c9ef3d852cf5d846e
    decision_record: docs/roadmap/decisions/WLD-018-satellite-stage-was-dropped-on-both-generations-20260812.md
    capability_claims:
      - capability: SATELLITE_STAGE_REACHES_THE_IR
        status: CAPTURED_NOT_APPLIED
        denominator: >-
          LandSave matched Stage0 with find("_co.paa"). The satellite is named
          _lco.paa, which does not contain that substring, so Stage0 never matched on
          either generation and A3TerrainMaterial::satellite was always empty --
          invisibly, because the renderer fell back to the legacy cell texture for the
          satellite slot. Accepting _lco.paa captures it: ground layers rise from 499
          to 982 on Takistan and from 76 to 140 on Stratis, the satellite tiles having
          never been uploaded before. Nothing consumes it yet: the authored composition
          is still gated behind WGR_TERRAIN_A3_SURFACES, default 0, so neither world's
          render changes. Two worlds; no Arma 1 world and no community terrain.
      - capability: TERRAIN_STAGE_ROLES_ARE_SHARED_ACROSS_GENERATIONS
        status: PARTIAL
        denominator: >-
          Read directly from the raw RVMATs of one tile per generation -- Takistan
          ca\takistan\data\layers\p_011-010_* (PixelShaderID TerrainX) and Stratis
          a3\map_stratis\data\layers\p_003-000_* (TerrainSNX). Both put the satellite
          at Stage0, the mask at Stage1, a procedural at Stage2 and per-surface
          normal/colour pairs from Stage3, so the two generations are the same
          structure under two shader names and the handover's warning about forcing OA
          through A3 assumptions does not apply to these stage roles. Two real
          differences: Arma 3 adds a per-tile terrain normal at Stage14
          (n_<x>_<y>_no.paa) which Takistan has none of, and the Takistan tile uses
          five surfaces to this Stratis tile's two. PARTIAL because the denominator is
          one tile per generation, not a corpus census -- the corpus-wide family counts
          (3,531/3,531 TerrainX, 478/478 TerrainSNX) were only measured later under
          WLD-019.
      - capability: SATELLITE_AS_LEGACY_CELL_TEXTURE
        status: UNSUPPORTED
        denominator: >-
          Tried and wrong, recorded as a negative result. The satellite is one
          low-frequency image per 1,024 m tile carrying its own worldPos TexGen; the
          legacy slot is sampled through the 50 m land cell's frame. Binding one as the
          other tiled a whole tile's image into every cell and produced a corduroy
          pattern over the entire map. Reverted, with the reason recorded in the code
          so it is not retried.
      - capability: TERRAIN_NORMAL_MAPS
        status: NOT_PRODUCED
        denominator: >-
          Terrain normals reach neither the IR nor the renderer on either generation:
