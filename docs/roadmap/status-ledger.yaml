    decision_record: docs/roadmap/decisions/WLD-019-lca-mask-is-an-indexed-selector-20260812.md
    capability_claims:
      - capability: LCA_MASK_IS_AN_INDEXED_SURFACE_SELECTOR
        status: VALIDATED
        denominator: >-
          Measured over every shipped mask of both generations: 64 Stratis masks
          (67,108,864 texels) and 220 Takistan masks (57,671,680 texels), decoded twice
          through independent readers -- PoseidonTools image convert and Bohemia's own
          ImageToPAA -- which agree byte for byte. RGB is strictly one-hot on both
          generations: 0.0000% of texels have more than one RGB channel high. Alpha
          takes three authored levels on OA (255/128/0) and two on A3 (255 at 90.6%,
          128 at 9.4%). The alpha-to-slot mapping is measured, not inferred, by
          correlating each tile's mask against the slots its own RVMATs name across 284
          tiles: alpha 128 appears only on tiles binding a 5th surface (137/137
          Takistan, 30/30 Stratis) and alpha 0 only on tiles binding a 6th (47/47
          Takistan), with zero counterexamples. The converse does not hold -- a tile may
          declare a slot its mask never selects at measurable frequency -- which is
          expected, since the slot set is the union over a tile's RVMAT variants.
      - capability: TERRAIN_SHADER_FAMILY_SLOT_LAYOUT
        status: VALIDATED
        denominator: >-
          Two families, read by stage index rather than encounter order. Arma 2/OA
          TerrainX: 3,531 of 3,531 sampled, six surface slots at Stage4..Stage14, with
          Stage14 a surface colour in 696 of 696 sampled. Arma 3 TerrainSNX: 478 of
          478, five slots at Stage4..Stage12, with Stage14 the whole-tile normal
          n_<x>_<y>_no.paa. Confirmed at runtime: Stratis reports 478 tile normals and
          0 sixth-slot uses; Takistan 0 tile normals and 344 materials using the sixth
          slot, Zargabad 57, Chernarus 555.
      - capability: AUTHORED_SURFACE_COMPOSITION_ON_ARMA_WORLDS
        status: VALIDATED
        denominator: >-
          Four worlds bind completely with 0 dropped: Takistan (OPRW24) 3,292 of 3,293
          materials bound and complete over 998 ground layers, Zargabad 1,350 of 1,351
          over 988, Chernarus 1,024 of 1,025 over 2,076, Stratis (OPRW25) 478 of 479
          over 706. Takistan was 2,999 bound over 499 layers before; the rise is the
          sixth slot plus 4,796 recovered holes binding their own images. The
          ground-layer cap had to move from 1,024 to 4,096: the budget is dominated by
          per-tile images (every satellite segment contributes its own _lco and _lca) so
          it scales with map area, not surface variety, and at 1,024 Chernarus dropped
          1,052 bindings leaving 498 of its 1,024 materials incomplete. 4,096 still sits
          under the 8,192 bindless-texture device limit the renderer already requests
          unconditionally. Does not cover: no Arma 1 world (none loads at this commit),
          no OFP world (no authored materials exist there), no community terrain, and
          no world outside these four.
      - capability: LCA_DECODE_BUG_CLASS_ELIMINATED
        status: VALIDATED
        denominator: >-
          Five defects, each independently fatal, measured on the corpus. Slots were
          assigned in encounter order, so a tile leaving a stage empty renumbered every
          slot after the hole -- holes are the norm, 33,107 of Takistan's RVMAT stage
          tokens are 'n', and 4,796 Takistan holes are now preserved by reading slots by
          stage position. Only five slots existed, dropping Arma 2's sixth on 447 of
          Takistan's 484 tiles. The mask's alpha was read as a fifth weight, so with
          alpha at 255 over ~90% of texels slot 4 took full coverage nearly everywhere;
          worse on OA, which ships many masks as DXT1 with no alpha at all, so the
          decoder's constant 255 covered every tile -- the washed-out ground with
          banding along mask edges. uvTransform was read as row vectors rather than as a
          basis, which is harmless for diagonal tex stages and destroys every worldPos
          stage (Stratis's satellite TexGen made v come from terrain height, smearing
          the satellite along the slope and making the mask select one surface per
          tile); a compensating shader swizzle stacked on top of it, and both are gone.
          And the detail fade measured length() of the absolute world position as camera
          distance, thousands of metres on every real world, so detail_fade was 0 from
          the first metre and the authored surface stack had never been drawn at all --
          which is why an earlier session measured turning the flag up as a 0.047/255
          mean change.
      - capability: ARMA1_MASK_ENCODING_CORPUS_WITNESS
        status: VALIDATED
        denominator: >-
          Arma 1 is a third witness in the corpus only, measured offline -- not a
          runtime or rendering witness. Censused over all 4,859 Sahrani terrain RVMATs
          in sara.pbo: PixelShaderID Terrain1..Terrain15 (a variant id, not a layer
          count -- Terrain1, Terrain2, Terrain4 and Terrain8 all carry a single
          surface), three-stage groups (_mco, _nohq, _co) perfectly regular at 9,598 of
          9,598, first surface stage at Stage2, max four surfaces, mask named
          m_<x>_<y>_lco.paa, no tile normal. Its masks measured over 430 files (40.1 M
          texels): DXT1, no alpha (constant 255), RGB one-hot to within DXT1's block
          interpolation -- 0.85% of texels have two channels high, all at block edges.
          Four states for four surfaces, which makes the progression literally BI's own
          sentence: A1 four surfaces in RGB plus the unpainted base, A2 six by encoding
          two more into alpha, A3 five with the freed stage spent on a per-tile normal.
          A1 needs no new mask logic -- its constant-255 alpha lands on the RGB group by
          construction.
      - capability: ARMA1_TERRAIN_MATERIAL_FAMILY
        status: NOT_PRODUCED
        denominator: >-
          Deliberately not implemented. sara.wrp is OPRW revision 20 and the modern
          loader accepted only 24 and 25 at this commit, so no Arma 1 world loads and
          there is nothing to test against; revision 20 also predates the revision-23
          switch of the bulk arrays from LZSS to LZO, so it is a genuine format reader
          rather than a relaxed version check. The material half is small -- a
          per-family stride (3 vs 2), a first-stage offset (2 vs 4) and the _lco mask
          suffix, all selectable on pixelShaderId, which RvMaterialSource already
          carries -- and is left unwritten. _mco is the one A1 field with no home in the
          current IR and may stay unread.
      - capability: TERRAIN_NORMAL_MAPS
        status: NOT_PRODUCED
        denominator: >-
          Arma 3's per-tile Stage14 normal is now counted (478 on Stratis) but the
          per-surface normal maps of both generations remain outside the composition,
          carried over unchanged from WLD-018.
    known_failures:
      - >-
        Close-range surface tiling is visible on Takistan: a ~5 m repeat with no
        per-instance variation reads as wallpaper, high-frequency content that does not
        change as you approach. Breaking the repeat costs fetches and is a look question
        left to the owner rather than guessed at.
      - >-
        The authored ground reads brighter than the legacy path. A look question, not
        tuned here.
      - >-
        No Arma 1 world renders, and no OFP world is affected by construction. The A1
        evidence is a corpus census only.
      - >-
        Amendments appended to the same record after this verification commit are not
        covered by it: the satellite-modulation compositing model and the Arma 1
        census (2dd4e9e), the near-ground parallax floor and the tex TexGen scale test
        (97e213f), and the on-by-default call (5fc1cac). This entry's commit is the
        decode itself.
      - >-
        No unit test covers this; the path needs a Landscape and a live renderer.
    fallback: >-
      surface_count == 0 early-returns to the legacy cell path byte for byte, which is
      every OFP world -- OFP terrain has no authored materials at all. On Arma worlds
      WGR_TERRAIN_A3_SURFACES=0 restores the pre-decode look; the old 0.35 cap is gone,
      since it was a guard rail around a mask read as weights, and the flag now spans the
      full 0..1.
    reviewer: null
    reviewer_method: >-
      Machine-checked: a full-corpus texel census of every shipped mask on both
      generations -- 64 Stratis masks at 67,108,864 texels and 220 Takistan masks at
      57,671,680 texels -- decoded through two independent readers (PoseidonTools and
      Bohemia's ImageToPAA) that agree byte for byte, giving RGB one-hot at 0.0000%
      multi-channel texels; the alpha-to-slot mapping correlated against each tile's own
      RVMAT slot set over 284 tiles with zero counterexamples (137/137 and 30/30 for
      alpha 128, 47/47 for alpha 0); shader-family stage layouts over 3,531 TerrainX and
      478 TerrainSNX materials; runtime binding counts on four worlds (Takistan 3,292 of
      3,293, Zargabad 1,350 of 1,351, Chernarus 1,024 of 1,025, Stratis 478 of 479, 0
      dropped); a 4,859-RVMAT and 430-mask Arma 1 corpus census as an independent third
      witness for the encoding progression; and the OFP preview-0 WGPU gate plus the
      original-training mission capture passing unchanged as the no-regression arm. Not
