    capability_claims:
      - capability: ODOL73_STATIC_LOD_PARSE
        status: PARTIAL
        denominator: >-
          503 of 515 revision-73 models load across eight Arma 3 PBOs: 3den,
          signs_f, rocks_f, misc_f, weapons_f_gamma, armor_f_epc,
          structures_f_bootcamp and props_f_exp_a -- editor helpers, terrain
          rocks, signs, weapons, an armoured vehicle set, buildings and props.
          All 12 refusals are animation-scope: 10 name animations and 2 name
          sub-skeleton mapping. Every accepted model
          consumes each LOD body to its declared end offset and each rest-data
          section to its declared size, so a load is a full read rather than a
          prefix. Still refused: animations, sub-skeleton mapping, proxies,
          keyframes, per-vertex skinning, and any face that is not a triangle or
          a quad. A declared skeleton is now read rather than refused -- it is a
          declaration in ModelInfo, and the per-LOD bone arrays remain the check
          for whether a LOD is actually skinned
      - capability: ODOL73_PRODUCTION_LOAD_PATH
        status: VALIDATED
        denominator: >-
          ModelCache -- the loader the game itself calls -- accepts a revision-73
          Arma 3 model and returns geometry, pinned by test. It previously did
          not: P3DFormatDetector gated {7, 8} ahead of every reader
      - capability: ODOL73_RENDERED_THROUGH_WGPU
        status: VALIDATED
        denominator: >-
          1 real revision-73 Arma 3 static model visibly drawn through WGPU:
          rocks_f.pbo/stonesharp_big.p3d, with 10 LODs, 6,256 faces at visual
          LOD 0 and a 9.141871 m bounding radius. The control CWA a3rock.p3d
          also draws through the same --test-model lifecycle. With the direct
          a3\rocks_f\data\stonesharp_big_co.paa dependency mounted for the
          smoke, the WGPU capture visibly samples its albedo texture and the
          harness reports exists=true. This validates scene inclusion, geometry
          submission and that direct PAA texture; it does not validate RVMAT
          interpretation, normal/specular maps, alpha, Super shader mapping,
          winding, normal fidelity, section ranges or additional UV channels.
      - capability: ODOL73_COMMON_MODEL_IR
        status: PARTIAL
        denominator: >-
          all 503 accepted models reach Poseidon::Model::Model through
          ODOLLoader::load and are required to carry at least one vertex, so an
          empty success cannot pass as a load; on the selected fixture that is 48
          positions, 48 normals, 48 UVs, 48 clip flags and 16 quads with texture
          and RVMAT attached. Named selections, named properties and a second UV
          channel now cross into the IR
      - capability: ODOL73_TANGENT_FRAME
        status: CAPTURED_NOT_INTERPRETED
        denominator: >-
          packed ST pairs read and length-checked for all 48 vertices; no basis
          convention claimed and nothing downstream is given a tangent frame
      - capability: ODOL73_SKINNING
        status: SUPERSEDED
        denominator: >-
          0 skinned models parsed; a populated vertex- or neighbour-bone array raises
          rather than being skipped. True at this ticket's own verification commit.
          SUPERSEDED by WLD-012 at `fdeca8b`, which reads exactly these sections --
          model animations, LOD proxies, sub-skeleton mapping and sets, and vertex and
