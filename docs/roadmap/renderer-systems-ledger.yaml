      HISTORICAL PRE-PERF-004 FINDINGS, BOTH SUPERSEDED. The live tile-normal
      sampling and main-terrain timer regions now invalidate both paragraphs
      below; they remain only to preserve the audit trail.

      (1) Arma 3's per-tile terrain normal is plumbed to the GPU and never
      sampled. LandSave decodes Stage14 into A3TerrainMaterial::tileNormal, it
      crosses the FFI as WgrTerrainMaterial::tile_normal, and terrain.wgsl
      declares `tile_normal: u32` in its TerrainMaterial struct at line 71 — and
      that is the ONLY occurrence in the shader. It is a dead input. Takistan is
      unaffected (Arma 2/OA author no Stage14; their normals are the per-surface
      `_nopx` maps), so this costs A3 worlds only.

      (2) Cost is entirely unmeasured. gpu_timers.rs has no terrain region at all
      — the enum runs water, grass, interior sky and GTAO, and the only terrain
      token in it is PlanarTerrain, which times the REFLECTION pass, not the main
      one. So the bindless ground array, the six-slot authored composition, the
      two detail bands and the parallax tap have no per-pass number on any
      configuration, and nothing in this entry should be quoted as a cost.

