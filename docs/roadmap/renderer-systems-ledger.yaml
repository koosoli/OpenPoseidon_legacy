  - id: RSYS-DEPTH-PREPASS
    title: Opaque depth and normal prepass, Hi-Z
    plan: engine/WgpuRenderer/docs/depth-prepass-plan.md
    status: PARTIAL
    owner: null
    audited: 2026-08-03
    completeness: >-
      Stage-by-stage against the branch, which does NOT match the plan's status line
      ("Stages 0/2/3 still planned"):

      Stage 0 — NOT done. No overdraw heatmap anywhere in the tree. GPU timer regions
      exist but none brackets the opaque colour segment; the nearest is GrassPrepass.

      Stage 1 — DONE and ON by default. prepass_enabled defaults true (lib.rs);
      WGR_PREPASS=0 is a dev A/B only, and unlike several other WGR_* switches it is
      not overwritten by ConfigureWgpuUltraEnvironment. shaders/gbuffer.wgsl carries
      the octahedral encode into NORMAL_FORMAT = Rg16Float.

      Stage 2 — DONE, contrary to the plan. The depth target has TEXTURE_BINDING and
      a depth-aspect view; normal_view() is exposed and bound; both named consumers
      landed — water takes water_depth_view via set_depth_view, and Hi-Z takes the
      nearest resolve.

      2026-09-08: scene depth/stencil uses Depth32FloatStencil8 when enabled on the
      device, falling back to Depth24PlusStencil8. Both object normal prepasses use
      the same geometric fallback as colour shading for legacy zero-normal vertices;
      normalizing those vertices first made the Nogova Davle sign black.

      Stage 3 — one item of three. Foliage cutout uses alpha-to-coverage in BOTH the
      colour and prepass pipelines (foliage_a2c drives alpha_to_coverage_enabled at
      two cull.rs sites), which was the MSAA item. No evidence of the prepass replay
      being folded into the indirect path, nor of extra depth segments.

      So SSAO's stated prerequisite is already met: the normal G-buffer is populated
      including foliage and is exposed. The plan's remark that "nothing samples it
      yet" is still true — no consumer exists — but that is a missing consumer, not a
      missing producer.
    production_call_sites:
      - file: engine/WgpuRenderer/rust/src/gfx3d/hiz.rs
        symbol: pub fn build
      - file: engine/WgpuRenderer/rust/src/gfx3d/cull.wgsl
        symbol: hiz

  - id: RSYS-GPU-CULL
    title: GPU-driven culling
    plan: engine/WgpuRenderer/docs/gpu-culling-and-depth-plan.md
    status: PARTIAL
    owner: null
    audited: 2026-08-03
    completeness: >-
      "Stages 1-3 live" (the RND-030 summary) overstates stage 3. The plan's own status
      block is the accurate one:

      Stage 1 retained data model — built, folded into CullState rather than as the
      doc's CPU-draw intermediary. Stage 2 CPU-built indirect — done, default-on where
      the adapter offers INDIRECT_FIRST_INSTANCE (WGR_INDIRECT=0 forces the direct
      path). Stage 4 Hi-Z occlusion — done.

      Stage 3 GPU cull + LOD compute is LIVE in a shipped client. CORRECTED 2026-08-03:
      an earlier pass in this same audit recorded it as inert, on the strength of the
      plan's status block ("Rust DONE, inert; C++ feed + count-trim remain") and without
      checking the C++ half. Both have landed — wgr_instance_add is called from a
      _gpuDriven-gated hook in EngineWgpu, and count-trim exists as
      multi_draw_count_enabled.

      What makes this hard to read off the code: ConfigureWgpuUltraEnvironment in
      GameApplication sets WGR_GPU_DRIVEN=1 BEFORE the engine is created (as a default,
      so an explicit override still wins), and GameDemoApplication inherits it. Both
      halves then see "1". The C++ member initialiser is false, so the path stays off in
      any process that does not call that function — tools and the dedicated server.

      Stages 5 (multi-view) and 6 (skinned + transparent) are not started. Stage 6 is
      where RSYS-SKIN-BAKE is meant to be re-enabled; the bake is deliberately off
      until then because standalone it is pure overhead.

      Audit note: the C++ and Rust gates disagreed on parsing. Rust enables on any
      value that is not "0"; C++ required exactly "1", despite a comment asserting they
      mirrored exactly. WGR_GPU_DRIVEN=true therefore enabled the Rust path and left
      C++ off, silently inert with an "enabled" log line. Fixed by matching the parse;
      the differing DEFAULT is intentional and was left alone.
    production_call_sites:
      - file: engine/WgpuRenderer/rust/src/gfx3d/cull.rs
        symbol: fn frustum_planes
      - file: engine/WgpuRenderer/rust/src/gfx3d/cull.wgsl
        symbol: workgroup_size

  - id: RSYS-PROC-SKY
    title: Procedural sky and atmosphere
    plan: engine/WgpuRenderer/docs/procedural-sky-plan.md
    status: PARTIAL
    owner: null
    audited: 2026-08-14
    completeness: >-
      Considerably further than "stages 0 and 1 landed" (the RND-030 summary) and
      further than the plan's own "Stage 2 in progress".

      2026-09-09: paired primary-density sampling was measured and rejected
      (about 0.43 ms extra march cost, no convincing grain benefit). Native
      rendering also retains grain. The engine history mask goes to a reserved
      SDK input; do not claim its GPU readback proves current DLSS consumption.
      Cloud motion vectors and motion-trailing acceptance remain open. See
      decisions/CLOUD-GRAIN-EXPERIMENT-20260909.md.

      Stages 0 and 1 (plumbing, clear-sky single scattering, sun disc) — done.
      Stage 2 (Hillaire LUT model) — present, not merely in progress: LUT machinery
      appears throughout sky/mod.rs and sky.wgsl. Stage 4 (aerial perspective
      unified with fog) — done, and it is the live fog path: fog is applied
      per-fragment in the forward shaders by sampling the aerial-perspective froxel
      volume, filled per frame from the sky LUTs. Stage 5 (clouds) — a cloud
      raymarch plus a separate over-scene cloud_composite.wgsl exist.

      Stage 3 (night sky) — STARS DONE 2026-08-05, moon still not. A procedural star
      field on a cube grid (spherical coordinates bunch stars at the poles) is added
      before the cloud composite and gated to night by sun altitude, with a brightness
      slider in the Sky tab. It wheels with the sun's azimuth, which is the celestial
      clock this UBO can supply; there is deliberately no twinkle, because that needs a
      per-frame clock the sky UBO does not carry.

      Owner-confirmed working 2026-08-05. TWO GAPS FOUND BY THAT TEST, both open:
      clouds do NOT occlude the stars even though they are composited afterwards — the
      ordering argument was mine and it is wrong, so it needs re-testing rather than
      re-asserting — and real constellations would need a star catalogue (Yale BSC or
      similar), which is a data job rather than a shader one.

      CORRECTED 2026-08-14. The paragraph here previously read "nothing in sky.wgsl
      renders a moon disc, and there are no stars", which contradicted this same
      scalar's own "STARS DONE 2026-08-05" four paragraphs above and was stale on
      both counts. `star_field` is at sky.wgsl:641 and `moon_disc` at sky.wgsl:1211.
      The moon landed in cc8a219 and is verified BY CAPTURE, not by reading: hour 3
      on Sahrani reports draw=YES at an angular radius of 0.256 degrees against a
      true 0.26, drawn as a Lommel-Seeliger sphere with real sub-solar direction and
      earthshine, on a Meeus/Schlyter ephemeris agreeing with an independent
      implementation to 0.001 in phase.

      Moonlight is also a real directional light, measured 2026-08-14 as a controlled
      pair on one camera with byte-identical moon geometry: ground and buildings mean
      luminance 0.0262 with moonlight on against 0.0108 off (2.42x), centre-ground
      0.0175 against 0.0002 (109x), and the engine's own skySun readout exactly zero
      with it off -- so at night the entire directional radiance of the scene is the
      moon. Under an occluder the ground is pure black without it.

      Two gaps remain and neither is a rendering defect. It is calibrated about two
      orders of magnitude too dim to read: moonIntensity 0.06 times a phase function
      giving 0.09 at quarter times a ~0.48 cloud dim at the default 0.50 cover puts
      the lit ground at roughly 1/255, below the 8-bit floor. That is a look decision
      and is the owner's. And moonlight casts NO shadow: the cascades are built from
      the moon-swung ShadowDirection, but Scene.cpp:798-802 multiplies the shadow
      factor by (1 - NightEffect()), which is zero at full night -- wired up and then
      multiplied away.

      One caution for anyone re-checking this. The moon disc was invisible in the
      owner's deployed build for reasons entirely outside the sky code: a stale
      PoseidonGame.exe beside a newer wgpu_renderer.dll, across a WgrSkyRuntime that
      had grown 80 -> 112 bytes without an ABI bump. See CORE-NEG-003. Verify the
      binary pair before concluding anything about this system.
    production_call_sites:
      - file: engine/WgpuRenderer/rust/src/sky/mod.rs
        symbol: pub fn render

