  - id: RSYS-CIRRUS
    title: High cirrus cloud deck (second cloud layer)
    plan:  # NONE — no cirrus plan document exists; procedural-sky-plan.md never mentions it (checked 2026-08-14)
    status: SHIPPED
    owner: null
    audited: 2026-08-14
    completeness: >-
      NO PLAN DOCUMENT EXISTS, and specifically it is NOT covered by
      procedural-sky-plan.md — that plan's Stage 5 is the cumulus deck, and the
      string "cirrus" does not occur in it at all. So this is a second, separate
      cloud layer with no plan of its own, and SHIPPED is the "the system exists
      and is complete against its own contract" claim, not "a plan landed".
      Registered separately from RSYS-PROC-SKY for exactly the reason this file
      exists: it is a distinct system that would otherwise be invisible under
      another name.

      A high layer centred at CIRRUS_ALT = 7,000 m ASL, well clear of the cumulus
      deck, in three modes: 0 off, 1 flat sheet (one ray/sphere intersection, one
      field evaluation), 2 volumetric thin-shell march (CIRRUS_STEPS = 6 through a
      500–1,400 m shell that thickens with puffiness). DEFAULT IS 2, the
      volumetric one, on both sides of the FFI — Engine::SkySettings has
      cirrusEnabled = true and cirrusVolumetric = true, and the Rust
      cirrus_mode_from_env default is 2. WGR_CIRRUS overrides it, for the same
      reason WGR_GODRAYS exists: an A/B capture runs --no-dev.

      PUFFINESS is a SHAPE control, not a brightness control, added in 9238f3e:
      one authored slider (cirrusPuffiness, default 0.5; cirrusPuffVariation,
      default 0.15) driving five correlated constants through cirrus_mix3 — aspect
      ratio, fine-octave weight, erosion, optical density and shell thickness —
      from cirrus fibratus at 0 (7.7:1 wind-sheared streaks) through the shipped
      look at 0.5 (4:1, ~7 km across and ~28 km long) to cellular lumps at 1. The
      middle knot IS the previously hard-coded constant, so 0.5 is a no-op against
      the old look — deliberately, so the control could ship without changing the
      default appearance. It varies slowly on the sim clock through a drift-driven
      signal wrapped at 100 km; WGR_CIRRUS_PUFF=<puff>[,<var>[,<phase>]] pins it,
      the phase field existing because the variation rides the sim clock and a
      capture needs it reproducible. Both entry points cross the FFI as their own
      functions (wgr_set_cirrus_mode, wgr_set_cirrus_puffiness) rather than as
      WgrSkyLook lanes, because that struct's size is part of the ABI handshake —
      see CORE-NEG-003 for what happens when that rule is broken.

      Also recorded: the layer's two noise periods were once rationally related
      and made it repeat visibly (cebc50c); the sheet frequency is now
      1/7,000 m after 1/26,000 produced a single blob filling the sky, with a
      ~64 km domain warp on top.

      NOT CHECKED. Nothing was run and no frame was looked at, so no claim here is
      a visual verification. Cost is unmeasured in both modes — gpu_timers.rs has
      no cirrus or sky region, so the volumetric default's six-step march has no
      number on any configuration and the flat-vs-volumetric price that WGR_CIRRUS
      was built to answer has not actually been asked. The grazing-path clamp
      (thickness / CIRRUS_PATH_SIN_MIN, and CIRRUS_STEPS does not grow with
      thickness) means the worst case is at puffiness 1, which is where any
      measurement should start.
    production_call_sites:
      - file: engine/WgpuRenderer/rust/src/sky/mod.rs
        symbol: cirrus_puff_target
      - file: engine/WgpuRenderer/rust/src/sky/sky.wgsl
        symbol: fn cirrus_shape
      - file: engine/WgpuRenderer/rust/src/ffi.rs
        symbol: wgr_set_cirrus_puffiness
      - file: engine/Poseidon/Graphics/Core/Engine.hpp
        symbol: cirrusPuffiness
      - file: engine/WgpuRenderer/EngineWgpu.hpp
        symbol: SetSkyCirrus


