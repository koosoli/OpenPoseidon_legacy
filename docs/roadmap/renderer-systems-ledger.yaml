  - id: RSYS-SKIN-BAKE
    title: Compute skinning bake
    plan: engine/WgpuRenderer/docs/compute-skin-bake-plan.md
    status: SHIPPED_DISABLED
    owner: null
    audited: 2026-08-03
    completeness: >-
      Accurate as recorded. skin_bake_enabled defaults false; WGR_SKIN_BAKE=1 enables.
      Phase 1 is implemented and validated, and there is deliberately NO standalone
      Phase 2 — the plan folds its draw coalescing into the GPU-driven indirect path
      rather than building it twice, so this system's payoff is blocked on
      RSYS-GPU-CULL stage 6. Off by default because standalone it is pure overhead:
      vertex-shader skinning is ~free for OFP's low-poly characters, and shadow and
      prepass times were measured identical with the bake on and off.
    production_call_sites:
      - file: engine/WgpuRenderer/rust/src/gfx3d/mod.rs
