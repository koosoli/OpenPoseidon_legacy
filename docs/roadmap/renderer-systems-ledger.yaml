  - id: RSYS-WATER-RENDER
    title: Water surface rendering
    plan: engine/WgpuRenderer/docs/water-rendering-plan.md
    status: PARTIAL
    owner: null
    audited: 2026-08-06
    completeness: >-
      Plan is REVISED with stage 1 landed, and was the most recently maintained of the
      renderer plans. The surface itself — FFT cascades, shoaling, foam, interaction,
      planar reflection and SSR — is live and is the default look.

      2026-09-08 Nogova follow-up: reversed-Z cancellation and fixed-point scene depth
      produced long horizontal shoreline bands at altitude. Float depth is now requested
      when supported; the 8 km installed-game capture removes those bands. Open-ocean
      seams remained at that checkpoint. See decisions/NOGOVA-VISUAL-20260908.md; this is author
      smoke evidence, not owner acceptance of every water artifact.

      2026-09-09: offshore ocean now continues beyond the fixed water root using
      lazy aligned CDLOD selection, without another FFT or terrain allocation.
      Installed d243cae4 removes the straight offshore boundary and passes the
      negative-corner downward capture. Seven-sample coastal/aerial comparisons
      show about 0.15 ms additional water GPU time, not a universal benchmark.
      Terrain remains finite; other water artifacts are not declared solved.
      See decisions/OCEAN-CONTINUATION-20260909.md.

      2026-09-08 follow-up adds wind-oriented high-wave foam coverage and caps
      wave-only horizontal drag for small planing boats. Installed BoatW A/B
      retained buoyancy and improved speed under swell. Foam appearance, infantry
      water shadows remain open. Dead infantry surface support is implemented and
      captured in calm/high-wave Nogova fixtures; exact rendered crest alignment
      remains open; the owner confirms campaign boarding was a false report
      (decisions/INFANTRY-WATER-20260908.md).
      Direct-sun normal-variance filtering reduces hard glitter in the installed
      61d0febc aerial comparison without extra texture fetches or FFT work.
      Short GPU measurements show no obvious cost jump, not a proven speedup.
      Cloud reconstruction/history masking, visual acceptance gaps and the
      Waterline reference assessment are recorded in
      decisions/WATER-CLOUD-FILTERING-20260908.md.
      Bullet/ripple calm patches: interaction normals now add height gradients to
      the ocean normal instead of replacing up to 95 percent of it based on
      residual height. Zero ripple slope preserves FFT/shore waves, with no added
      samples or passes. All 17 water unit/composition tests and the game build
      pass; installed runtime evidence is in decisions/WATER-RIPPLE-20260908.md.
      Physics-owned dev objects now have mass/volume buoyancy, stable drag,
      entry spray/ripple events and surface wakes. All 41 physics tests pass;
      installed 169059df confirms light bodies afloat, heavy bodies on the bed
      and clean process exit after correcting late probe GPU resource release.
      approximation limits and installed evidence are recorded in
      decisions/PHYSICS-PROBE-WATER-20260908.md.
      Rotor/smoke/lamp changes and
      measured evidence are in decisions/ROTOR-SMOKE-WATER-20260908.md.

      PLANAR REFLECTION EDGE, open as of 2026-08-06. Looking DOWN at water leaves a
      visible boundary where the cloud reflection stops. Three attempts, each fixing a
      real thing and none fixing this: the reflected camera was inheriting the screen's
      exact field of view (padded, default 1.35x, right for grazing views); the handover
      to the sky reflection ran over 3% of the target (widened, then reworked); and the
      fade was measuring the wrong distance — it discarded reflection over water the
      target covers, so it now measures the OVERSHOOT and dissolves outward through the
      mip chain instead. The boundary is reduced but still visible, and the owner has
      parked it. Whoever picks it up should first settle whether what remains is the
      planar cutoff or plain Fresnel, which debug view 23 answers directly; do not
      assume it is the fade again.

      PLAYER RIPPLES work. A 2026-08-05 report that they had stopped was a STALE DEPLOY,
      not a defect: the running binaries did not match the build, and content-checking
      them is what settled it. Owner's remaining note is that they could be stronger.
      Water-tab ripple diagnostics (player depth, events submitted, events drained) were
      added while chasing it and are worth keeping.

      The underwater compositor is OFF by default (WaterSettings::underwaterEffect,
      2026-08-03): the look was not good enough to ship on. The pass and its per-pixel
      wavy waterline exist and are opt-in from the Water tab, along with six tuning
      controls. See WTR-190, which is parked rather than closed.
    production_call_sites:
      - file: engine/WgpuRenderer/rust/src/water/mod.rs
        symbol: pub fn draw
      - file: engine/WgpuRenderer/rust/src/water/water.wgsl
        symbol: fn fft_geometry_disp

