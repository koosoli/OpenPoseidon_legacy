      the GPU-driven path was inert. See RSYS-GPU-CULL.

      It is still worth knowing this stage rides the GPU-driven path: any process that
      does not set WGR_GPU_DRIVEN — tools, the dedicated server, or a harness run of a
      binary that skips ConfigureWgpuUltraEnvironment — shades foliage without it.
    production_call_sites:
