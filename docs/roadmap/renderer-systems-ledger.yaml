      Modern WRP placements remain compact by land cell and a camera-centred
      working set creates at most 20,000 Objects in 128-object update batches.
      WGPU model registration captures per-model texture and dedicated mesh
      ownership; first/last live instance pins/releases it. Unshared object
      textures evict at last use, a last-used-frame LRU enforces the dynamic
