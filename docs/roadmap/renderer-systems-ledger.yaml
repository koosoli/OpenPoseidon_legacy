    owner: null
    audited: 2026-08-05
    completeness: >-
      Both stages exist and both are default ON as of 2026-08-05: per-frame directional
      depth maps (Stage 1) and per-model baked sky-visibility volumes storing a scalar
      and an incoming-sky DIRECTION per voxel (Stage 2). They compose rather than
      compete — the per-frame maps cover what a per-model volume structurally cannot see
      (terrain under a building, one object roofing another, movers indoors).

