  - id: RSYS-GTAO
    title: Screen-space ambient occlusion (GTAO)
    plan: engine/WgpuRenderer/docs/screen-space-ao-plan.md
    status: PARTIAL
    owner: null
    audited: 2026-08-05
    completeness: >-
      Scalar AO, bent-normal directional ambient, and a hierarchical depth-mip march,
      default ON as of 2026-08-05 on the owner's instruction. Complete against its plan;
      PARTIAL is about its cost, which is not under control at the Tier 1 configuration.

      The recorded figure — ao_total 0.518 ms of a 6.857 ms frame, "~8% of the GPU frame"
      — was measured at 800x600. Re-measured 2026-08-05 in the original training mission
      at the Tier 1 resolution of 3441x1440: ao_prep 0.299 / ao_march 6.335 / ao_blur
      1.089 = 7.723 ms of a 24.178 ms GPU frame, so **31.9%**, and the horizon march
      alone is the largest single item in the frame by more than five times the next one.

      Pixel count explains most of it and not all: the area ratio is 10.3x and the march
      grew 23x. So this is not simply "the old number at a bigger resolution", and the
      8% figure should not be quoted for any real configuration. slices x steps remains
      the knob, and it now has a reason to be turned.
    known_gap: >-
      Cost at Tier 1 resolution is ~32% of the GPU frame, against a headline figure of 8%
      measured in an 800x600 window. Needs a quality/cost decision, not a re-measurement.
    production_call_sites:
      - file: engine/WgpuRenderer/include/wgpu_renderer.hpp
        symbol: WgrGtao
      - file: engine/WgpuRenderer/rust/src/gfx3d/mod.rs
        symbol: GtaoSettings
      - file: engine/WgpuRenderer/rust/src/gfx3d/gtao_depth_mips.rs
        symbol: gtao

  - id: RSYS-INTERIOR-SKY
    title: Geometry-aware interior sky visibility
    plan: engine/WgpuRenderer/docs/interior-sky-visibility-plan.md
    status: PARTIAL
    owner: null
    audited: 2026-08-05
    completeness: >-
      Both stages exist and both are default ON as of 2026-08-05: per-frame directional
      depth maps (Stage 1) and per-model baked sky-visibility volumes storing a scalar
      and an incoming-sky DIRECTION per voxel (Stage 2). They compose rather than
      compete — the per-frame maps cover what a per-model volume structurally cannot see
      (terrain under a building, one object roofing another, movers indoors).

      PARTIAL for two reasons, and the second is the one that matters for a release.

      First, it has not been re-judged. The owner's "patches of strange shadows" verdict
      was recorded against the per-frame-only version; the cause was later isolated to
      directional steering quantising across five sampled directions and fixed by baking
      the direction, but nobody has looked at the result in a real building since.

      Second, section 3d of the plan is absent from the code: no content-hashed disk
      cache, no background scheduling with a reach = 1 fallback, and no model-variance
      policy (animated doors, damaged models, alpha-tested glass, proxies, visual LODs,
      mirrored or negatively scaled instances — a model-space volume is orientation-free
      but is NOT mirror-free). sky_bake.rs is deliberately pure and synchronous and the
      layer that was to sit above it was never written.

      **The load-stall estimate was wrong, and measuring it corrected it downward.** The
      plan's "~500 models is ~10 s" was repeated as though it described this build; it
      does not. The bake runs once per REGISTERED model, meaning models a mission
      actually loads, not the library. Measured 2026-08-05 in the original training
      mission: **8 models, ~0.29 s total**. The per-model arithmetic was right; what was
      never checked is how many models a mission registers.

      So the cache and background scheduling are still required — a large mission on a
      full island registers far more than eight, and that number is unmeasured — but this
      is no longer a reason to hold a release. Per-frame cost is small and measured:
      cull 0.408 + depth maps 0.163 = 0.570 ms, 2.4% of a 24.178 ms frame.
    known_gap: >-
      Section 3d absent (disk cache, background scheduling, model-variance policy). Load
      cost scales with distinct models registered per mission; measured at 8 models /
      ~0.29 s, unmeasured for large missions. Result not re-judged by the owner.
    production_call_sites:
      - file: engine/WgpuRenderer/include/wgpu_renderer.hpp
        symbol: WgrSkyVis
      - file: engine/WgpuRenderer/rust/src/gfx3d/sky_vis.rs
        symbol: SkyVisSettings
      - file: engine/WgpuRenderer/rust/src/gfx3d/sky_bake.rs
        symbol: SkyBake

  - id: RSYS-GRASS
    title: GPU-placed three-ring grass field
    plan: engine/WgpuRenderer/docs/grass-plan.md
    status: PARTIAL
    owner: null
    audited: 2026-08-05
    completeness: >-
      Ships and is on by default. Three compute-placed LOD rings — near (512² candidates,
      a clump-renderer toggle selects either legacy six-ribbon geometry or twelve-blade
      alpha-tested photographed A3-style cards with four stable families; near is the only
      ring that casts shadows), mid (384², procedural or photographed crossed cards), and
      far (384² terrain-conforming coverage quads to 172 m). Wind, tracks, interactor and
      helicopter downwash all drive placement; extending the far radius changes only the
      far placement pass, not the near/mid grids.
      Measured 2026-08-05 in the reference mission at 3441x1440: prepass 0.970 + colour
      1.053 + shadow 0.156 = 2.179 ms of a 24.178 ms frame, 9.0%, at 48 647 near and
      14 165 mid instances.

      Surface detail has two paths: a procedurally generated 8-layer 64x256 array built on
      the CPU at init, and authored images loaded from disk when present, with a silent
      deliberate fallback either way. Missing or corrupt images cannot prevent startup.

      PARTIAL for provenance, not for rendering. See known_gap; the rendering half of
      GRS-GATE-1 is done and the asset half has not started.

      A local-only A3 `tmp\\a3-grasstall.png` smoke on 2026-08-10 built and deployed the
      game and renderer DLL, then captured the green photographed clumps through the WGPU
      renderer. Near photo clumps now alpha-test into and receive the cascade map, giving
      clump-to-clump shadowing. The selected test framing does not expose enough bare terrain
      to accept the final ground-shadow/far-172m quality gate; those remain live-game checks.
    known_gap: >-
      GRS-GATE-1 unpassed: assets/ is gitignored, so the authored texture path is dead on
      any fresh clone and every user gets the procedural look. No ASSET-010 source
      registry, no licence record for any current image, no deterministic processing
      recipe, no validated optional package.
    production_call_sites:
      - file: engine/WgpuRenderer/rust/src/grass/mod.rs
        symbol: GrassStats
      - file: engine/WgpuRenderer/rust/src/grass/blade_atlas.rs
        symbol: LAYER_W
      - file: engine/WgpuRenderer/TerrainWgpu.cpp
        symbol: UploadGrassBladeAtlas
      - file: engine/WgpuRenderer/include/wgpu_renderer.hpp
        symbol: WgrGrassParams

unbuilt_candidates: >-
  Verified by RND-030 as having no implementation, and therefore the correct starting
  points for new renderer work: forward-plus, gpu-terrain-water-cull,
  terrain-fractal-detail. Do not start from the systems above without checking this
  register first — that is what it is for.

  screen-space-ao was on this list and has been removed: it shipped on 2026-08-05 and is
  registered above as RSYS-GTAO. A stale "unbuilt" entry is worse than a stale "shipped"
  one — it invites someone to build a system twice.
