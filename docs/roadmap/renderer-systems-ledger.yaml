  - id: RSYS-GTAO
    title: Screen-space ambient occlusion (GTAO)
    plan: engine/WgpuRenderer/docs/screen-space-ao-plan.md
    status: PARTIAL
    owner: null
    audited: 2026-08-05
    completeness: >-
      Scalar AO, bent-normal directional ambient, and a hierarchical depth-mip march,
      default ON as of 2026-08-05 on the owner's instruction. Complete against its plan;
      PARTIAL is about its cost, which is not under control at the Tier 1 configuration.

      The recorded figure — ao_total 0.518 ms of a 6.857 ms frame, "~8% of the GPU frame"
      — was measured at 800x600. Re-measured 2026-08-05 in the original training mission
      at the Tier 1 resolution of 3441x1440: ao_prep 0.299 / ao_march 6.335 / ao_blur
      1.089 = 7.723 ms of a 24.178 ms GPU frame, so **31.9%**, and the horizon march
      alone is the largest single item in the frame by more than five times the next one.

      Pixel count explains most of it and not all: the area ratio is 10.3x and the march
      grew 23x. So this is not simply "the old number at a bigger resolution", and the
      8% figure should not be quoted for any real configuration. slices x steps remains
      the knob, and it now has a reason to be turned.
    known_gap: >-
      Cost at Tier 1 resolution is ~32% of the GPU frame, against a headline figure of 8%
      measured in an 800x600 window. RESOLVED 2026-08-13: the quality/cost decision this
      called for was taken -- GTAO renders at half resolution by default (gtao_scale
      default 2, 6f54385). The remaining gap is that the saving has not been measured on
      a quiet machine. The one interleaved measurement predating the change put
      WGR_ABLATE=ao at -2.99 ms against a 34.36 ms base at 1080p, so about 9% of the
      frame, and the half-res default should recover part of that. Do not quote an
      absolute here until it is re-measured interleaved: a degraded machine on this
      project has produced consistently slow numbers with tight spread more than once.
