# Section 1 below is a bare YAML sequence, indented to sit under `systems:` —
# paste it in as-is. Section 2 is the known_gap proposal set, as comments.
#
# VALIDATOR NOTE ON `plan:` (read before editing the three no-plan entries).
# scripts/validate_renderer_ledger.py:107 matches `^    plan: (\S+)` and feeds
# whatever it captures to `git ls-files --error-unmatch`. There is therefore NO
# legal way to write a prose "no plan exists" value: `null`, `"none"`, a quoted
# sentence and a `>-` block scalar all capture a first token that git cannot
# resolve, and each fails the whole ledger. The regex does not fire when the
# value is empty or when two spaces separate `plan:` from a `#` comment, and the
# `    plan:` required-field check still passes. So the three plan-less systems
# are written as `plan:  # NONE — ...`, and the same fact is restated inside
# `completeness`, which is where it can actually be read. If you would rather
# the ledger carry this in the value, the validator needs a sentinel (e.g. skip
# the tracked check when the value is exactly `none`) — that is a change to the
# script, not to this fragment.
