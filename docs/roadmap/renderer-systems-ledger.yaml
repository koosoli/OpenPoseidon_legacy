      First, it has not been re-judged. The owner's "patches of strange shadows" verdict
      was recorded against the per-frame-only version; the cause was later isolated to
      directional steering quantising across five sampled directions and fixed by baking
      the direction, but nobody has looked at the result in a real building since.

      Second, section 3d of the plan is absent from the code: no content-hashed disk
      cache, no background scheduling with a reach = 1 fallback, and no model-variance
      policy (animated doors, damaged models, alpha-tested glass, proxies, visual LODs,
      mirrored or negatively scaled instances — a model-space volume is orientation-free
      but is NOT mirror-free). sky_bake.rs is deliberately pure and synchronous and the
      layer that was to sit above it was never written.

