roadmap:
  version: "4.5.3"
  path: docs/roadmap/modernisation/PoseidonWGPU_Modernisation_Roadmap_v4.5.3.md
  sha256: 3a77d2af7aa17e68534b8f917dd73fb95af82bc68d49d1e932d7c312647502ac
