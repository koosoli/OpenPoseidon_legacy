# SUPERSET, not the default EXACT: this overlay deliberately seeds umbrella
# records (AST-010/011/012), P1 holds and one follow-on candidate that it does
# NOT authorise for claiming, so its scoped ledger set is wider than
# authorised_tickets by design.
ledger_ticket_set_policy: SUPERSET

ledger:
  path: docs/roadmap/status-ledger.yaml
  # The ledger is shared with PREVIEW0-EXEC-001 and validated per overlay: every
  # record names its owning overlay_id and `validate_compat_c1_ledger.py` reads
  # only the COMPAT-C1 subset. An earlier revision asked for the seed to be
  # merged into this file AND for `validate_preview0_ledger.py` to keep passing,
  # which was impossible -- that validator asserted the whole file equalled the
  # Preview-0 ticket set, so the merge in bootstrap step 8 destroyed the gate in
  # step 3. WIP limits are the reason it stays one file: they are scoped to the
  # integration target, so two ledgers could not enforce them.
  scope_field: overlay
  seed_patch_path: docs/roadmap/modernisation/PoseidonWGPU_Status_Ledger_CompatC1_Seed_v4.5.3.yaml
  seed_merge_tool: scripts/merge_ledger_seed.py
  validator: scripts/validate_compat_c1_ledger.py
  create_if_missing: false
  authoritative_for:
    - owner
    - branch
    - baseline_commit
    - verification_commit
    - dependencies
    - blocked_by
    - scheduling_state
    - lifecycle_status
    - milestone_role
    - evidence

execution:
  current_preview: COMPATIBILITY_PREVIEW_C1
  integration_target: new-renderer-infrastructure
  baseline_commit: 34c44ac5e4894593b18ea1b47024745d386c5918
  baseline_semantics: PRE_ACTIVATION_CODE_BASELINE
  integration_owner: Oliver Kay
  authorization_policy: DENY_UNLESS_LISTED
  activation_state: ACTIVE
  updated_at: "2026-08-08T12:00:00+02:00"

bootstrap_policy:
  implementation_forbidden_until_resolved: false
  resolve_baseline_from_checkout: true
  baseline_command: git rev-parse HEAD
  required_actions:
    - Confirm `docs/roadmap/modernisation/PoseidonWGPU_Execution_Overlay_Preview0_v1.2.1.yaml` exists at its canonical tracked path.
    - If that canonical Preview-0 overlay is missing only because of a working-tree move/delete, restore it from the current baseline/HEAD before doing anything else; do not use an untracked `old/` copy as a substitute.
    - Run `docs/roadmap/modernisation/PoseidonWGPU_CompatC1_Preflight_v4.5.3.ps1` and require PASS before activating COMPAT-C1.
    - Preserve the active Preview-0 overlay as historical execution evidence; do not overwrite it.
    - Confirm the v4.5.3 roadmap file and sha256 match this overlay.
    - Resolve execution.baseline_commit from the actual checked-out integration target.
    - Record roadmap.repository_commit after the roadmap is committed.
    - Merge missing COMPAT-C1 seed records into the shared ledger with
      `scripts/merge_ledger_seed.py --overlay COMPAT-C1-EXEC-001`, which is additive by
      ticket ID and cannot overwrite a live record.
    - Resolve seed baseline_commit fields from execution.baseline_commit.
    - Require `scripts/validate_preview0_ledger.py` to STILL pass after the merge. It
      validates only the PREVIEW0-EXEC-001 subset, so adding COMPAT-C1 records must not
      disturb it; if it fails, the merge touched Preview-0 state and must be reverted.
    - Confirm every authorised/candidate/held ticket exists in the canonical roadmap.
    - Confirm only AST-007 is initially OPEN for this compatibility activation; the remaining P0 tickets begin BLOCKED.
    - Confirm live ACTIVE records satisfy WIP limits before adding a claim.
    - Set template=false, activation_state=ACTIVE, and implementation_forbidden_until_resolved=false atomically in one reviewed commit.
  failure_policy: STOP_WITH_DIAGNOSTIC

# Which route a completed ticket may use to close.
#
# Preview-0 had exactly one: a named human reviewer. Oliver Kay is the only human
# on the project, so for work with no runtime or visual surface that gate blocks on
# a review that cannot meaningfully happen -- there is nothing to look at, and the
# queue stalls while no scrutiny is added. AST-007 and AST-011A both hit this: a
# corpus indexer and a format dispatch, neither observable in a running game.
#
# The rule is therefore about the work, not about who is writing the record:
# if the owner can SEE or PLAY the result, only they can sign it off.
review_policy:
  owner_review_required_classes: [LOCAL_COSMETIC, WORLD_VISUAL, GAMEPLAY]
  automated_evidence_allowed_classes: [OFFLINE_TOOL, RUNTIME_INFRA, BUILD_INFRA]
  automated_evidence_requires:
    - named test_ids that actually run in CI or a local suite
    - a reviewer_method recording what was machine-checked
    - an explicit statement of what the automated evidence does NOT cover
    - reviewer left null; this route never implies a human looked at it
  note: >-
    AUTOMATED_EVIDENCE is not a quieter way to claim a review. The ledger's rule
    against asserting scrutiny that did not happen is unchanged: this route records
    that no human reviewed the ticket and names what did, so a reader can still
    tell the two apart. A RUNTIME_INFRA change that becomes visible in the
    renderer moves to OWNER_REVIEW regardless of its class.

wip_limits:
  scope: INTEGRATION_TARGET
  active_large_tickets_max: 2
  active_small_tickets_max: 3
  active_cross_system_tickets_max: 2
  count_only_state: ACTIVE
  size_values: [SMALL, LARGE]

# These are the C1 P0 exit blockers for this overlay.
# They are authorised up front so the overlay does not need a rewrite after every small step,
# but all except AST-007 start BLOCKED and can only become claimable when their real
# dependencies/evidence are satisfied in the live ledger.
preview_blockers:
