unregistered_local_assets: >-
  assets/grass/*.png and assets/generated/*.png predate this registry. Their origin
  is recalled as a public-domain aggregator search but cannot be verified: they are
  untracked, carry no PNG text metadata, and no processing script or note records
  which asset produced them. They are therefore treated as LOCAL SCRATCH -- usable
  on the machine they sit on, never shippable, and never to be registered on the
  strength of a recollection. The registered source above replaces them.

derived:
  - id: grass-near-blade-layers
    from_source: pbrpx-grass-species-4k
    recipe: scripts/build_grass_blade_atlas.py
    recipe_version: 5
    output_dir: assets/grass
    consumed_by: >-
      TerrainWgpu::UploadGrassBladeAtlas, which loads the eight files as an
      opaque 8-layer 64x256 texture array for the near grass ring. Absence of any
      one of them falls the whole set back to the procedural atlas in
      blade_atlas.rs -- the fallback is all-or-nothing by design.
    known_defect: >-
      The source sheets include dense plant/seed-head atlases. The recipe only
      admits isolated opacity components and excludes Imperata because it has no
      usable leaf component under that rule. This is deliberate: no manual image
      cleanup is permitted in a deterministic provenance path.
