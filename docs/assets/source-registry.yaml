schema_version: 1
purpose: >-
  ASSET-010 third-party source registry. Every asset that reaches a build must be
  traceable from a verified original-provider licence to the exact bytes shipped.

  This exists because the grass textures already in use had none of it: untracked
  files, no source URL, no licence record, no metadata, and no recipe that could
  rebuild them. They cannot be registered retroactively -- a recollection of where
  a file came from is not provenance, and writing a guessed URL into this file
  would be worse than leaving it empty, because it would look checked.

licence_rule: >-
  Aggregator licence labels are NOT authoritative. A 3dassets.one or similar search
  result records what the aggregator believes. Every entry here must cite the
  ORIGINAL provider's own statement, at a URL a reader can open.

field_reference:
  id: Stable identifier used by processing recipes and derived-asset records.
  source_url: Where the files were fetched from.
  provider_url: Original provider's site, not an aggregator.
  provider: Provider name.
  author: Author or studio, where stated.
  licence: SPDX-style identifier where one applies.
  licence_url: The provider's own licence statement.
  licence_quote: The provider's wording, so a later licence change is detectable.
  downloaded_utc: Date the archive hashes below were taken.
  product_name: Provider's own product key. The unambiguous identifier; numeric
    library ids are convenience links only.
  intended_use: What this asset is for in this repo.
  selection: SELECTED, REJECTED or EVALUATING, with a reason. GRS-GATE-1 requires
    exactly one source path chosen AFTER comparing candidates, so rejected
    candidates stay recorded rather than being deleted.
  files: Per-file sha256 and byte length, as fetched, before any processing.

