name: Reforger parity / Windows game build

# Builds only the Windows game (no tests) for MrDudeX-reforger and publishes OpenPoseidon.exe
# with its wgpu_renderer.dll as the rolling pre-release "reforger-ci". The session that tests
# on the owner's PC cannot reach the Actions artifact store, but it can read release assets;
# it fetches them and unpacks them into <CWA>\_OpenPoseidon-Reforger\bin (never into the
# shared Remastered folder). Compiler errors are re-emitted as annotations so they can be read
# through the API.
on:
  workflow_dispatch:
  push:
    branches:
      - MrDudeX-reforger

# Only the newest push is worth a build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write: the build is published as the rolling pre-release "reforger-ci" (last step), the
  # same arrangement as arma3-ci; everything else only reads.
  contents: write

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_NOHASHDIR: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-windows:
    name: Windows game (RelWithDebInfo)
    runs-on: windows-2022
    env:
      CWR_PRESET: win-x64-clang-rwdi
      CWR_BUILD_DIR: build/win-x64-clang-rwdi
      CWR_DIST_DIR: dist/x64-win-rwdi
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build metadata
        id: meta
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Only the game: tools and test programs would double the build time.
      - name: Build
        continue-on-error: true
        uses: ./.github/actions/build-cwr
        with:
          preset: ${{ env.CWR_PRESET }}
          vcpkg-triplet: x64-windows-clang
          build-dir: ${{ env.CWR_BUILD_DIR }}
          run-tests: 'false'
          build-target: PoseidonGame

      - name: Build the game
        shell: bash
        run: cmake --build "$CWR_BUILD_DIR" --target PoseidonGame --parallel 2

      - name: Report compiler errors
        if: failure()
        shell: bash
        run: |
          cmake --build "$CWR_BUILD_DIR" --target PoseidonGame --parallel 2 -- -k 0 > build-errors.txt 2>&1 || true
          grep -E "error( [A-Z]+[0-9]+)?:|error\[|undefined symbol|LNK[0-9]+" build-errors.txt | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          exit 1

      - name: Collect game files
        shell: bash
        run: |
          mkdir -p out
          cp "$CWR_DIST_DIR/OpenPoseidon.exe" out/
          if [ -f "$CWR_DIST_DIR/wgpu_renderer.dll" ]; then cp "$CWR_DIST_DIR/wgpu_renderer.dll" out/; else cp "$CWR_BUILD_DIR/engine/WgpuRenderer/wgpu_renderer.dll" out/; fi
          cp "$CWR_DIST_DIR/OpenAL32.dll" out/ 2>/dev/null || true
          # Debug symbols next to the exe: the crash handler then prints function names and
          # lines instead of bare addresses (the test machine has no toolchain).
          for pdb in OpenPoseidon.pdb wgpu_renderer.pdb; do
            f=$(find "$CWR_DIST_DIR" "$CWR_BUILD_DIR" -name "$pdb" -print -quit 2>/dev/null)
            if [ -n "$f" ]; then cp "$f" out/; fi
          done
          printf 'branch=%s\ncommit=%s\nsource=GitHub Actions %s (%s)\n' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$GITHUB_RUN_ID" "$CWR_PRESET" > out/BUILT-FROM.txt
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: OpenPoseidon-Windows-${{ github.ref_name }}-${{ steps.meta.outputs.sha_short }}
          path: out/*
          if-no-files-found: error

      - name: Publish as the rolling pre-release reforger-ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete reforger-ci -y --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create reforger-ci out/* -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Reforger parity test build ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" \
            --notes "OpenPoseidon.exe + wgpu_renderer.dll (+ pdbs) of ${GITHUB_REF_NAME} at ${GITHUB_SHA}, run ${GITHUB_RUN_ID}. Replaced by every build; not a release."
