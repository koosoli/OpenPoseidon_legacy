name: Reforger parity / Windows game build

# Builds only the Windows game (no tests) for MrDudeX-reforger and publishes OpenPoseidon.exe
# with its wgpu_renderer.dll as the rolling pre-release "reforger-ci". The session that tests
# on the owner's PC cannot reach the Actions artifact store, but it can read release assets;
# it fetches them and unpacks them into <CWA>\_OpenPoseidon-Reforger\bin (never into the
# shared Remastered folder). Compiler errors are re-emitted as annotations so they can be read
# through the API.
on:
  workflow_dispatch:
  push:
    branches:
      - MrDudeX-reforger
      - 'MrDudeX-reforger-**'
    # A harness or docs commit builds nothing -- and must not cancel the build in flight.
    paths-ignore:
      - 'scripts/reforger-pc/**'
      - 'docs/**'

# Only the newest push is worth a build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write: the build is published as the rolling pre-release "reforger-ci" (last step), the
  # same arrangement as arma3-ci; everything else only reads.
  contents: write

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_NOHASHDIR: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The renderer's own unit tests on Linux: they compose and validate every WGSL module with naga
  # (no GPU needed for that part), so a shader error shows up here as an annotation instead of as
  # a panic at the first frame on the test PC. Informational: it never blocks the Windows build.
  renderer-tests:
    name: wgpu_renderer tests (Linux)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      # The *_actual_gpu tests need an adapter: lavapipe (Mesa's software Vulkan) is one.
      - name: Software Vulkan
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 > /dev/null
      - name: Test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The runner's bash is -e -o pipefail: a grep that finds nothing would end the step
          # before the log is published.
          set +e +o pipefail
          cargo test -p wgpu_renderer --lib --no-fail-fast 2>&1 | tee test.txt
          # GitHub keeps 10 annotations per step: one line with the count and the names, and
          # the whole log as a release asset (the testing session cannot read job logs).
          failed=$(grep -E "^test .* FAILED$" test.txt | sed -E 's/^test (.*) \.\.\. FAILED$/\1/' | tr '\n' ' ')
          echo "::warning::$(grep -E '^test result' test.txt | tail -1) | failed: ${failed:-none}"
          grep -E "error(\[E[0-9]+\])?:" test.txt | head -8 | while IFS= read -r line; do echo "::warning::${line//%/%25}"; done
          TAG=reforger-ci-tests
          if [ "$GITHUB_REF_NAME" != "MrDudeX-reforger" ]; then TAG="reforger-ci-tests-${GITHUB_REF_NAME#MrDudeX-reforger-}"; fi
          gh release delete "$TAG" -y --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" test.txt -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Reforger renderer test log ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" --notes "cargo test -p wgpu_renderer --lib, run ${GITHUB_RUN_ID}." || true
          if grep -q "^test result: FAILED\|error\[E" test.txt; then exit 1; fi

  build-windows:
    name: Windows game (RelWithDebInfo)
    runs-on: windows-2022
    env:
      CWR_PRESET: win-x64-clang-rwdi
      CWR_BUILD_DIR: build/win-x64-clang-rwdi
      CWR_DIST_DIR: dist/x64-win-rwdi
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build metadata
        id: meta
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Only the game: tools and test programs would double the build time.
      - name: Build
        continue-on-error: true
        uses: ./.github/actions/build-cwr
        with:
          preset: ${{ env.CWR_PRESET }}
          vcpkg-triplet: x64-windows-clang
          build-dir: ${{ env.CWR_BUILD_DIR }}
          run-tests: 'false'
          build-target: PoseidonGame

      - name: Build the game
        shell: bash
        run: cmake --build "$CWR_BUILD_DIR" --target PoseidonGame --parallel 2

      - name: Report compiler errors
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e +o pipefail
          cmake --build "$CWR_BUILD_DIR" --target PoseidonGame --parallel 2 -- -k 0 > build-errors.txt 2>&1
          grep -E "error( [A-Z]+[0-9]+)?:|error\[|undefined symbol|LNK[0-9]+" build-errors.txt | head -10 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          # All of it as a release asset: annotations stop at 10 per step.
          TAG=reforger-ci-errors
          if [ "$GITHUB_REF_NAME" != "MrDudeX-reforger" ]; then TAG="reforger-ci-errors-${GITHUB_REF_NAME#MrDudeX-reforger-}"; fi
          gh release delete "$TAG" -y --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" build-errors.txt -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Reforger build errors ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" --notes "run ${GITHUB_RUN_ID}" || true
          exit 1

      - name: Collect game files
        shell: bash
        run: |
          mkdir -p out
          cp "$CWR_DIST_DIR/OpenPoseidon.exe" out/
          if [ -f "$CWR_DIST_DIR/wgpu_renderer.dll" ]; then cp "$CWR_DIST_DIR/wgpu_renderer.dll" out/; else cp "$CWR_BUILD_DIR/engine/WgpuRenderer/wgpu_renderer.dll" out/; fi
          cp "$CWR_DIST_DIR/OpenAL32.dll" out/ 2>/dev/null || true
          # Debug symbols next to the exe: the crash handler then prints function names and
          # lines instead of bare addresses (the test machine has no toolchain).
          for pdb in OpenPoseidon.pdb wgpu_renderer.pdb; do
            f=$(find "$CWR_DIST_DIR" "$CWR_BUILD_DIR" -name "$pdb" -print -quit 2>/dev/null)
            if [ -n "$f" ]; then cp "$f" out/; fi
          done
          printf 'branch=%s\ncommit=%s\nsource=GitHub Actions %s (%s)\n' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$GITHUB_RUN_ID" "$CWR_PRESET" > out/BUILT-FROM.txt
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: OpenPoseidon-Windows-${{ github.ref_name }}-${{ steps.meta.outputs.sha_short }}
          path: out/*
          if-no-files-found: error

      - name: Publish as the rolling pre-release reforger-ci[-<feature>]
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # MrDudeX-reforger -> reforger-ci; a feature branch MrDudeX-reforger-<x> -> reforger-ci-<x>.
          TAG=reforger-ci
          if [ "$GITHUB_REF_NAME" != "MrDudeX-reforger" ]; then TAG="reforger-ci-${GITHUB_REF_NAME#MrDudeX-reforger-}"; fi
          gh release delete "$TAG" -y --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" out/* -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Reforger parity test build ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" \
            --notes "OpenPoseidon.exe + wgpu_renderer.dll (+ pdbs) of ${GITHUB_REF_NAME} at ${GITHUB_SHA}, run ${GITHUB_RUN_ID}. Replaced by every build; not a release."
