name: Arma 2 / Windows game build

# Builds only the Windows game (no tests) for a branch, on demand, and uploads
# OpenPoseidon.exe with its wgpu_renderer.dll as one artifact. Used to get a build onto
# a machine without a local toolchain. Compiler errors are re-emitted as annotations so
# they can be read through the API.
on:
  workflow_dispatch:
  push:
    branches:
      - MrDudeX-arma2

# Only the newest push is worth a build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_NOHASHDIR: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-windows:
    name: Windows game (RelWithDebInfo)
    runs-on: windows-2022
    env:
      CWR_PRESET: win-x64-clang-rwdi
      CWR_BUILD_DIR: build/win-x64-clang-rwdi
      CWR_DIST_DIR: dist/x64-win-rwdi
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build metadata
        id: meta
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The full build also compiles test programs; only the game has to succeed.
      - name: Build
        continue-on-error: true
        uses: ./.github/actions/build-cwr
        with:
          preset: ${{ env.CWR_PRESET }}
          vcpkg-triplet: x64-windows-clang
          build-dir: ${{ env.CWR_BUILD_DIR }}
          run-tests: 'false'

      - name: Build the game
        shell: bash
        run: cmake --build "$CWR_BUILD_DIR" --target PoseidonGame --parallel 2

      - name: Report compiler errors
        if: failure()
        shell: bash
        run: |
          cmake --build "$CWR_BUILD_DIR" --target PoseidonGame --parallel 2 -- -k 0 > build-errors.txt 2>&1 || true
          grep -E "error( [A-Z]+[0-9]+)?:|undefined symbol|LNK[0-9]+" build-errors.txt | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          exit 1

      - name: Collect game files
        shell: bash
        run: |
          mkdir -p out
          cp "$CWR_DIST_DIR/OpenPoseidon.exe" out/
          if [ -f "$CWR_DIST_DIR/wgpu_renderer.dll" ]; then cp "$CWR_DIST_DIR/wgpu_renderer.dll" out/; else cp "$CWR_BUILD_DIR/engine/WgpuRenderer/wgpu_renderer.dll" out/; fi
          cp "$CWR_DIST_DIR/OpenAL32.dll" out/ 2>/dev/null || true
          # Debug symbols next to the exe: the crash handler then prints function names
          # and lines instead of bare addresses (the test machine has no toolchain).
          for pdb in OpenPoseidon.pdb wgpu_renderer.pdb; do
            f=$(find "$CWR_DIST_DIR" "$CWR_BUILD_DIR" -name "$pdb" -print -quit 2>/dev/null)
            if [ -n "$f" ]; then cp "$f" out/; fi
          done
          printf 'branch=%s\ncommit=%s\nsource=GitHub Actions %s (%s)\n' "$GITHUB_REF_NAME" "${GITHUB_SHA::7}" "$GITHUB_RUN_ID" "$CWR_PRESET" > out/BUILT-FROM.txt
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: OpenPoseidon-Windows-${{ github.ref_name }}-${{ steps.meta.outputs.sha_short }}
          path: out/*
          if-no-files-found: error
