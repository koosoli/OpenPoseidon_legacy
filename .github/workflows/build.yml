name: C++ / Build

on:
  push:
    branches:
      - new-renderer-infrastructure
  pull_request:
  workflow_dispatch:

# A push supersedes the run before it. The Trident suite is long, so without
# this a burst of commits leaves several full runs competing for the same hosted
# runners and every one of them finishes later -- including the only one whose
# result anybody wants. Superseded runs are cancelled; the newest is the answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_NOHASHDIR: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  DEMO_ASSETS_URL: https://files.ofpisnotdead.com/CWR-demo-assets-v2.zip
  CWR_ARTIFACT_PREFIX: Linux-x64-rwdi
  TRIDENT_RENDER: gl33
  TRIDENT_AUDIO: openal
  TRIDENT_XVFB_ARGS: -screen 0 1920x1080x24

jobs:
  build-linux:
    name: Linux RelWithDebInfo
    runs-on: ubuntu-24.04
    env:
      CWR_PRESET: linux-x64-clang-rwdi
      CWR_VCPKG_TRIPLET: x64-linux-clang
      CWR_BUILD_DIR: build/linux-x64-clang-rwdi
      CWR_CTEST_EXCLUDE: 'PoseidonTests - OAL -'
      CWR_DIST_DIR: dist/x64-linux-rwdi
      CWR_ARTIFACT_PREFIX: Linux-x64-rwdi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        uses: ./.github/actions/build-cwr
        with:
          preset: ${{ env.CWR_PRESET }}
          vcpkg-triplet: ${{ env.CWR_VCPKG_TRIPLET }}
          build-dir: ${{ env.CWR_BUILD_DIR }}
          ctest-exclude: ${{ env.CWR_CTEST_EXCLUDE }}

      - name: Upload Game
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Game-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonGame
            ${{ env.CWR_DIST_DIR }}/libwgpu_renderer.so
          if-no-files-found: error

      - name: Upload GameDemo
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-GameDemo-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonGameDemo
            ${{ env.CWR_DIST_DIR }}/libwgpu_renderer.so
          if-no-files-found: error

      - name: Upload Server
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Server-${{ steps.build_metadata.outputs.sha_short }}
          path: ${{ env.CWR_DIST_DIR }}/PoseidonServer
          if-no-files-found: error

      - name: Upload Tools
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Tools-${{ steps.build_metadata.outputs.sha_short }}
          path: ${{ env.CWR_DIST_DIR }}/PoseidonTools
          if-no-files-found: error

      - name: Upload Studio
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Studio-${{ steps.build_metadata.outputs.sha_short }}
          path: ${{ env.CWR_DIST_DIR }}/PoseidonStudio
          if-no-files-found: error

  build-linux-sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: san
            label: ASan+UBSan
          - sanitizer: tsan
            label: TSan
    name: Linux ${{ matrix.label }}
    runs-on: ubuntu-24.04
    env:
      CWR_PRESET: linux-x64-clang-${{ matrix.sanitizer }}
      CWR_VCPKG_TRIPLET: x64-linux-clang-${{ matrix.sanitizer }}
      CWR_BUILD_DIR: build/linux-x64-clang-${{ matrix.sanitizer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        uses: ./.github/actions/build-cwr
        with:
          preset: ${{ env.CWR_PRESET }}
          vcpkg-triplet: ${{ env.CWR_VCPKG_TRIPLET }}
          build-dir: ${{ env.CWR_BUILD_DIR }}
          run-tests: 'false'
          ccache-max-size: '500M'

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x64
    name: macOS ${{ matrix.arch }} RelWithDebInfo
    runs-on: macos-26
    env:
      CWR_PRESET: macos-${{ matrix.arch }}-clang-rwdi
      CWR_VCPKG_TRIPLET: ${{ matrix.arch }}-macos-clang
      CWR_BUILD_DIR: build/macos-${{ matrix.arch }}-clang-rwdi
      CWR_CTEST_EXCLUDE: 'PoseidonTests - OAL -|PoseidonFoundationTests - potime - Platform consistency|PoseidonFoundationTests - potime - Poseidon - Foundation - getSystemTime timing accuracy|PoseidonFoundationTests - potime - SLEEP_MS macro'
      CWR_DIST_DIR: dist/${{ matrix.arch }}-macos-rwdi
      CWR_ARTIFACT_PREFIX: macOS-${{ matrix.arch }}-rwdi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        uses: ./.github/actions/build-cwr
        with:
          preset: ${{ env.CWR_PRESET }}
          vcpkg-triplet: ${{ env.CWR_VCPKG_TRIPLET }}
          build-dir: ${{ env.CWR_BUILD_DIR }}
          ctest-exclude: ${{ env.CWR_CTEST_EXCLUDE }}

      - name: Upload Game
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Game-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonGame
            ${{ env.CWR_DIST_DIR }}/libopenal.dylib
            ${{ env.CWR_DIST_DIR }}/OpenAL-Soft.LICENSE.txt
          if-no-files-found: error

      - name: Upload GameDemo
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-GameDemo-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonGameDemo
            ${{ env.CWR_DIST_DIR }}/libopenal.dylib
            ${{ env.CWR_DIST_DIR }}/OpenAL-Soft.LICENSE.txt
          if-no-files-found: error

      - name: Upload Server
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Server-${{ steps.build_metadata.outputs.sha_short }}
          path: ${{ env.CWR_DIST_DIR }}/PoseidonServer
          if-no-files-found: error

      - name: Upload Tools
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Tools-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonTools
            ${{ env.CWR_DIST_DIR }}/libopenal.dylib
            ${{ env.CWR_DIST_DIR }}/OpenAL-Soft.LICENSE.txt
          if-no-files-found: error

      - name: Upload Studio
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Studio-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonStudio
            ${{ env.CWR_DIST_DIR }}/libopenal.dylib
            ${{ env.CWR_DIST_DIR }}/OpenAL-Soft.LICENSE.txt
          if-no-files-found: error

  build-windows:
    name: Windows RelWithDebInfo
    runs-on: windows-2022
    env:
      CWR_PRESET: win-x64-clang-rwdi
      CWR_VCPKG_TRIPLET: x64-windows-clang
      CWR_BUILD_DIR: build/win-x64-clang-rwdi
      CWR_CTEST_EXCLUDE: 'PoseidonTests - (OAL -|PAAEncoder -|Image - Save to \.paa|World state file format --|PreviewImage - saveToFile writes|PreviewImageRGB - saveToFile writes)'
      CWR_DIST_DIR: dist/x64-win-rwdi
      CWR_ARTIFACT_PREFIX: Windows-x64-rwdi

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        uses: ./.github/actions/build-cwr
        with:
          preset: ${{ env.CWR_PRESET }}
          vcpkg-triplet: ${{ env.CWR_VCPKG_TRIPLET }}
          build-dir: ${{ env.CWR_BUILD_DIR }}
          ctest-exclude: ${{ env.CWR_CTEST_EXCLUDE }}

      - name: Write Preview-0 WGPU manifest
        run: >
          python scripts/write_preview0_manifest.py
          --exe "${{ env.CWR_DIST_DIR }}/OpenPoseidon.exe"
          --dll "${{ env.CWR_BUILD_DIR }}/engine/WgpuRenderer/wgpu_renderer.dll"
          --cmake-cache "${{ env.CWR_BUILD_DIR }}/CMakeCache.txt"
          --out "${{ env.CWR_BUILD_DIR }}/preview0-manifest.json"

      - name: Upload Game
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Game-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/OpenPoseidon.exe
            ${{ env.CWR_DIST_DIR }}/OpenAL32.dll
            ${{ env.CWR_DIST_DIR }}/OpenAL-Soft.LICENSE.txt
          if-no-files-found: error

      - name: Upload Preview-0 WGPU bundle
        uses: actions/upload-artifact@v7
        with:
          name: Preview0-WGPU-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/OpenPoseidon.exe
            ${{ env.CWR_BUILD_DIR }}/engine/WgpuRenderer/wgpu_renderer.dll
            ${{ env.CWR_BUILD_DIR }}/preview0-manifest.json
            docs/roadmap/evidence
          if-no-files-found: error

      - name: Upload GameDemo
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-GameDemo-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonGameDemo.exe
            ${{ env.CWR_DIST_DIR }}/OpenAL32.dll
            ${{ env.CWR_DIST_DIR }}/OpenAL-Soft.LICENSE.txt
          if-no-files-found: error

      - name: Upload Server
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Server-${{ steps.build_metadata.outputs.sha_short }}
          path: ${{ env.CWR_DIST_DIR }}/PoseidonServer.exe
          if-no-files-found: error

      - name: Upload Tools
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Tools-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonTools.exe
            ${{ env.CWR_DIST_DIR }}/OpenAL32.dll
            ${{ env.CWR_DIST_DIR }}/OpenAL-Soft.LICENSE.txt
          if-no-files-found: error

      - name: Upload Studio
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Studio-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/PoseidonStudio.exe
            ${{ env.CWR_DIST_DIR }}/OpenAL32.dll
            ${{ env.CWR_DIST_DIR }}/OpenAL-Soft.LICENSE.txt
          if-no-files-found: error

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Symbols-${{ steps.build_metadata.outputs.sha_short }}
          path: |
            ${{ env.CWR_DIST_DIR }}/OpenPoseidon.pdb
            ${{ env.CWR_DIST_DIR }}/PoseidonGameDemo.pdb
            ${{ env.CWR_DIST_DIR }}/PoseidonServer.pdb
            ${{ env.CWR_DIST_DIR }}/PoseidonTools.pdb
            ${{ env.CWR_DIST_DIR }}/PoseidonStudio.pdb
          if-no-files-found: error

  trident:
    name: Rust / Trident / ubuntu-24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check clippy
        run: cargo clippy --locked --workspace --all-targets

      - name: Build
        run: cargo build --locked

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload Trident
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Trident-${{ steps.build_metadata.outputs.sha_short }}
          path: target/debug/tri
          if-no-files-found: error

      - name: Upload MasterService
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-MasterService-${{ steps.build_metadata.outputs.sha_short }}
          path: target/debug/papa-bear-master-service
          if-no-files-found: error

      - name: Test
        run: cargo test --locked

  trident-test:
    name: Linux Trident (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # Integration failures must publish diagnostics promptly; an unbounded
    # harness process can otherwise keep the Preview-0 CI gate running for
    # hours without producing a reviewable result.  The bound must still clear
    # the suite's own runtime -- see the Trident step below.
    timeout-minutes: 45
    needs:
      - build-linux
      - trident
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download demo game data
        uses: ./.github/actions/download-extract
        with:
          url: ${{ env.DEMO_ASSETS_URL }}
          path: packages/Demo
          archive-name: CWR-demo-assets-v2.zip

      - name: Install Linux runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libopengl0 \
            libx11-6 \
            libxext6 \
            libxrandr2 \
            libxcursor1 \
            libxi6 \
            libxtst6 \
            libxinerama1 \
            libxkbcommon0 \
            libwayland-client0 \
            libopenal1 \
            alsa-utils \
            mesa-utils \
            openbox \
            pulseaudio-utils \
            x11-utils \
            x11-xserver-utils \
            xvfb \
            xauth

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download Game
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Game-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download GameDemo
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-GameDemo-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download Server
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Server-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download Trident
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Trident-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Download MasterService
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-MasterService-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Write Trident env
        run: |
          chmod +x exe/*
          cp .trident.env.example .trident.env
          sed -i 's|^OFPR_GAME_DIR=.*|OFPR_GAME_DIR=exe|' .trident.env
          sed -i 's|^OFPR_DATA_DIR=.*|OFPR_DATA_DIR=packages/Demo|' .trident.env

      - name: Run Trident tests
        env:
          ALSOFT_DRIVERS: 'null'
          # This said `gl` from the day the WGPU scenarios were written, on the
          # reasoning that wgpu's GL backend is the one that survives Xvfb.  It
          # cannot work, and it was never going to: Renderer::new refuses any
          # adapter without TEXTURE_BINDING_ARRAY (rust/src/lib.rs:982-989), and
          # wgpu-hal's GLES adapter does not mention that feature anywhere
          # (29.0.4, src/gles/adapter.rs) -- it never exposes it on any driver.
          # Nothing depends on the value today because all six WGPU scenarios
          # carry `ci-host-blocked` and are skipped below, so this is not a
          # behaviour change; it is removing a trap for whoever unskips them.
          # `vulkan` is the only candidate that can clear the feature gate on a
          # GPU-free runner, via Mesa's lavapipe ICD -- which the
          # `wgpu-start-probe` job below actually measures.  See
          # docs/roadmap/decisions/REN-GL33-003.
          WGPU_BACKEND: 'vulkan'
          HARNESS_CMD_TIMEOUT_SEC: '180'
          PAPA_BEAR_MASTER_SERVICE: ${{ github.workspace }}/exe/papa-bear-master-service
          TRI_OUTPUT_DIR: ${{ github.workspace }}/trident-output
        run: |
          # The bound exists to stop a hung harness, not to cut the suite short.
          # Two runs were SIGTERMed at exactly their bound with tests still
          # queued -- 91499679288 at 15m, then 30758908654 at 35m -- because 81
          # scenarios run one at a time, each paying a fresh game startup under
          # Xvfb.  Raising the bound a third time only buys another slow run, so
          # the suite now runs in parallel instead.
          #
          # -j2, not -j4, and the reason is measured rather than cautious.
          #
          # Parallelism scales badly here: serial exceeded 2100s, -j4 finished in
          # 1554s. That is ~1.35x for 4x the concurrency, because the cost is
          # game startup against a shared Xvfb display and disk, not CPU. So the
          # extra slots buy little wall time while adding real contention.
          #
          # And the contention has a price. Oversubscribing locally reproduces
          # exactly the failures run 30760957610 hit: HARNESS_PORT spawn
          # timeouts, UI assertions firing before the display settles, and GL
          # errors under many concurrent contexts. None of it is state
          # corruption -- the mods getters read in-process UI state, not shared
          # files -- it is simply tests whose timing budgets were written for a
          # machine that is not fighting three other game instances.
          #
          # -j2 keeps most of the wall-clock win with far less of that. Trident's
          # scheduler handles the rest: `exclusive` tests reserve the whole pool
          # and run alone, multi-instance tests reserve one slot per process.
          timeout --preserve-status --kill-after=30s 35m \
            xvfb-run -a --server-args="$TRIDENT_XVFB_ARGS" \
            bash -c 'openbox & trap "kill $!" EXIT; sleep 1; exec "$@"' bash \
            exe/tri test \
            --output-dir "$TRI_OUTPUT_DIR" \
            --render "$TRIDENT_RENDER" \
            --jobs 2 \
            --shard ${{ matrix.shard }}/4 \
            --retries 2 \
            --skip-tag ci-host-blocked \
            --game-arg --audio \
            --game-arg "$TRIDENT_AUDIO" \
            --game-arg --no-strict \
            tests/integration

      - name: Normalize Trident output permissions
        if: failure()
        run: |
          # The game can create package files with restrictive permissions.  Make
          # the complete failed-run evidence archiveable before publishing it.
          chmod -R a+rX trident-output 2>/dev/null || true

      - name: Print Trident startup diagnostics
        if: failure()
        run: |
          # Logs are numbered per game instance, because a parallel run has
          # several alive at once. Print a bounded number of them: with -j4 and
          # retries a failing run can leave dozens, and dumping all of them
          # buries the failure instead of showing it.
          shopt -s nullglob
          printed=0
          for log in trident-output/game_stderr_*.log trident-output/game_stdout_*.log; do
            [ -s "$log" ] || continue
            echo "--- $log ---"
            sed -n '1,240p' "$log"
            printed=$((printed + 1))
            [ "$printed" -ge 6 ] && { echo "--- (further instance logs omitted; see the uploaded artifact) ---"; break; }
          done
          [ "$printed" -eq 0 ] && echo "(no non-empty game instance logs)"
          exit 0

      - name: Upload Trident output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: trident-output-${{ steps.build_metadata.outputs.sha_short }}-shard${{ matrix.shard }}
          path: trident-output
          if-no-files-found: ignore

  # REN-GL33-001 gate bullet 5 asks for "an explicit WGPU-start assertion" in CI.
  # A hosted runner cannot give one: it has no GPU, and Renderer::new hard-refuses
  # any adapter lacking TEXTURE_BINDING_ARRAY + non-uniform indexing
  # (engine/WgpuRenderer/rust/src/lib.rs:982-989) or VERTEX_WRITABLE_STORAGE
  # (:1015-1018).  wgpu's GL backend never exposes TEXTURE_BINDING_ARRAY at all
  # (wgpu-hal 29.0.4 src/gles/adapter.rs mentions it nowhere), so no software GL
  # path can satisfy it either.  See docs/roadmap/decisions/REN-GL33-003.
  #
  # This job asserts the OTHER half of the same contract, which is hardware-free
  # and is the half that regresses silently: an explicit `--render wgpu` that
  # cannot create WGPU must fail loudly and must never fall through to GL33.
  # WGR_FORCE_INIT_FAIL=1 triggers it at the factory, before any device or window
  # bring-up, so this behaves identically here and on a workstation with a GPU.
  #
  # It does NOT assert that WGPU starts. Do not quote it as if it did.
  wgpu-refusal:
    name: WGPU refusal contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - build-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download demo game data
        uses: ./.github/actions/download-extract
        with:
          url: ${{ env.DEMO_ASSETS_URL }}
          path: packages/Demo
          archive-name: CWR-demo-assets-v2.zip

      - name: Install Linux runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libopengl0 libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 \
            libxtst6 libxinerama1 libxkbcommon0 libwayland-client0 libopenal1 \
            xvfb xauth

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download Game
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Game-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Assert the WGPU no-silent-fallback contract
        env:
          ALSOFT_DRIVERS: 'null'
        run: |
          chmod +x exe/*
          # Xvfb because the control arm runs `--window`; the wgpu arm never
          # reaches window creation, which is the point of forcing at the factory.
          xvfb-run -a --server-args="$TRIDENT_XVFB_ARGS" \
            python3 scripts/check_wgpu_refusal.py \
            --exe exe/PoseidonGame \
            --data-dir packages/Demo \
            --out-dir wgpu-refusal-output

      - name: Upload refusal logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wgpu-refusal-${{ steps.build_metadata.outputs.sha_short }}
          path: wgpu-refusal-output
          if-no-files-found: ignore

  # Informational only -- `continue-on-error`, and it must stay that way until
  # somebody reads a green run of it.  It answers REN-GL33-001's open question R2
  # ("does WGPU start under Xvfb on the hosted CI image?") on every run instead of
  # leaving it a guess.
  #
  # The candidate is lavapipe (Mesa's software Vulkan ICD), NOT the GL backend:
  # GL cannot expose TEXTURE_BINDING_ARRAY, so `WGPU_BACKEND=gl` is a guaranteed
  # refusal.  lavapipe advertises VK_EXT_descriptor_indexing and
  # vertexPipelineStoresAndAtomics, which is exactly what wgpu maps
  # TEXTURE_BINDING_ARRAY / VERTEX_WRITABLE_STORAGE onto
  # (wgpu-hal src/vulkan/adapter.rs:14-20), so it is the only credible GPU-free
  # way to make this bullet real.  Whether it survives the rest of bring-up --
  # shader compilation, surface formats, the frame -- is unknown, and finding out
  # for free on every push is worth more than the guess.
  #
  # If this goes green and stays green, promote it: drop continue-on-error, and
  # gate bullet 5's first half is genuinely satisfied.
  wgpu-start-probe:
    name: WGPU start probe (lavapipe, informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    needs:
      - build-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download demo game data
        uses: ./.github/actions/download-extract
        with:
          url: ${{ env.DEMO_ASSETS_URL }}
          path: packages/Demo
          archive-name: CWR-demo-assets-v2.zip

      - name: Install Linux runtime packages and a software Vulkan ICD
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libopengl0 libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 \
            libxtst6 libxinerama1 libxkbcommon0 libwayland-client0 libopenal1 \
            xvfb xauth mesa-vulkan-drivers vulkan-tools libvulkan1

      - name: Build metadata
        id: build_metadata
        shell: bash
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Download Game
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.CWR_ARTIFACT_PREFIX }}-Game-${{ steps.build_metadata.outputs.sha_short }}
          path: exe

      - name: Report the adapter lavapipe offers
        run: |
          mkdir -p wgpu-start-probe
          # vulkaninfo's own summary is the second witness for whatever the game
          # log says about the adapter; capture it before the game runs so a
          # failure to start can be read against what the ICD actually offers.
          xvfb-run -a --server-args="$TRIDENT_XVFB_ARGS" \
            vulkaninfo --summary > wgpu-start-probe/vulkaninfo.txt 2>&1 || true
          sed -n '1,80p' wgpu-start-probe/vulkaninfo.txt || true
          echo "--- descriptorIndexing / vertexPipelineStoresAndAtomics ---"
          xvfb-run -a --server-args="$TRIDENT_XVFB_ARGS" vulkaninfo 2>/dev/null \
            | grep -iE "descriptorIndexing|vertexPipelineStoresAndAtomics|VK_EXT_descriptor_indexing" \
            | sort -u | head -40 || true

      - name: Try to start WGPU on lavapipe
        env:
          ALSOFT_DRIVERS: 'null'
          WGPU_BACKEND: vulkan
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          chmod +x exe/*
          set +e
          xvfb-run -a --server-args="$TRIDENT_XVFB_ARGS" \
            ./exe/PoseidonGame -C packages/Demo --window --check \
            --render wgpu --log-level info \
            > wgpu-start-probe/start.log 2>&1
          status=$?
          set -e
          echo "exit=$status"
          sed -n '1,400p' wgpu-start-probe/start.log
          # The verdict, stated so a reader does not have to infer it from a
          # green tick this job cannot produce anyway.
          if grep -q "wgpu renderer created" wgpu-start-probe/start.log; then
            echo "PROBE RESULT: WGPU STARTED on lavapipe. Gate bullet 5's start half is now reachable in CI."
          else
            echo "PROBE RESULT: WGPU did not start on lavapipe (exit=$status). Bullet 5 remains hardware-blocked."
          fi
          exit $status

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wgpu-start-probe-${{ steps.build_metadata.outputs.sha_short }}
          path: wgpu-start-probe
          if-no-files-found: ignore

  steamrt4:
    name: SteamRT4 Release
    runs-on: ubuntu-24.04
    env:
      STEAMRT4_PRESET: linux-x64-steamrt4
      STEAMRT4_VCPKG_TRIPLET: x64-linux-clang
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build SteamRT4 SDK image
        uses: docker/build-push-action@v7
        with:
          context: docker/steamrt4
          load: true
          tags: cwr-steamrt4:latest
          cache-from: type=gha,scope=steamrt4-sdk
          cache-to: type=gha,mode=max,scope=steamrt4-sdk

      - name: Restore SteamRT4 compiler cache
        uses: actions/cache@v6
        with:
          path: tmp/steamrt4-ccache
          key: ccache-SteamRT4-${{ env.STEAMRT4_PRESET }}-${{ github.sha }}
          restore-keys: |
            ccache-SteamRT4-${{ env.STEAMRT4_PRESET }}-

      - name: Restore SteamRT4 vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: .vcpkg-bincache/${{ env.STEAMRT4_VCPKG_TRIPLET }}
          key: vcpkg-SteamRT4-${{ env.STEAMRT4_VCPKG_TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-triplets/**', 'cmake/vcpkg-overlay-ports/**') }}
          restore-keys: |
            vcpkg-SteamRT4-${{ env.STEAMRT4_VCPKG_TRIPLET }}-

      - name: Build inside SteamRT4 container
        run: |
          set -o pipefail
          mkdir -p \
            "${{ github.workspace }}/tmp/steamrt4-ccache" \
            "${{ github.workspace }}/.vcpkg-bincache/${{ env.STEAMRT4_VCPKG_TRIPLET }}"
          docker run --rm \
            -e OFPR_TARGETS=all \
            -e VCPKG_BINARY_SOURCES="clear;files,/work/ofpr/.vcpkg-bincache/${{ env.STEAMRT4_VCPKG_TRIPLET }},readwrite" \
            -e VCPKG_DEFAULT_BINARY_CACHE="/work/ofpr/.vcpkg-bincache/${{ env.STEAMRT4_VCPKG_TRIPLET }}" \
            -e VCPKG_DEFAULT_TRIPLET="${{ env.STEAMRT4_VCPKG_TRIPLET }}" \
            -v "${{ github.workspace }}:/work/ofpr" \
            cwr-steamrt4:latest 2>&1 | tee steamrt4-build.log

      - name: Upload SteamRT4 build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: steamrt4-build-log
          path: steamrt4-build.log
